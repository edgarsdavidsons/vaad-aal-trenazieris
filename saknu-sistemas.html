<!doctype html><html lang="lv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nezāļu sakņu sistēmas · AAL trenažieris</title><style>body{margin:0;background:#f5f7f4;color:#1c2a23;font:16px system-ui}main{max-width:760px;margin:50px auto;padding:24px}header{background:#173b2d;color:white;border-radius:20px;padding:30px}h1{margin:6px 0}small{color:#a9c9b5}.card{background:white;border-radius:18px;padding:24px;margin-top:20px;box-shadow:0 10px 30px #14291a0a}button{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;background:#f3f7f2;border:1px solid #d9e4d7;border-radius:12px;font:inherit;cursor:pointer}button:hover{background:#dff0dd}button.correct{background:#d3f1d7;border-color:#53aa5e}button.wrong{background:#ffe0dd;border-color:#dd7e72}a{color:#bde58f}.muted{color:#627268}</style><main><header><small>VAAD · AAL 2. reģistrācijas klase</small><h1>Nezāļu sakņu sistēmas</h1><p>24 jautājumi par sakneņiem, sakņu dzinumiem un ierobežošanas metodēm.</p><a href="./">Atgriezties uz galveno trenažieri</a></header><div class="card"><div id="progress" class="muted"></div><h2 id="question"></h2><div id="answers"></div><p id="feedback"></p><button id="next" style="display:none;background:#183e2d;color:white" onclick="advance()">Nākamais jautājums →</button></div><p class="muted">Avots: “Nezāļu klasifikācija_krāsaina.pdf”. Neoficiāls mācību trenažieris.</p></main><script>const Q=[["Kas ir saknenis?","Pazemes stumbrs","Sēkla","Zieda daļa","Mietsakne"],["Kura nezāle izplatās ar sakneņiem?","Ložņu vārpata","Baltā balanda","Ganu plikstiņš","Tīruma naudulis"],["Kura nezāle izplatās ar sakņu dzinumiem?","Tīruma usne","Ganu plikstiņš","Balanda","Vēja auza"],["Kurai nezālei ir dziļa sakņu sistēma?","Ārstniecības pienene","Balanda","Parastā virza","Ganu plikstiņš"],["Kāpēc daudzgadīgās nezāles ataug pēc pļaušanas?","Saknēs un sakneņos uzkrāto rezervju dēļ","Jo sēklas uzreiz nobriest","Jo nezāles neizmanto gaismu","Jo tām nav sakņu"],["Kāpēc ar vienu pļaušanu bieži nepietiek?","Pazemes orgāni saglabājas dzīvi","Visas nezāles ir viengadīgas","Pļaušana vienmēr palielina sēklu skaitu","Saknes uzreiz atmirst"],["Kas atšķir sakneni no saknes?","Saknenis ir pārveidots stumbrs","Saknenis ir zieds","Saknenis ir sēkla","Saknenis neaug augsnē"],["Kas ir mērdēšana nezāļu ierobežošanā?","Atkārtota ataugšanas provocēšana un iznīcināšana, izsmeļot rezerves","Vienreizēja ražas novākšana","Nezāļu mēslošana","Sēklu izsēšana"],["Kas ir smacēšanas princips?","Kavēt ataugšanu, ierobežojot gaismu un augšanu","Regulāri laistīt nezāles","Ievākt sēklas","Padziļināt sēklu sēju"],["Kura ir daudzgadīga sakneņu nezāle?","Ložņu vārpata","Tīruma naudulis","Baltā balanda","Ganu plikstiņš"],["Kura ir īsmūža divdīgļlapju nezāle?","Baltā balanda","Ložņu vārpata","Tīruma kosa","Parastā vībotne"],["Kura ir īsmūža viendīgļlapju nezāle?","Vēja auza","Tīruma usne","Ārstniecības pienene","Tīruma tītenis"],["Ko nozīmē ziemotspējīga īsmūža nezāle?","Rudenī sadīgusi, tā var pārziemot un attīstību beigt nākamgad","Dzīvo tikai ziemā","Vienmēr ir daudzgadīga","Vairojas tikai ar sakneņiem"],["Kura nezāle ir ziemotspējīga īsmūža suga?","Ganu plikstiņš","Ložņu vārpata","Tīruma kosa","Tīruma usne"],["Kāpēc sakneņu sadrumstalošana var būt riskanta?","Atsevišķi fragmenti var veidot jaunus dzinumus","Tā vienmēr iznīcina visas rezerves","Tā aptur jebkādu ataugšanu","Sakneņi pārvēršas sēklās"],["Kad jāappļauj nezāles ceļmalās?","Pirms sēklu nogatavošanās","Tikai pēc sēklu izbiršanas","Vienīgi ziemā","Tikai pēc ražas novākšanas"],["Kas ir provokācijas metode?","Veicināt nezāļu sadīgšanu un pēc tam tās iznīcināt","Veicināt sēklu izplatīšanos","Nopļaut tikai kultūraugus","Pārtraukt augsnes novērošanu"],["Kas raksturīgs sakņu dzinumu nezālēm?","Jauni dzinumi var veidoties no saknēm","Tām nav pazemes orgānu","Tās vairojas tikai ar ziediem","Tās nekad neataug"],["Kura ir daudzgadīga nezāle ar dziļām saknēm?","Tīruma tītenis","Baltā balanda","Ganu plikstiņš","Vēja auza"],["Kas nosaka ierobežošanas paņēmienu, ja ir arī daudzgadīgas nezāles?","Daudzgadīgo nezāļu bioloģija un ataugšanas spēja","Tikai kultūrauga krāsa","Vienīgi kalendāra datums","Tikai nokrišņu daudzums"],["Kura sakneņu nezāle ir viendīgļlapis?","Ložņu vārpata","Tīruma usne","Parastā pienene","Tīruma tītenis"],["Kādēļ nezālēm noder pazemes rezerves?","Tās ļauj pārziemot un ataugt","Tās aizstāj fotosintēzi uz visiem laikiem","Tās neļauj vairoties","Tās iznīcina sēklas"],["Kura ir daudzgadīga divdīgļlapju nezāle?","Tīruma usne","Vēja auza","Zaļā sarene","Balanda"],["Kas ir veģetatīvā vairošanās?","Jaunu augu veidošanās no auga daļām","Tikai sēklu dīgšana","Tikai apputeksnēšana","Vienīgi ziedēšana"]];let n=0,score=0,done=false;function draw(){done=false;document.getElementById('progress').textContent='Jautājums '+(n+1)+' / '+Q.length+' · Pareizi: '+score;document.getElementById('question').textContent=Q[n][0];document.getElementById('feedback').textContent='';document.getElementById('next').style.display='none';const a=document.getElementById('answers');a.replaceChildren();const opts=Q[n].slice(1).sort(()=>Math.random()-.5);for(const v of opts){const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(done)return;done=true;if(v===Q[n][1])score++;for(const x of a.children){x.disabled=true;if(x.textContent===Q[n][1])x.className='correct';else if(x===b)x.className='wrong'}document.getElementById('feedback').textContent=v===Q[n][1]?'Pareizi!':'Pareizā atbilde: '+Q[n][1];document.getElementById('next').style.display='block';document.getElementById('next').textContent=n===Q.length-1?'Skatīt rezultātu':'Nākamais jautājums →'};a.append(b)}}function advance(){n++;if(n===Q.length){document.getElementById('progress').textContent='Pabeigts';document.getElementById('question').textContent=score+' / '+Q.length+' pareizi ('+Math.round(score/Q.length*100)+'%)';document.getElementById('answers').replaceChildren();document.getElementById('feedback').textContent='';document.getElementById('next').textContent='Mēģināt vēlreiz';document.getElementById('next').style.display='block';document.getElementById('next').onclick=()=>{n=0;score=0;document.getElementById('next').onclick=advance;draw()}}else draw()}draw();</script></html>
