ion||!Array.isArray(session.ids)||session.ids.some(i=>i>=QUESTIONS.length)){session={ids:mode==='exam'?randomize(pool.map(v=>v.i)).slice(0,30):pool.map(v=>v.i),at:0,answers:{},done:false};persist()}show()}function persist(){if(mode==='study')state.study[document.getElementById('topic').value]=session;else state.exam=session;save()}function switchTopic(){if(mode==='study')load()}function resetCurrent(){if(!confirm('Vai sākt šo režīmu no jauna? Iepriekšējais progress šajā režīmā tiks dzēsts.'))return;if(mode==='study')delete state.study[document.getElementById('topic').value];else state.exam=null;save();load()}function show(){document.getElementById('results').style.display='none';let done=session.at>=session.ids.length;document.getElementById('bar').value=Math.round(100*session.at/session.ids.length);document.getElementById('meta').textContent=(mode==='study'?'Mācības':'Eksāmens')+' · '+Math.min(session.at+1,session.ids.length)+' / '+session.ids.length+' · saglabāts automātiski';const area=document.getElementById('options');area.replaceChildren();document.getElementById('explain').textContent='';document.getElementById('next').hidden=true;if(done){let right=session.ids.filter(i=>session.answers[i]===QUESTIONS[i][1]).length;document.getElementById('question').textContent='Pabeigts! '+right+' / '+session.ids.length+' ('+Math.round(right*100/session.ids.length)+'%)';document.getElementById('meta').textContent='Tēma pabeigta. Vari sākt no jauna ar augšējo pogu.';return}let i=session.ids[session.at],q=QUESTIONS[i];document.getElementById('question').textContent=q[0];let answer=session.answers[i];let opts=randomize(q.slice(1,5));for(let v of opts){let b=document.createElement('button');b.className='opt';b.textContent=v;if(answer!==undefined){b.disabled=true;if(v===q[1]&&mode==='study')b.classList.add('ok');if(v===answer&&v!==q[1]&&mode==='study')b.classList.add('bad')}b.onclick=()=>pick(i,v);area.append(b)}if(answer!==undefined){if(mode==='study')document.getElementById('explain').textContent=(answer===q[1]?'✓ Pareizi. ':'Pareizā atbilde: '+q[1]+'. ')+q[5];document.getElementById('next').hidden=false}}function pick(i,v){if(session.answers[i]!==undefined)return;session.answers[i]=v;persist();show()}function advance(){session.at++;persist();show()}choose('study');</script></html>
