<script type="application/json" id="app-data">{"questions":[{"id":"T001","topic":"Pamati","q":"Ko augu aizsardzība cenšas pasargāt?","opts":["Kultūraugus, cilvēkus un vidi","Tikai kultūraugus","Tikai graudaugus","Tikai AAL lietotāju"],"why":"Augu aizsardzībā ietilpst kaitīgo organismu ierobežošana, cilvēku veselības un vides aizsardzība.","source":"AA"},{"id":"T002","topic":"Pamati","q":"Kura ir augu aizsardzības profilaktiska darbība?","opts":["Veselīga sēklas materiāla izmantošana","AAL devas dubultošana","Smidzināšana bez novērojumiem","Atkārtota viena kultūrauga audzēšana bez maiņas"],"why":"Veselīgs sēklas materiāls samazina slimību ievazāšanas risku.","source":"AA"},{"id":"T003","topic":"Pamati","q":"Kas ir augiem kaitīgs organisms?","opts":["Organisms, kas bojā augus vai augu produktus","Jebkura augsnē dzīvojoša baktērija","Tikai nezāle","Tikai kukainis ar spārniem"],"why":"Kaitīgie organismi aptver slimību izraisītājus, kaitēkļus un citus augu veselību apdraudošus organismus.","source":"AA"},{"id":"T004","topic":"Pamati","q":"Kura ir bioloģiska kaitēkļu ierobežošanas metode?","opts":["Dabisko ienaidnieku veicināšana","Herbicīda devas palielināšana","Smidzināšanas spiediena celšana","Augsnes pārkaļķošana"],"why":"Bioloģiskā aizsardzībā izmanto dabiskos ienaidniekus, piemēram, mārītes.","source":"AA"},{"id":"T005","topic":"Pamati","q":"Kāda ir mārīšu nozīme lauksaimniecībā?","opts":["Daudzas mārītes barojas ar laputīm","Mārītes izplata nezāļu sēklas","Mārītes izraisa graudaugu rūsu","Mārītes vienmēr bojā saknes"],"why":"Mārītes ir bieži nozīmīgi laputu dabiskie ienaidnieki.","source":"AA"},{"id":"T006","topic":"Pamati","q":"Kuru darbību pieskaita mehāniskai ierobežošanai?","opts":["Nezāļu ravēšanu un rušināšanu","Fungicīda izsmidzināšanu","Parazītisko kukaiņu izlaišanu","Sēklu kodināšanu"],"why":"Mehāniskās metodes kaitīgos organismus ierobežo ar fizisku darbību.","source":"AA"},{"id":"T007","topic":"Pamati","q":"Kāds ir augu aizsardzības lēmumu pamatmērķis?","opts":["Ierobežot kaitējumu, nepamatoti nepalielinot riskus","Izmantot visus pieejamos AAL","Panākt maksimālu smidzinājumu skaitu","Lietot tikai vienu AAL visiem kultūraugiem"],"why":"Lēmumus pieņem, vērtējot kaitējumu un izvēloties atbilstošas metodes.","source":"AA"},{"id":"T008","topic":"Pamati","q":"Kas vislabāk raksturo profilaksi kultūraugu audzēšanā?","opts":["Apstākļu radīšanu veselīgai kultūraugu augšanai","Tikai ārstējošu fungicīdu lietošanu","Smidzināšanu pēc kaimiņu grafika","Tikai kaitēkļu skaitīšanu"],"why":"Profilakse ietver sējas materiālu, augseku, mēslošanu un optimālus augšanas apstākļus.","source":"AA"},{"id":"T009","topic":"Pamati","q":"Kāpēc jāappļauj lauku malas pirms nezāļu sēklu nogatavošanās?","opts":["Lai samazinātu sēklu izplatību laukā","Lai palielinātu nezāļu sēklu rezervi","Lai nevajadzētu ievērot marķējumu","Lai paaugstinātu AAL toksiskumu"],"why":"Lauku malu kopšana ir viens no nezāļu profilakses paņēmieniem.","source":"AA"},{"id":"T010","topic":"Pamati","q":"Kurš pasākums galvenokārt ir fitosanitārs?","opts":["Karantīnas organisma izplatības ierobežošana","Augu mēslošana ar slāpekli","Smidzinātāja sprauslu nomaiņa","Augsnes kaļķošana"],"why":"Fitosanitārie pasākumi palīdz nepieļaut regulēto kaitīgo organismu ievešanu un izplatību.","source":"AA"},{"id":"T011","topic":"Pamati","q":"Kāpēc svarīga kultūrauga attīstības stadija?","opts":["AAL atļautais un efektīvais lietošanas laiks var būt saistīts ar stadiju","Tā nav svarīga, ja preparāts ir reģistrēts","Tā nosaka tikai traktora ātrumu","Tā aizstāj meteoroloģisko apstākļu pārbaudi"],"why":"Kultūrauga un kaitīgā organisma attīstības stadijas bieži ir norādītas marķējumā.","source":"KL"},{"id":"T012","topic":"Pamati","q":"Kuru avotu izmanto aktuālai informācijai par konkrēta AAL atļauto lietojumu Latvijā?","opts":["VAAD reģistru un apstiprināto marķējumu","Ārzemju interneta forumu","Paziņas pierakstus","Pagājušā gada reklāmu"],"why":"Atļautais lietojums jāvērtē pēc aktuālā reģistra un marķējuma.","source":"VAAD"},{"id":"T013","topic":"Pamati","q":"Kāds ir galvenais kaitīgo organismu monitoringa ieguvums?","opts":["Pamatot laiku un nepieciešamību ierobežošanai","Aizstāt smidzinātāja pārbaudi","Garantēt nulles kaitēkļu daudzumu","Atļaut lielāku AAL devu"],"why":"Novērojumi palīdz izvēlēties mērķtiecīgus augu aizsardzības pasākumus.","source":"AA"},{"id":"T014","topic":"Pamati","q":"Kas ir integrētai aizsardzībai pretējs ieradums?","opts":["Smidzināt profilakses vietā automātiski, nevērtējot vajadzību","Veikt kaitīgo organismu novērojumus","Mainīt kultūraugus","Ievērot marķējumu"],"why":"Nepamatota automātiska smidzināšana nav integrētās aizsardzības pieeja.","source":"AA"},{"id":"T015","topic":"Normatīvi","q":"Kādus AAL Latvijā drīkst lietot?","opts":["Latvijā reģistrētus, atbilstoši atļautajam lietojumam","Jebkurus ES iegādātus AAL","Jebkurus, kuru iepakojums ir latviski","Jebkurus augu mēslojumus pesticīdu vietā"],"why":"Reģistrācija un apstiprinātais marķējums nosaka atļauto izmantošanu.","source":"VAAD"},{"id":"T016","topic":"Normatīvi","q":"Kurš dokuments nosaka konkrētā AAL devu?","opts":["Apstiprinātais AAL marķējums","Traktora ekspluatācijas rokasgrāmata","Kaimiņu lietošanas pieredze","Lauka kadastra karte"],"why":"Marķējumā norādītas devas un izmantošanas prasības.","source":"KL"},{"id":"T017","topic":"Normatīvi","q":"Vai marķējumā neatļautu kultūraugu drīkst apstrādāt ar šo AAL?","opts":["Nē, ja nav attiecīga atļauta lietojuma","Jā, ja deva ir puse no norādītās","Jā, ja kultūraugs ir līdzīgs","Jā, ja līdzeklis iegādāts Latvijā"],"why":"Konkrētajam kultūraugam jābūt atļautam lietojumam.","source":"VAAD"},{"id":"T018","topic":"Normatīvi","q":"Kas ir nogaidīšanas laiks?","opts":["Laiks starp pēdējo apstrādi un atļauto ražas novākšanu","Laiks starp sēšanu un dīgšanu","Laiks smidzinātāja mazgāšanai","Laiks no AAL iegādes līdz atvēršanai"],"why":"Nogaidīšanas laiku nosaka marķējums, lai ievērotu pārtikas drošības prasības.","source":"KL"},{"id":"T019","topic":"Normatīvi","q":"Kas ir bezlietus periods marķējumā?","opts":["Laiks pēc apstrādes, kurā lietus var samazināt iedarbību","Laiks, kad līdzeklis jāglabā noliktavā","Laiks līdz nākamajai sējai","Laiks kopš pēdējās salnas"],"why":"Bezlietus perioda ievērošana palīdz saglabāt paredzēto efektivitāti.","source":"KL"},{"id":"T020","topic":"Normatīvi","q":"Kura iestāde uztur AAL reģistru Latvijā?","opts":["Valsts augu aizsardzības dienests","Centrālā vēlēšanu komisija","Ceļu satiksmes drošības direkcija","Nacionālais veselības dienests"],"why":"VAAD uzrauga augu aizsardzības līdzekļu apriti.","source":"VAAD"},{"id":"T021","topic":"Normatīvi","q":"Kāda apliecība paredzēta profesionālajam 2. reģistrācijas klases AAL lietotājam?","opts":["Profesionālā AAL lietotāja apliecība attiecīgajai klasei","Traktortehnikas vadītāja apliecība viena pati","Veterinārārsta sertifikāts","Jebkura arodizglītības apliecība bez pārbaudījuma"],"why":"VAAD nosaka profesionālā lietotāja apliecības saņemšanas kārtību.","source":"VAAD"},{"id":"T022","topic":"Normatīvi","q":"Cik ilgi derīga 2. reģistrācijas klases profesionālā AAL lietotāja apliecība?","opts":["5 gadus","1 gadu","10 gadus","Bez termiņa"],"why":"VAAD programmā norādīts piecu gadu derīgums.","source":"VAAD"},{"id":"T023","topic":"Normatīvi","q":"Kāds ir VAAD eksāmena sekmīga rezultāta slieksnis?","opts":["Vismaz 80% pareizu atbilžu","Vismaz 50%","Vismaz 60%","Obligāti 100%"],"why":"VAAD norāda 80 procentu slieksni.","source":"VAAD"},{"id":"T024","topic":"Normatīvi","q":"Kāds ir oficiālās pamatapmācības apjoms pirms eksāmena?","opts":["27 mācību stundas","6 mācību stundas","60 mācību stundas","100 mācību stundas"],"why":"VAAD programmā paredzētas 27 apmācības stundas un 3 stundas eksāmenam.","source":"VAAD"},{"id":"T025","topic":"Normatīvi","q":"Kāda ir pārbaudījuma forma atbilstoši VAAD aprakstam?","opts":["Rakstveida","Tikai praktiska smidzināšana","Tikai mutiska intervija","Tikai video pārbaude"],"why":"VAAD norāda rakstveida pārbaudījumu.","source":"VAAD"},{"id":"T026","topic":"Normatīvi","q":"Kuru informāciju par apstrādi svarīgi dokumentēt?","opts":["Lietoto AAL, apstrādes laiku, kultūraugu un vietu","Tikai traktora krāsu","Tikai operatora pusdienu laiku","Tikai degvielas cenu"],"why":"Uzskaite nepieciešama izsekojamībai un prasību pārbaudei.","source":"AA"},{"id":"T027","topic":"Normatīvi","q":"Kā rīkoties, ja marķējums nepieļauj konkrēto lietojumu?","opts":["Nelietot AAL šim mērķim","Samazināt devu un lietot","Sajaukt ar citu preparātu","Izmantot ārpus sezonas"],"why":"Marķējuma lietošanas ierobežojumi ir saistoši.","source":"VAAD"},{"id":"T028","topic":"Normatīvi","q":"Ko darīt, ja preparāts izņemts no reģistra?","opts":["Pārbaudīt aktuālo statusu un iespējamos izlietošanas termiņus VAAD","Lietot bez ierobežojumiem līdz iepakojuma beigām","Uzskatīt, ka jebkurš iegādes datums dod beztermiņa atļauju","Pārdot kā mēslojumu"],"why":"Reģistra izmaiņas var mainīt tirdzniecības un lietošanas tiesības.","source":"VAAD"},{"id":"T029","topic":"Normatīvi","q":"Kas jāievēro apstrādājot lauku ūdenstilpes tuvumā?","opts":["Konkrētā AAL marķējums un piemērojamās aizsargjoslu prasības","Tikai vēja virziens","Tikai augsnes tips","Tikai traktora riepu platums"],"why":"Vides ierobežojumus nosaka normatīvie akti un produkta marķējums.","source":"VAAD"},{"id":"T030","topic":"Normatīvi","q":"Kāda ir pareizā rīcība, iegādājoties aizdomīgi lētu AAL no nezināma tirgotāja?","opts":["Pārbaudīt legālu izcelsmi, reģistrāciju un neiegādāties aizdomīgu līdzekli","Pirkt vairāk, jo cena ir laba","Pārliet citā traukā","Lietot divkāršu devu"],"why":"Viltoti un nelegāli AAL var radīt risku ražai un veselībai.","source":"VAAD"},{"id":"T031","topic":"Normatīvi","q":"Vai AAL drīkst izmantot ārpus marķējumā norādītās sezonas vai stadijas?","opts":["Tikai tad, ja attiecīgais lietojums ir atļauts marķējumā","Vienmēr","Jā, ja laiks ir saulains","Jā, ja atlikuši tikai 2 litri"],"why":"Jāievēro arī lietošanas laiks un attīstības stadija.","source":"KL"},{"id":"T032","topic":"Normatīvi","q":"Kuram jānodrošina, lai izsmidzināmais AAL nenonāktu blakus īpašumā?","opts":["AAL lietotājam","Tikai blakus īpašniekam","Tikai preparāta importētājam","Tikai zemes mērniekam"],"why":"Lietotājs atbild par atbilstošu apstrādes veikšanu un noneses nepieļaušanu.","source":"VAAD"},{"id":"T033","topic":"AAL veidi","q":"Kādiem organismiem paredzēti herbicīdi?","opts":["Nezālēm","Sēnēm","Grauzējiem","Kukaiņiem"],"why":"Herbicīdi paredzēti nevēlamu augu ierobežošanai.","source":"KL"},{"id":"T034","topic":"AAL veidi","q":"Kādiem organismiem paredzēti fungicīdi?","opts":["Sēņu izraisītām augu slimībām","Kurmjiem","Nezālēm","Gliemežiem"],"why":"Fungicīdi iedarbojas uz sēņu ierosinātām slimībām.","source":"KL"},{"id":"T035","topic":"AAL veidi","q":"Kādiem organismiem paredzēti insekticīdi?","opts":["Kukaiņiem","Nezālēm","Sēnēm","Vīrusiem"],"why":"Insekticīdi ierobežo kukaiņu kaitēkļus.","source":"KL"},{"id":"T036","topic":"AAL veidi","q":"Kādiem organismiem paredzēti akaricīdi?","opts":["Ērcēm","Gliemežiem","Grauzējiem","Nezālēm"],"why":"Akaricīdu mērķorganismi ir ērces.","source":"KL"},{"id":"T037","topic":"AAL veidi","q":"Kādiem organismiem paredzēti limacīdi?","opts":["Gliemežiem","Kukaiņiem","Sēnēm","Baktērijām"],"why":"Limacīdus izmanto gliemežu ierobežošanai.","source":"KL"},{"id":"T038","topic":"AAL veidi","q":"Kādiem organismiem paredzēti rodenticīdi?","opts":["Grauzējiem","Nezālēm","Ērcēm","Sēnēm"],"why":"Rodenticīdi paredzēti grauzēju ierobežošanai.","source":"KL"},{"id":"T039","topic":"AAL veidi","q":"Kāda ir repelentu funkcija?","opts":["Atbaidīt noteiktus organismus","Paātrināt auga nobriešanu","Iznīcināt visas nezāles","Veicināt dīgšanu"],"why":"Repelenti atbaida mērķorganismus, nevis obligāti tos iznīcina.","source":"KL"},{"id":"T040","topic":"AAL veidi","q":"Ko izmanto auga augšanas procesa regulēšanai?","opts":["Augšanas regulatorus","Limacīdus","Akaricīdus","Rodenticīdus"],"why":"Augšanas regulatori ietekmē augu augšanas fizioloģiskos procesus.","source":"KL"},{"id":"T041","topic":"AAL veidi","q":"Kas ir desikants?","opts":["Līdzeklis augu daļu žāvēšanas veicināšanai","Līdzeklis gliemežu atbaidīšanai","Līdzeklis sēņu sporu veidošanai","Līdzeklis augļu krāsošanai"],"why":"Desikanti veicina augu izžūšanu atļautajā lietojumā.","source":"KL"},{"id":"T042","topic":"AAL veidi","q":"Kāda ir defolianta funkcija?","opts":["Veicināt lapu nobiršanu","Ierobežot grauzējus","Palielināt sakņu mezgliņu skaitu","Palielināt nezāļu dīgšanu"],"why":"Defolianti paredzēti lapu noņemšanai/nobiršanai noteiktos audzēšanas procesos.","source":"KL"},{"id":"T043","topic":"AAL veidi","q":"Ko nozīmē kontakta AAL iedarbība?","opts":["Iedarbojas galvenokārt saskares vietā","Vienmēr izplatās pa visu augu","Iedarbojas tikai caur saknēm","Iedarbojas tikai nākamajā sezonā"],"why":"Kontakta līdzekļa iedarbībai būtiska virsmas pārklāšana.","source":"KL"},{"id":"T044","topic":"AAL veidi","q":"Ko nozīmē sistēmas AAL iedarbība?","opts":["Darbīgā viela var pārvietoties auga audos","Darbīgā viela paliek tikai uz sprauslas","Līdzekli drīkst lietot bez marķējuma","Līdzeklis darbojas tikai tvertnē"],"why":"Sistēmas preparāts uzsūcas augā un noteiktā veidā pārvietojas tajā.","source":"KL"},{"id":"T045","topic":"AAL veidi","q":"Kas ir selektīvs herbicīds?","opts":["Tas noteiktos apstākļos ierobežo dažus augus, saudzējot kultūraugu","Tas iznīcina visus augus bez izņēmuma","Tas iedarbojas tikai uz gliemežiem","Tas iedarbojas tikai uz sēnēm"],"why":"Selektivitāti nosaka preparāta īpašības, kultūraugs un marķējumā atļautais lietojums.","source":"KL"},{"id":"T046","topic":"AAL veidi","q":"Ko nozīmē vispārējās iedarbības herbicīds?","opts":["Tas var bojāt plašu augu loku","Tas paredzēts tikai vienam kaitēklim","Tas vienmēr pilnīgi nekaitīgs kultūraugam","Tas iedarbojas tikai uz augsnes sēnēm"],"why":"Neselektīva iedarbība var skart vairākus augu veidus.","source":"KL"},{"id":"T047","topic":"AAL veidi","q":"Kāpēc kontakta fungicīdam svarīgs vienmērīgs lapu pārklājums?","opts":["Tas veido aizsargbarjeru uz apstrādātās virsmas","Tas pārvietojas tikai pa saknēm","Tas aizvieto augsnes barības vielas","Tas mehāniski izrauj nezāles"],"why":"Kontakta fungicīdu iedarbība lielā mērā ir saistīta ar apstrādāto virsmu.","source":"KL"},{"id":"T048","topic":"AAL veidi","q":"Kas ir sēklu kodne?","opts":["Preparāts sēklas materiāla aizsardzībai pirms sējas","Vienmēr insekticīds kultūraugu lapām","Ūdens mīkstinātājs","Granulēts mēslojums"],"why":"Kodnes izmanto sēklām atbilstoši konkrētajam reģistrētajam lietojumam.","source":"KL"},{"id":"T049","topic":"AAL veidi","q":"Vai sēklu kodni, kas paredzēta kodināšanai, drīkst automātiski izmantot lapu smidzināšanai?","opts":["Nē, ja tas nav reģistrēts šādam lietojumam","Jā, jebkurā koncentrācijā","Jā, ja pievieno mēslojumu","Jā, ja maina sprauslu"],"why":"Katram preparātam jāievēro atļautais lietojums.","source":"KL"},{"id":"T050","topic":"AAL veidi","q":"Kas ir darbīgā viela AAL?","opts":["Sastāvdaļa, kas nodrošina paredzēto bioloģisko iedarbību","Tikai iepakojuma krāsviela","Tikai ūdens šķīdinātājs","Preparāta svītrkods"],"why":"Darbīgā viela rada attiecīgo iedarbību uz mērķorganismu.","source":"KL"},{"id":"T051","topic":"AAL veidi","q":"Ko raksturo AAL preparatīvā forma?","opts":["Kādā tehnoloģiskā veidā formulēts produkts","Tikai tā tirgus cenu","Tikai tvertnes tilpumu","Tikai kultūrauga ražību"],"why":"Preparatīvā forma var būt, piemēram, granulas, suspensijas koncentrāts vai pulveris.","source":"KL"},{"id":"T052","topic":"AAL veidi","q":"Kas ir emulsijas koncentrāts?","opts":["Formulācija, ko atšķaidot ar ūdeni iegūst emulsiju","Tikai tīrs ūdens","Tikai smilšu un māla maisījums","Sēklu partijas nosaukums"],"why":"EC ir preparatīvās formas apzīmējums.","source":"KL"},{"id":"T053","topic":"AAL veidi","q":"Kurš iedalījums balstās uz mērķorganismu?","opts":["Herbicīdi, fungicīdi, insekticīdi","Granulas, pulveri, emulsijas","Kontakta, sistēmas, kombinētie","Organiskie, neorganiskie, bioloģiskie"],"why":"AAL var klasificēt pēc mērķorganisma, ķīmiskā sastāva, iedarbības veida un formas.","source":"KL"},{"id":"T054","topic":"AAL veidi","q":"Kura iedarbība raksturīga sistēmas insekticīdam?","opts":["Kaitēklis var saņemt vielu, barojoties ar apstrādāto augu","Preparāts darbojas tikai uz traktora riepām","Preparāts iedarbojas tikai uz augsnes skābumu","Preparāts aizstāj mehānisko ravēšanu"],"why":"Sistēmas insekticīda vielu var uzņemt kukainis barošanās laikā.","source":"KL"},{"id":"T055","topic":"AAL veidi","q":"Kāpēc atšķir kontakta un sistēmas fungicīdus?","opts":["Tiem atšķiras iedarbības un izplatīšanās veids augā","Tie abi vienmēr ir vienādi","Tiem atšķiras tikai iepakojuma izmērs","Viens ir mēslojums, otrs herbicīds"],"why":"Izvēloties fungicīdu, svarīgs iedarbības veids un konkrētā slimība.","source":"KL"},{"id":"T056","topic":"AAL veidi","q":"Kāda ir kombinētās iedarbības līdzekļa pazīme?","opts":["Tas apvieno vairāk nekā vienu iedarbības raksturu","Tas vienmēr satur tikai ūdeni","Tas darbojas tikai bez augiem","Tas obligāti vienmēr iznīcina visus organismu veidus"],"why":"Daži līdzekļi apvieno kontakta un sistēmiskas īpašības.","source":"KL"},{"id":"T057","topic":"Nezāles","q":"Kas ir segetālās nezāles?","opts":["Savvaļas augu sugas, kas ieviesušās sējumos","Tikai kultūraugi paredzētajā laukā","Tikai slimību izraisītāji","Tikai augļu koki"],"why":"Savvaļas augi lauksaimnieciskās platībās var kļūt par nezālēm.","source":"NE"},{"id":"T058","topic":"Nezāles","q":"Kas ir kondicionālās nezāles?","opts":["Kultūraugi, kas aug tiem neparedzētā vietā","Tikai sēnes uz lapām","Tikai kaitēkļu kāpuri","Tikai augu slimību sporas"],"why":"Piemēram, brīvprātīgi sadīguši iepriekšējā kultūrauga augi var būt nevēlami.","source":"NE"},{"id":"T059","topic":"Nezāles","q":"Kā galvenokārt vairojas īsmūža nezāles?","opts":["Ar sēklām","Tikai ar sakņu atvasēm","Tikai ar bumbuļiem","Tikai ar sīpoliem"],"why":"Īsmūža nezāles parasti ražo sēklas vienu reizi dzīves ciklā.","source":"NE"},{"id":"T060","topic":"Nezāles","q":"Kas raksturīgs daudzgadīgām nezālēm?","opts":["Tās dzīvo vairāk nekā divus gadus un var vairoties atkārtoti","Tās vienmēr iet bojā vienā vasarā","Tās nerada sēklas","Tām nekad nav sakņu"],"why":"Daudzgadīgām nezālēm bieži nozīmīga arī veģetatīvā vairošanās.","source":"NE"},{"id":"T061","topic":"Nezāles","q":"Kura ir raksturīga sakneņu nezāle?","opts":["Ložņu vārpata","Baltā balanda","Ganu plikstiņš","Parastā virza"],"why":"Ložņu vārpata veido pazemes sakneņus.","source":"NE"},{"id":"T062","topic":"Nezāles","q":"Kura ir tipiska ziemotspējīga īsmūža nezāle?","opts":["Ganu plikstiņš","Ložņu vārpata","Tīruma kosa","Tīruma usne"],"why":"Ganu plikstiņš var sadīgt rudenī un pārziemot.","source":"WIMG"},{"id":"T063","topic":"Nezāles","q":"Kura ir īsmūža viendīgļlapju nezāle?","opts":["Vējauza","Baltā balanda","Tīruma usne","Podagras gārsa"],"why":"Vējauza ir graudzāļu nezāle, kas vairojas ar sēklām.","source":"WIMG"},{"id":"T064","topic":"Nezāles","q":"Kura ir daudzgadīga nezāle?","opts":["Tīruma usne","Baltā balanda","Parastā virza","Ganu plikstiņš"],"why":"Tīruma usne veido spēcīgu sakņu sistēmu un ataug no sakņu dzinumiem.","source":"NE"},{"id":"T065","topic":"Nezāles","q":"Kas raksturīgs efemērām nezālēm?","opts":["Īss dzīves cikls un iespējamas vairākas paaudzes sezonā","Obligāti 5 gadu dzīves cikls","Vairošanās tikai ar bumbuļiem","Augšana tikai zem ūdens"],"why":"Parastā virza ir efemēras nezāles piemērs.","source":"NE"},{"id":"T066","topic":"Nezāles","q":"Kāpēc nezāļu sēklu krājumi augsnē rada ilgtermiņa problēmas?","opts":["Daudzu sugu sēklas saglabā dīgtspēju vairākus gadus","Visas sēklas iet bojā nedēļā","Tās nesadalās tikai ziemā","Tās nekad neuzdīgst"],"why":"Augsnes sēklu banka var pastāvīgi atjaunot nezāļu populāciju.","source":"NE"},{"id":"T067","topic":"Nezāles","q":"Kā nezāles var samazināt ražu?","opts":["Konkurējot par ūdeni, gaismu un barības vielām","Vienmēr uzlabojot fotosintēzi","Aizstājot visus kaitēkļus","Samazinot ūdens patēriņu laukā"],"why":"Nezāles konkurē ar kultūraugiem par svarīgiem augšanas faktoriem.","source":"NE"},{"id":"T068","topic":"Nezāles","q":"Kura nezāļu izplatīšanās metode raksturīga tīruma usnei?","opts":["Sēklas ar lidpūkām un sakņu dzinumi","Tikai sīpoli","Tikai lapu spraudeņi","Tikai ūdensaugu sporas"],"why":"Tīruma usne izmanto gan sēklas, gan sakņu dzinumus.","source":"NE"},{"id":"T069","topic":"Nezāles","q":"Kāpēc svarīgi novērst nezāļu sēklu nogatavošanos?","opts":["Lai nepapildinātu augsnes sēklu banku","Lai palielinātu rezistenci","Lai paātrinātu slimību izplatību","Lai uzlabotu nezāļu dīgšanu"],"why":"Nogatavojušās sēklas ir nākamo gadu nezāļainības avots.","source":"NE"},{"id":"T070","topic":"Nezāles","q":"Kas ir herbicīdu rezistence?","opts":["Nezāļu spēja pārdzīvot iedarbību, kas agrāk tās ierobežoja","Herbicīda aromāts","Visu kultūraugu dabiska imunitāte","Tikai augsnes mitruma zudums"],"why":"Rezistentas nezāļu populācijas var izdzīvot pēc iedarbīga līdzekļa izmantošanas.","source":"KL"},{"id":"T071","topic":"Nezāles","q":"Kas veicina herbicīdu rezistences izplatību?","opts":["Vienas iedarbības mehānisma grupas atkārtota lietošana","AAL darbīgo vielu rotācija","Augseka","Mehāniskas ierobežošanas iekļaušana"],"why":"Vienveidīga selekcijas slodze veicina rezistentu augu pārsvaru.","source":"KL"},{"id":"T072","topic":"Nezāles","q":"Ko nozīmē HRAC herbicīdu grupu klasifikācija?","opts":["Darbīgo vielu grupēšana pēc iedarbības mehānisma","Smidzinātāju marku saraksts","Augsnes pH klasifikācija","Sēklu kvalitātes kategorijas"],"why":"HRAC grupas izmanto rezistences pārvaldībai.","source":"KL"},{"id":"T073","topic":"Nezāles","q":"Kāpēc herbicīds var nenostrādāt pietiekami efektīvi?","opts":["Nepiemērota nezāļu stadija un meteoroloģiskie apstākļi","Tikai sējas lauka nosaukuma dēļ","Tāpēc, ka smidzinātājs ir zaļš","Tāpēc, ka kultūraugs ir garš"],"why":"Efektivitāti ietekmē deva, apstākļi, nezāļu attīstība un smidzināšanas kvalitāte.","source":"KL"},{"id":"T074","topic":"Nezāles","q":"Kāds nezāļu attīstības posms daudziem herbicīdiem ir īpaši piemērots?","opts":["Jaunu dīgstu stadija, ievērojot marķējumu","Tikai pēc pilnīgas sēklu nogatavošanās","Tikai pēc ražas novākšanas","Tikai ziemas vidū"],"why":"Jaunas nezāles bieži ir jutīgākas, tomēr jāievēro konkrētais marķējums.","source":"KL"},{"id":"T075","topic":"Nezāles","q":"Ko nozīmē veģetatīva nezāļu vairošanās?","opts":["Vairošanās no sakņu, stublāju vai citu orgānu daļām","Vairošanās tikai ar sēklām","Vairošanās tikai ar ziedputekšņiem","Vairošanās tikai ar sporām"],"why":"Daudzas daudzgadīgas nezāles spēj atjaunoties no sakneņiem vai sakņu dzinumiem.","source":"NE"},{"id":"T076","topic":"Nezāles","q":"Kāpēc aršana var palīdzēt nezāļu ierobežošanā?","opts":["Tā var aprakt vai iznīcināt nezāles un mainīt sēklu izvietojumu","Tā pilnībā iznīcina visas sēklas uz mūžu","Tā vienmēr aizstāj visas citas metodes","Tā garantē beznezāļu lauku"],"why":"Augsnes apstrāde ir daļa no integrētas nezāļu ierobežošanas, bet tai ir ierobežojumi.","source":"NE"},{"id":"T077","topic":"Nezāles","q":"Ko nozīmē nezāļu provocēšana?","opts":["Veicināt sēklu dīgšanu un pēc tam iznīcināt sadīgušās nezāles","Ļaut nezālēm visām izsēt sēklas","Palielināt minerālmēslu devu","Atstāt lauku bez apstrādes daudzus gadus"],"why":"Provocēšana izmanto nezāļu dīgšanas stimulēšanu, kam seko to ierobežošana.","source":"NE"},{"id":"T078","topic":"Nezāles","q":"Kādēļ mehanizētu nezāļu ierobežošanu plāno pēc sugas?","opts":["Sugas atšķiras pēc sakņu sistēmas un vairošanās veida","Visas nezāles vairojas identiski","Tikai lauka nosaukums ir svarīgs","Visām sēklām ir vienāds miera periods"],"why":"Dziļsakņu, sakneņu un sēklu nezālēm vajadzīga atšķirīga pieeja.","source":"NE"},{"id":"T079","topic":"Nezāles","q":"Kāda ir lauku malas appļaušanas agrīna ieguvuma būtība?","opts":["Samazināt nezāļu sēklu izplatību","Iznīcināt visus graudaugu kaitēkļus","Pilnīgi aizvietot augseku","Likvidēt herbicīdu rezistenci vienā dienā"],"why":"Appļaušana pirms sēklu veidošanās ir profilaktiska metode.","source":"NE"},{"id":"T080","topic":"Nezāles","q":"Kurš augs ir tipiska daudzgadīga sakņu dzinumu nezāle?","opts":["Tīruma mīkstpiene","Parastā virza","Baltā balanda","Vējauza"],"why":"Tīruma mīkstpiene spēj atjaunoties no sakņu sistēmas.","source":"NE"},{"id":"T081","topic":"Nezāles","q":"Kas parasti raksturo nezāles kā slimību vai kaitēkļu starpsaimniekus?","opts":["Tās var uzturēt patogēnus un kaitēkļus ārpus kultūrauga","Tās vienmēr iznīcina visus patogēnus","Tās izslēdz augsnes nogurumu","Tās nekad neietekmē augus"],"why":"Nezāles var sekmēt augu slimību un kaitēkļu saglabāšanos vidē.","source":"NE"},{"id":"T082","topic":"Augseka","q":"Kas ir augseka?","opts":["Pamatota kultūraugu un papuvju maiņa laikā un telpā","Vienas kultūras audzēšana bez pārtraukuma","Tikai sējas tehnoloģijas nosaukums","Tikai lauku aršanas grafiks"],"why":"Augseka tiek plānota atbilstoši saimniecības apstākļiem un kultūraugu prasībām.","source":"AUG"},{"id":"T083","topic":"Augseka","q":"Kas ir priekšaugs?","opts":["Augs, kas konkrētajā laukā audzēts pirms nākamās kultūras","Augs, kas aug blakus laukā","Pēdējais novāktais nezāļu augs","Tikai zaļmēslojums"],"why":"Priekšaugs ir kultūraugs, pēc kura tajā pašā laukā audzē pēcaugu.","source":"AUG"},{"id":"T084","topic":"Augseka","q":"Kas ir pēcaugs?","opts":["Kultūraugs, ko audzē tajā pašā laukā pēc iepriekšējā","Tikai ziemāju graudaugs","Nezāle, kas sadīgusi blakus","Tikai ganību zāle"],"why":"Pēcaugs seko priekšaugam augu maiņā.","source":"AUG"},{"id":"T085","topic":"Augseka","q":"Kāds ir viens no augsekas galvenajiem ieguvumiem?","opts":["Samazināt slimību un kaitēkļu uzkrāšanās risku","Nodrošināt pilnīgu nulles nezāļainību","Atcelt marķējuma prasības","Vienmēr palielināt herbicīda devu"],"why":"Kultūraugu maiņa pārtrauc daļai organismu piemērotu saimniekaugu nepārtrauktību.","source":"AUG"},{"id":"T086","topic":"Augseka","q":"Kāpēc augsekā maina augus ar atšķirīgām sakņu sistēmām?","opts":["Lai dažādi izmantotu augsnes slāņus un barības vielas","Lai visas saknes augtu vienā dziļumā","Lai nebūtu vajadzīgs ūdens","Lai vairs neveidotos trūdvielas"],"why":"Sakņu dziļums ietekmē augsnes resursu izmantošanu.","source":"AUG"},{"id":"T087","topic":"Augseka","q":"Kura augu grupa var saistīt atmosfēras slāpekli simbiozē?","opts":["Tauriņzieži","Visas stiebrzāles","Visas nezāles","Visi krustzieži"],"why":"Tauriņziežu sakņu gumiņbaktērijas piedalās slāpekļa saistīšanā.","source":"AUG"},{"id":"T088","topic":"Augseka","q":"Kas augsekā ir problēma, atkārtoti audzējot vienas dzimtas kultūraugus?","opts":["Līdzīgu slimību un kaitēkļu uzkrāšanās","Pilnīga slimību izzušana","Visu augsnes nezāļu pazušana","Automātiski neierobežots ražas pieaugums"],"why":"Vienas dzimtas augiem bieži ir kopīgi kaitīgie organismi.","source":"AUG"},{"id":"T089","topic":"Augseka","q":"Kā ziemā augu atliekas vai augsega palīdz videi?","opts":["Mazina barības vielu izskalošanās un erozijas risku","Palielina vēja eroziju","Veicina maksimālu nitrātu izskalošanos","Aizstāj sēklas kvalitāti"],"why":"Augu sega palīdz noturēt augsni un barības vielas.","source":"AUG"},{"id":"T090","topic":"Augseka","q":"Kurš ir makroelements augu barībā?","opts":["Slāpeklis","Bors","Cinks","Varš"],"why":"N ir makroelements, bet B, Zn un Cu ir mikroelementi.","source":"LAW"},{"id":"T091","topic":"Augseka","q":"Kurš ir mikroelements augu barībā?","opts":["Bors","Slāpeklis","Kālijs","Kalcijs"],"why":"Bors ir mikroelements, kas augiem nepieciešams nelielā daudzumā.","source":"LAW"},{"id":"T092","topic":"Augseka","q":"Ko apzīmē NPK mēslošanā?","opts":["Slāpekli, fosforu un kāliju","Nātriju, platīnu un kalciju","Niķeli, fosforu un kadmiju","Nezāles, puvi un kaitēkļus"],"why":"N = slāpeklis, P = fosfors, K = kālijs.","source":"LAW"},{"id":"T093","topic":"Augseka","q":"Kura ir fotosintēzes nepieciešamā izejviela?","opts":["Oglekļa dioksīds un ūdens","Tikai slāpekļa gāze","Tikai oglekļa monoksīds","Tikai minerāleļļa"],"why":"Fotosintēzē augi izmanto gaismu, CO2 un ūdeni organiskās vielas veidošanai.","source":"LAW"},{"id":"T094","topic":"Augseka","q":"Kas ir transpirācija?","opts":["Ūdens iztvaikošana no auga","Sēklu mehāniska kodināšana","Herbicīdu sintēze","Augsnes kaļķošana"],"why":"Transpirācija piedalās ūdens plūsmā un augu termoregulācijā.","source":"LAW"},{"id":"T095","topic":"Augseka","q":"Kāpēc sablīvēta augsne var apgrūtināt kultūraugu augšanu?","opts":["Samazinās gaisa apmaiņa un sakņu attīstības iespējas","Sablīvējums vienmēr palielina sakņu dziļumu","Augsnē vairs nav nepieciešams ūdens","Tas garantē vienmērīgu ražu"],"why":"Sakņu augšanai vajadzīga atbilstoša augsnes struktūra un gaisa režīms.","source":"LAW"},{"id":"T096","topic":"Augseka","q":"Kāds ir augu augšanas faktoru neaizstājamības likuma princips?","opts":["Viena būtiska augšanas faktora trūkumu pilnībā nekompensē cits","Mēslošana vienmēr aizstāj gaismu","Ūdens vienmēr aizstāj skābekli","Karstums vienmēr aizstāj barības vielas"],"why":"Augu attīstībai vajadzīgi visi būtiskie faktori piemērotā līmenī.","source":"LAW"},{"id":"T097","topic":"Augseka","q":"Kas palīdz nodrošināt atbilstošu mēslošanas plānu?","opts":["Augsnes analīzes un kultūraugu vajadzību izvērtēšana","Tikai ražas pārdošanas cena","Tikai traktora modelis","Tikai vēja virziens"],"why":"Augsnes analīzes palīdz pamatot mēslošanas devas.","source":"AA"},{"id":"T098","topic":"Augseka","q":"Kāpēc atšķirīgas kultūraugu grupas augsekā ir vērtīgas?","opts":["Tās dažādo augsnes resursu izmantošanu un kaitīgo organismu riskus","Visām ir identiska barības vielu iznese","Tās pilnīgi izslēdz vajadzību pēc monitoringa","Tās izslēdz augsnes pārbaudes"],"why":"Augu daudzveidība palīdz uzturēt agroekosistēmas stabilitāti.","source":"AUG"},{"id":"T099","topic":"Augseka","q":"Kā augseka var palīdzēt nezāļu ierobežošanai?","opts":["Dažādot sējas un novākšanas laikus un ierobežošanas iespējas","Vienmēr veicināt vienas nezāles dominancei","Aizliegt mehānisko apstrādi","Padarīt herbicīda devu neierobežotu"],"why":"Dažādas kultūras maina apstākļus, kuros nezāles konkurē.","source":"AUG"},{"id":"T100","topic":"Augseka","q":"Kāds ir blīva veselīga sējuma pozitīvais efekts attiecībā pret nezālēm?","opts":["Kultūraugs labāk konkurē par gaismu un resursiem","Nezāles vairs nespēj radīt sēklas jebkad","Var ignorēt slimības","AAL marķējums vairs nav vajadzīgs"],"why":"Optimāla sējuma biezība ir viens profilakses līdzeklis.","source":"AA"},{"id":"T101","topic":"Integrētā aizsardzība","q":"Kas ir integrētās augu aizsardzības pamatideja?","opts":["Apvienot profilaksi, novērojumus un pamatotu metožu izvēli","Lietot AAL visos laukos ik nedēļu","Izmantot tikai vienu herbicīdu","Ignorēt kaitēkļu dabiskos ienaidniekus"],"why":"Integrētā pieeja samazina nepamatotu iejaukšanos un riskus.","source":"AA"},{"id":"T102","topic":"Integrētā aizsardzība","q":"Kāpēc pirms AAL lietošanas veic lauka apsekošanu?","opts":["Lai noskaidrotu kaitīgo organismu klātbūtni un attīstības stadiju","Lai noteiktu traktora krāsu","Lai pārbaudītu pircēju skaitu","Lai aizvietotu AAL marķējumu"],"why":"Novērojumi palīdz lemt par nepieciešamību un laiku.","source":"AA"},{"id":"T103","topic":"Integrētā aizsardzība","q":"Kas ir ekonomiskais kaitīguma slieksnis?","opts":["Kaitīgā organisma līmenis, pie kura ierobežošana var būt ekonomiski pamatota","Vienmēr nulle kukaiņu","Pesticīda noliktavas minimālā temperatūra","Smidzinātāja rezervuāra tilpums"],"why":"Slieksnis palīdz salīdzināt paredzamo kaitējumu ar ierobežošanas izmaksām.","source":"PLUS"},{"id":"T104","topic":"Integrētā aizsardzība","q":"Kāpēc integrētajā aizsardzībā vērtē lauka vēsturi?","opts":["Tā palīdz prognozēt nezāles, slimības un kaitēkļus","Tā nosaka tikai zemes cenu","Tā aizstāj monitoringu uz mūžu","Tā atceļ laboratorijas analīzes"],"why":"Priekšaugs un iepriekšējās problēmas ietekmē risku nākamajā sezonā.","source":"AA"},{"id":"T105","topic":"Integrētā aizsardzība","q":"Kāds ir augu maiņas profilaktiskais ieguvums?","opts":["Pārtraukt dažu slimību un kaitēkļu attīstības ciklus","Garantēt absolūtu nekaitīgumu","Padarīt sēklu sertifikāciju lieku","Vienmēr aizstāt visas citas metodes"],"why":"Augseka var samazināt vieniem un tiem pašiem organismiem piemērotus apstākļus.","source":"AUG"},{"id":"T106","topic":"Integrētā aizsardzība","q":"Kāpēc kultūrauga šķirnes izvēle ir augu aizsardzības daļa?","opts":["Šķirnes atšķiras pēc izturības pret slimībām","Visām šķirnēm ir identiska izturība","Šķirne nosaka tikai lauka lielumu","Šķirne aizstāj darba drošību"],"why":"Šķirņu īpašības var samazināt saslimšanas risku.","source":"AA"},{"id":"T107","topic":"Integrētā aizsardzība","q":"Kas ir kaitīgo organismu prognozēšanas uzdevums?","opts":["Novērtēt iespējamo riska attīstību, lai plānotu ierobežošanu","Garantēt precīzu katra kukaiņa atrašanās vietu","Aizstāt visus uzskaites žurnālus","Noliktavā noteikt produktu cenu"],"why":"Prognoze kopā ar monitoringu palīdz noteikt apstrādes laiku.","source":"VAAD"},{"id":"T108","topic":"Integrētā aizsardzība","q":"Ko nozīmē mehāniskās un ķīmiskās metodes apvienošana?","opts":["Izvēlēties vairākus savstarpēji papildinošus ierobežošanas paņēmienus","Palielināt devas bez kontroles","Lietot vienu preparātu vairākus gadus","Smidzināt vēja laikā"],"why":"Integrētajā pieejā metodes papildina cita citu.","source":"AA"},{"id":"T109","topic":"Integrētā aizsardzība","q":"Kā dabisko ienaidnieku saglabāšana var samazināt kaitējumu?","opts":["Plēsēji un parazitoīdi ierobežo kaitēkļu populācijas","Tā vienmēr palielina laputu skaitu","Tā aizstāj jebkuru sēklas kvalitāti","Tā vienmēr iznīcina nezāļu sēklas"],"why":"Derīgie kukaiņi un putni var palīdzēt bioloģiskā ierobežošanā.","source":"AA"},{"id":"T110","topic":"Integrētā aizsardzība","q":"Kāpēc jāmaina AAL iedarbības mehānismi rezistences pārvaldībā?","opts":["Lai samazinātu vienveidīgu atlasi uz rezistentām populācijām","Lai palielinātu rezistento organismu skaitu","Lai nevajadzētu apsekot lauku","Lai izslēgtu kultūraugu maiņu"],"why":"Rotāciju kombinē ar neķīmiskām metodēm un marķējuma ievērošanu.","source":"KL"},{"id":"T111","topic":"Integrētā aizsardzība","q":"Kādēļ precīza nezāles sugas noteikšana ir svarīga?","opts":["Dažādas sugas atšķiras pēc bioloģijas un ierobežošanas iespējām","Visas sugas reaģē pilnīgi vienādi","Nezāles var noteikt tikai ziemā","Sugas noteikšana nepieciešama vienīgi herbārijam"],"why":"Pareiza identifikācija palīdz izvēlēties mērķtiecīgus paņēmienus.","source":"NE"},{"id":"T112","topic":"Integrētā aizsardzība","q":"Kas ir sējuma biezības ievērošanas ieguvums?","opts":["Līdzsvarota konkurētspēja un labvēlīgi augšanas apstākļi","Vienmēr biezāks sējums ir labāks","Tas ļauj neievērot šķirnes prasības","Tas atceļ lauka monitoringu"],"why":"Optimāla sējuma biezība palīdz samazināt stresu un nevēlamu konkurenci.","source":"AA"},{"id":"T113","topic":"Integrētā aizsardzība","q":"Kurš ir preventīvs augu slimību ierobežošanas pasākums?","opts":["Augu atlieku apsaimniekošana","Marķējuma ignorēšana","Augu blīvēšana neatkarīgi no šķirnes","Pārlieku liels slāpekļa daudzums"],"why":"Augu atliekās var saglabāties slimību ierosinātāji.","source":"AA"},{"id":"T114","topic":"Integrētā aizsardzība","q":"Kā rīkoties, ja lauka novērojumos nav pamatotas vajadzības pēc AAL?","opts":["Izvērtēt iespēju neapstrādāt un turpināt novērojumus","Automātiski smidzināt ar maksimālo devu","Lietot nelegālu līdzekli","Vienmēr apstrādāt divreiz"],"why":"Integrētā pieejā AAL lietošana ir pamatots lēmums, nevis automātisks solis.","source":"AA"},{"id":"T115","topic":"Integrētā aizsardzība","q":"Kura metode vislabāk palīdz novērtēt kaitēkļu daudzumu laukā?","opts":["Regulāri lauka novērojumi un piemēroti slazdi","Tikai mēslojuma etiķetes lasīšana","Tikai traktora riepu apskate","Tikai ražas cenas salīdzināšana"],"why":"Slazdi un apsekojumi palīdz novērot populācijas dinamiku.","source":"PLUS"},{"id":"T116","topic":"Slimības un kaitēkļi","q":"Kura pazīme var būt raksturīga miltrasai?","opts":["Balts, miltains apsarms uz auga daļām","Tikai sakņu veidošanās","Tikai lapu palielināšanās","Tikai augļu sarkanā krāsa"],"why":"Daudziem miltrasas ierosinātājiem raksturīgs balts apsarms.","source":"KL"},{"id":"T117","topic":"Slimības un kaitēkļi","q":"Kā bieži izskatās augu rūsa?","opts":["Brūni vai oranži sporu spilventiņi","Tikai mehāniski nogriezts stublājs","Tikai pilnīgi balts saknenis","Vienmēr caurspīdīgas lapas"],"why":"Rūsas slimībām raksturīgi sporu veidojumi uz augu daļām.","source":"PLUS"},{"id":"T118","topic":"Slimības un kaitēkļi","q":"Kāda var būt augu puves pazīme?","opts":["Augu audu sadalīšanās un mīkstināšanās","Vienmēr tikai garāki stublāji","Vienmēr tikai lapu zaļuma pieaugums","Tikai ziedēšanas sākums"],"why":"Puves var skart saknes, stublājus vai uzglabājamos produktus.","source":"KL"},{"id":"T119","topic":"Slimības un kaitēkļi","q":"Kurš faktors palīdz sēņu slimību izplatībai?","opts":["Piemērots mitrums un temperatūra","Vienmēr pilnīgs sausums","Tikai traktora krāsa","Tikai minerālmēslu nosaukums"],"why":"Daudzu patogēnu izplatību veicina mitri apstākļi.","source":"KL"},{"id":"T120","topic":"Slimības un kaitēkļi","q":"Kā slimību ierosinātāji var nonākt līdz augiem?","opts":["Ar vēju, lietu, sēklām vai augsni","Tikai caur kombaina vadītāja telefonu","Tikai caur saules gaismu","Tikai caur augsnes kaļķi"],"why":"Infekcijas avoti un pārneses ceļi atšķiras pēc patogēna.","source":"KL"},{"id":"T121","topic":"Slimības un kaitēkļi","q":"Kāpēc svarīgs veselīgs sēklas materiāls?","opts":["Tas mazina dažu ar sēklām pārnēsājamu slimību risku","Tas garantē, ka nezāļu nebūs nekad","Tas aizvieto augsnes apstrādi","Tas aizvieto AAL marķējumu"],"why":"Sēklas materiāls var būt infekcijas avots.","source":"AA"},{"id":"T122","topic":"Slimības un kaitēkļi","q":"Kurš kaitēklis var sūkt augu sulu?","opts":["Laputs","Slieka","Skrejvabole, kas medī citus kukaiņus","Gaiļsāre"],"why":"Laputīm ir dūrējsūcējtipa mutes orgāni.","source":"PLUS"},{"id":"T123","topic":"Slimības un kaitēkļi","q":"Kas raksturīgs grauzējtipa mutes orgāniem?","opts":["Kaitēklis grauž auga audus","Kaitēklis tikai sūc augu sulu","Kaitēklis fotosintezē","Kaitēklis vienmēr ir augs"],"why":"Mutes orgānu veids palīdz skaidrot bojājumu pazīmes.","source":"KL"},{"id":"T124","topic":"Slimības un kaitēkļi","q":"Kas ir nematodes?","opts":["Sīki veltnīštārpi, no kuriem daļa ir augu parazīti","Tikai grauzēji","Tikai sēņu sporas","Tikai nezāles"],"why":"Dažas nematodes bojā saknes un citas augu daļas.","source":"AA"},{"id":"T125","topic":"Slimības un kaitēkļi","q":"Kādi bojājumi var liecināt par augu parazītiskajām nematodēm?","opts":["Sakņu bojājumi un vāja augu attīstība","Tikai putnu ligzdas","Tikai lapu apsarmojums pēc salnas","Tikai sēklu krāsa"],"why":"Parazītiskās nematodes var traucēt sakņu funkciju.","source":"PLUS"},{"id":"T126","topic":"Slimības un kaitēkļi","q":"Kāda ir bioloģiskā atšķirība starp kukaini un ērci?","opts":["Pieaugušai ērcei parasti ir 4 pāri kāju, kukainim 3","Pieaugušiem kukaiņiem ir 5 pāri kāju","Visas ērces ir spārnotas","Visiem kukaiņiem ir 4 pāri kāju"],"why":"Ērces ir zirnekļveidīgie, kukaiņi parasti ar trim kāju pāriem.","source":"PLUS"},{"id":"T127","topic":"Slimības un kaitēkļi","q":"Kurš ir labvēlīgs dabiskā kaitēkļu ierobežošanā?","opts":["Zeltactiņas kāpurs","Laputu kolonija","Kartupeļu lapgrauža kāpurs","Tīruma usne"],"why":"Zeltactiņu kāpuri barojas ar dažādiem mīkstķermeņa kaitēkļiem.","source":"AA"},{"id":"T128","topic":"Slimības un kaitēkļi","q":"Kādi bojājumi bieži raksturīgi lapgraužu kāpuriem?","opts":["Izgrauzti lapu audi","Tikai dziļas kurmju alas","Tikai lapu miltains apsarms","Tikai augsnes pH pieaugums"],"why":"Daudzi lapgrauži un to kāpuri grauž lapas.","source":"PLUS"},{"id":"T129","topic":"Slimības un kaitēkļi","q":"Ko nozīmē slimības inkubācijas vai latentais periods?","opts":["Laiks starp inficēšanos un pamanāmiem simptomiem","Laiks starp sēšanu un kulšanu","Laiks traktora uzpildei","Herbicīda derīguma termiņš"],"why":"Daudzi patogēni attīstās pirms redzamu simptomu parādīšanās.","source":"PLUS"},{"id":"T130","topic":"Slimības un kaitēkļi","q":"Kas ir mikotoksīni?","opts":["Dažu sēņu veidotas toksiskas vielas","AAL iepakojuma krāsvielas","Slāpekļa mēslojuma granulas","Viens no smidzinātāja sprauslu tipiem"],"why":"Dažas Fusarium sēnes var veidot mikotoksīnus graudos.","source":"AA"},{"id":"T131","topic":"Slimības un kaitēkļi","q":"Kāpēc fungicīda lietošanas laiks ir būtisks?","opts":["Līdzekļa efektivitāte atkarīga no slimības un kultūrauga stadijas","Visi fungicīdi darbojas identiski jebkurā laikā","Līdzekli jālieto tikai pēc ražas pārdošanas","Fungicīdam nav jābūt reģistrētam"],"why":"Savlaicīga diagnostika un marķējuma ievērošana ir izšķiroša.","source":"KL"},{"id":"T132","topic":"Slimības un kaitēkļi","q":"Kura augu slimību grupa pieder pie sēņu slimību tipiskām izpausmēm?","opts":["Rūsas un miltrasas","Kurmju rakumi","Gliemežu dējumi","Vējauza un rudzusmilga"],"why":"Rūsas un miltrasas ir pazīstamas augu slimību grupas.","source":"KL"},{"id":"T133","topic":"Slimības un kaitēkļi","q":"Kas ir kaitēkļa attīstības cikls?","opts":["Tā attīstības posmu secība no olas vai cita sākuma līdz pieaugušam organismam","Tikai ražas novākšanas grafiks","Tikai saules aptumsuma periods","Tikai AAL noliktavas grafiks"],"why":"Kāpuru un pieaugušo kaitēkļu jutība un bojājumi var atšķirties.","source":"PLUS"},{"id":"T134","topic":"Slimības un kaitēkļi","q":"Kā var mazināt kaitēkļu izplatību neķīmiski?","opts":["Veicināt dabiskos ienaidniekus un izmantot augseku","Visus kukaiņus iznīcināt neatkarīgi no nozīmes","Lietot nelegālus AAL","Vienmēr palielināt tvertnes spiedienu"],"why":"Neķīmiskās metodes ir integrētas augu aizsardzības sastāvdaļa.","source":"AA"},{"id":"T135","topic":"Drošība un vide","q":"Kā pareizi izvēlas individuālos aizsardzības līdzekļus?","opts":["Atbilstoši konkrētā AAL marķējumam un drošības prasībām","Pēc krāsas","Tikai pēc laikapstākļiem","Vienmēr bez cimdiem"],"why":"Riski un aizsardzība atšķiras pēc preparāta un darba veida.","source":"VAAD"},{"id":"T136","topic":"Drošība un vide","q":"Kas jādara, ja AAL šķidrums nonāk acīs?","opts":["Nekavējoties skalot ar tīru ūdeni un meklēt medicīnisku palīdzību atbilstoši situācijai","Berzēt acis ar sausu drānu","Turpināt smidzināšanu","Ieliet citu pesticīdu"],"why":"Pirmā palīdzība jāsniedz pēc drošības datu lapas/marķējuma un medicīnas speciālistu norādījumiem.","source":"VAAD"},{"id":"T137","topic":"Drošība un vide","q":"Kā rīkoties smagas aizdomīgas saindēšanās gadījumā?","opts":["Pārtraukt iedarbību un zvanīt 113 vai 112","Izraisīt vemšanu jebkurā gadījumā","Dot alkoholu","Gaidīt līdz nākamajai dienai"],"why":"Nopietnu simptomu gadījumā svarīga ātra neatliekamā palīdzība.","source":"VAAD"},{"id":"T138","topic":"Drošība un vide","q":"Vai saindēšanās gadījumā vienmēr drīkst izraisīt vemšanu?","opts":["Nē, bez mediķu norādījuma to nedara","Jā, visos gadījumos","Jā, ja persona bezsamaņā","Jā, lietojot koncentrētu AAL"],"why":"Patvaļīga vemšanas izraisīšana var palielināt kaitējumu.","source":"PLUS"},{"id":"T139","topic":"Drošība un vide","q":"Kas ir AAL nonese?","opts":["Smidzinājuma pilienu pārnese ārpus mērķa zonas","Augsnes regulēta skābuma izmaiņa","Tikai ūdens iztvaikošana no lapām","Sēklu izsējas norma"],"why":"Nonese var radīt nevēlamu iedarbību uz blakus augiem un vidi.","source":"VAAD"},{"id":"T140","topic":"Drošība un vide","q":"Ko darīt, ja vējš izraisa smidzinājuma nonesi uz blakus teritoriju?","opts":["Pārtraukt darbu un atsākt tikai piemērotos apstākļos","Palielināt spiedienu un turpināt","Smidzināt ātrāk","Atvērt vairāk sprauslu"],"why":"Jānovērš preparāta nonākšana ārpus apstrādājamās zonas.","source":"VAAD"},{"id":"T141","topic":"Drošība un vide","q":"Kāpēc jāievēro ūdenstilpju aizsargjoslas?","opts":["Lai nepieļautu ūdens un ūdens organismu piesārņojumu","Lai palielinātu lietoto AAL daudzumu","Lai samazinātu sēklu kvalitāti","Lai paaugstinātu ūdens iztvaikošanu"],"why":"Aizsargjoslas palīdz ierobežot piesārņojuma risku.","source":"VAAD"},{"id":"T142","topic":"Drošība un vide","q":"Kā droši glabā AAL?","opts":["Oriģinālā iepakojumā, norādītajos drošajos apstākļos","Kopā ar pārtiku","Dzērienu pudelēs","Brīvi bērniem pieejamā plauktā"],"why":"Pārtikas/barības piesārņojumu un nepiederošu personu piekļuvi nedrīkst pieļaut.","source":"VAAD"},{"id":"T143","topic":"Drošība un vide","q":"Ko darīt ar nezināma sastāva pārlietu ķīmisko šķidrumu?","opts":["Nelietot un identificēt drošā kārtībā","Izsmidzināt uz lauka","Ieliet lopbarības tvertnē","Atšķaidīt un izmantot bez pārbaudes"],"why":"Nezināms sastāvs un marķējuma trūkums padara lietošanu bīstamu.","source":"PLUS"},{"id":"T144","topic":"Drošība un vide","q":"Kas svarīgi, gatavojot AAL darba šķīdumu?","opts":["Izmantot norādīto aizsardzību un ievērot marķējumā noteikto kārtību","Vienmēr jaukt visas ķimikālijas kopā","Gatavot šķīdumu pie dzeramā ūdens bez aizsardzības","Nepārbaudīt devu"],"why":"Koncentrāta apstrādē ekspozīcijas risks var būt īpaši augsts.","source":"VAAD"},{"id":"T145","topic":"Drošība un vide","q":"Kāpēc bitēm bīstami AAL prasa īpašu piesardzību?","opts":["Tie var apdraudēt apputeksnētājus un citus derīgos kukaiņus","Tie vienmēr uzlabo bišu dzīvi","Tie vienmēr ir nekaitīgi ziedēšanas laikā","Tiem nekad nav lietošanas ierobežojumu"],"why":"Jāievēro marķējuma apputeksnētāju aizsardzības prasības.","source":"VAAD"},{"id":"T146","topic":"Drošība un vide","q":"Kā jāuzvedas, ja notikusi AAL noplūde?","opts":["Norobežot risku, nepieļaut izplatību un ievērot avārijas instrukciju","Noskalot tieši kanalizācijā","Atstāt bez uzraudzības","Savākt ar kailām rokām"],"why":"Prioritāte ir cilvēku drošība un vides piesārņojuma nepieļaušana.","source":"VAAD"},{"id":"T147","topic":"Drošība un vide","q":"Kāpēc AAL nedrīkst pārliet dzērienu pudelēs?","opts":["Tās var kļūdaini uzskatīt par dzēri
