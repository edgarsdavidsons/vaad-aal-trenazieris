ē","Ierīvēt šūnsulu","Turpināt darbu kailām rokām"],"why":"Sula ir fototoksiska.","source":"PRACT"},{"id":"ADV053","topic":"Praktiskās situācijas","q":"AAL izlijis blakus drenāžas akai. Kā rīkoties?","opts":["Pasargāt sevi, nepieļaut noplūdi kanalizācijā un ievērot avārijas norādījumus","Noskalot akā ar ūdeni","Ignorēt","Sajaukt ar citu AAL"],"why":"Prioritāte ir cilvēku un vides aizsardzība.","source":"PRACT"},{"id":"ADV054","topic":"Praktiskās situācijas","q":"Pirms smidzināšanas konstatēta bojāta sprausla. Ko darīt?","opts":["Salabot vai nomainīt un pārbaudīt vienmērīgumu","Palielināt devu","Turpināt bez izmaiņām","Atvienot vienu sekciju bez aprēķiniem"],"why":"Bojāta sprausla var izraisīt nevienmērīgu klājumu.","source":"PRACT"},{"id":"ADV055","topic":"Praktiskās situācijas","q":"Laukā dominē ložņu vārpata. Kāpēc viena virspusēja apstrāde var būt nepietiekama?","opts":["Dzīvotspējīgi sakneņi var saglabāties","Vārpatai nav sakņu","Tā nevairojas veģetatīvi","Tā vienmēr iet bojā ar vienu pļaušanu"],"why":"Jāizvērtē daudzgadīgo sakneņu nezāļu bioloģija.","source":"PRACT"},{"id":"ADV056","topic":"Praktiskās situācijas","q":"Pēc apstrādes sākas spēcīgs lietus agrāk par marķējumā paredzēto bezlietus periodu. Ko darīt?","opts":["Novērtēt efektivitāti un turpmāk ievērot marķējuma laika prasības","Automātiski atkārtot dubultu devu","Ignorēt marķējumu","Smidzināt lietū vēlreiz"],"why":"Lietus var samazināt iedarbību; atkārtota lietošana nav automātiski atļauta.","source":"PRACT"},{"id":"ADV057","topic":"Praktiskās situācijas","q":"Uz auga lapas ir plankumi; līdzīgi izskatās arī barības vielu trūkums. Ko darīt?","opts":["Veikt diferenciāldiagnostiku, nevis minēt","Vienmēr izvēlēties fungicīdu","Vienmēr izvēlēties insekticīdu","Vienmēr lietot vairāk slāpekļa"],"why":"Līdzīgus simptomus var izraisīt dažādi cēloņi.","source":"PRACT"},{"id":"ADV058","topic":"Praktiskās situācijas","q":"Saimniecībā vairākus gadus audzē tikai kviešus. Kas ir saprātīgs ilgtermiņa uzlabojums?","opts":["Dažādot augseku un kaitīgo organismu ierobežošanas metodes","Atstāt tikai vienu darbīgo vielu","Vairākus gadus lietot vienu devu neatkarīgi no situācijas","Pārtraukt monitoringu"],"why":"Augseka palīdz pārtraukt slimību, nezāļu un kaitēkļu ciklus.","source":"PRACT"},{"id":"ADV059","topic":"Praktiskās situācijas","q":"AAL marķējumā nav norādīts atļauts lietojums konkrētajam kaitēklim un kultūraugam. Ko darīt?","opts":["Šim nolūkam līdzekli nelietot","Lietot pēc analoģijas","Samazināt devu pēc izjūtas","Sajaukt ar citu līdzekli"],"why":"Jāievēro reģistrētais lietojums.","source":"PRACT"},{"id":"ADV060","topic":"Praktiskās situācijas","q":"Smidzinātāja tvertne ir puspiepildīta, un nav zināma iepriekšējā līdzekļa izcelsme. Ko darīt?","opts":["Neizmantot nezināmo maisījumu un ievērot drošu atkritumu apsaimniekošanu","Pievienot citu AAL","Izsmidzināt tuvākajā laukā","Izliet grāvī"],"why":"Nezināma sastāva AAL maisījums rada drošības un tiesiskus riskus.","source":"PRACT"},{"id":"ADV061","topic":"Praktiskās situācijas","q":"Laukā novēroti daži kaitēkļi, bet bojājuma līmenis neliels. Pareizā izvērtēšana?","opts":["Sugas, izplatības, prognozes un ekonomiskā sliekšņa pārbaude","Automātiska insekticīda lietošana","Automātiska jebkura fungicīda lietošana","Ignorēt kaitēkļa identitāti"],"why":"Integrētā aizsardzība balstās monitoringa datos.","source":"PRACT"},{"id":"ADV062","topic":"Praktiskās situācijas","q":"Pirms AAL iegādes piedāvāts aizdomīgi lēts preparāts bez latviska marķējuma. Ko darīt?","opts":["Nepirkt, pārbaudīt legālu izcelsmi un reģistrāciju","Pirkt un izmēģināt uz pārtikas kultūras","Pārliet citā pudelē","Ignorēt reģistrāciju"],"why":"Nelegāli preparāti var būt viltoti vai neatbilstoši.","source":"PRACT"},{"id":"ADV063","topic":"Praktiskās situācijas","q":"Pēc apstrādes lapas ir bojātas, bet nezāles saglabājušās. Ko analizēt?","opts":["Selektivitāti, attīstības stadiju, devu un meteoroloģiju","Tikai lauka platību","Tikai traktora marku","Tikai dienas nosaukumu"],"why":"Nesekmīga iedarbība un fitotoksicitāte jāizvērtē kompleksi.","source":"PRACT"},{"id":"ADV064","topic":"Praktiskās situācijas","q":"Blakus teritorijā atrodas dīķis. Kas īpaši būtiski?","opts":["Aizsargjoslas, aiznese un noteces risks","Tikai augu augstums","Tikai miglas krāsa","Tikai iepakojuma izmērs"],"why":"Ūdensobjektu aizsardzība ir daļa no marķējuma prasībām.","source":"PRACT"},{"id":"ADV065","topic":"Praktiskās situācijas","q":"Sprauslu pārbaude rāda ļoti atšķirīgas plūsmas. Ko darīt?","opts":["Veikt remontu, nomaiņu un atkārtotu kalibrāciju","Palielināt kopējo devu","Neregulēt smidzinātāju","Vienmēr smidzināt ātrāk"],"why":"Nevienmērīgas sprauslu plūsmas rada devas svārstības.","source":"PRACT"},{"id":"ADV066","topic":"Praktiskās situācijas","q":"Laukā atrasta nezāle ar iespējamiem sakņu dzinumiem. Kāpēc tas svarīgi?","opts":["Iespējama ataugšana no saknes fragmentiem","Tā nevar būt daudzgadīga","Sēklas vairs nav svarīgas","Nepieciešama tikai pļaušana vienreiz"],"why":"Sakņu dzinumu nezāles jāierobežo ilgtermiņā.","source":"PRACT"},{"id":"ADV067","topic":"Vizuālā diagnostika","q":"Kura pazīme liecina par sakneņu sistēmu?","opts":["Horizontāli pazemes stumbri ar pumpuriem","Tikai vertikāla mietsakne","Tikai virszemes ziedi","Tikai sēklu krāsa"],"why":"Sakneņi ir pazemes stumbri, kas veido jaunus dzinumus.","source":"PRACT","image":"ADVIMG_rhizome"},{"id":"ADV068","topic":"Vizuālā diagnostika","q":"Kāda sakņu sistēma attēlota shēmā?","opts":["Mietsakne ar sānsaknēm","Bārkšsakņu sistēma","Tikai gaisa saknes","Sakneņu tīkls"],"why":"Izteikta centrālā sakne raksturīga mietsaknei.","source":"PRACT","image":"ADVIMG_taproot"},{"id":"ADV070","topic":"Vizuālā diagnostika","q":"Kādu nezāļu vairošanās mehānismu parāda shēma?","opts":["Sakņu dzinumu veidošanos","Tikai sēklu izplatīšanos","Apputeksnēšanos","Sēklu kodināšanu"],"why":"No saknes veidojas jauni virszemes dzinumi.","source":"PRACT","image":"ADVIMG_rootshoot"},{"id":"ADV071","topic":"Vizuālā diagnostika","q":"Kura shēmas daļa liecina par augsnes slāņos esošu nezāļu rezervi?","opts":["Pazemes saknenis ar pumpuriem","Virsējais zieds","Atsevišķa lapa","Saules gaisma"],"why":"Sakneņu pumpuri ir jaunu dzinumu sākumpunkti.","source":"PRACT","image":"ADVIMG_rhizome"},{"id":"ADV072","topic":"Vizuālā diagnostika","q":"Ko attēlā parāda daudzās tievās saknes?","opts":["Bārkšsakņu sistēmu","Vienu mietsakni","Zieda orgānus","Lidpūkas"],"why":"Šis ir raksturīgs bārkšsakņu attēlojums.","source":"PRACT","image":"ADVIMG_fibrous"},{"id":"ADV073","topic":"Vizuālā diagnostika","q":"Kura shēma vairāk raksturīga vairākiem divdīgļlapjiem?","opts":["Izteikta mietsakne","Tikai paralēlas saknes","Bezsakņu stumbrs","Tikai pazemes bumbuļi"],"why":"Daudziem divdīgļlapjiem ir mietsaknes sistēma.","source":"PRACT","image":"ADVIMG_taproot"},{"id":"ADV074","topic":"Vizuālā diagnostika","q":"Kas veido jaunu augu sakņu dzinumu shēmā?","opts":["Pumpurs uz saknes","Vainaglapa","Sēklu apvalks","Ziedputekšņi"],"why":"Sakņu dzinumi attīstās no sakņu pumpuriem.","source":"PRACT","image":"ADVIMG_rootshoot"},{"id":"ADV075","topic":"Vizuālā diagnostika","q":"Attēlotā platā, horizontālā sistēma palīdz nezālei galvenokārt kā?","opts":["Veģetatīvi izplatīties un ataugt","Tikai apputeksnēties","Tikai pārnest sēklas pa gaisu","Tikai veidot ziedus"],"why":"Horizontālie pazemes dzinumi veicina izplatīšanos.","source":"PRACT","image":"ADVIMG_rhizome"},{"id":"ADV076","topic":"Vizuālā diagnostika","q":"Kura redzamā daļa var saglabāties pēc virszemes dzinumu nopļaušanas?","opts":["Pazemes saknenis","Ziedlapiņas","Putekšņlapas","Augļi"],"why":"Pazemes orgāni bieži saglabā dzīvotspēju.","source":"PRACT","image":"ADVIMG_rhizome"},{"id":"MK950-001","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kura iestāde uzrauga un kontrolē MK noteikumu Nr. 950 „Augu aizsardzības līdzekļu lietošanas noteikumi” ievērošanu?","opts":["Valsts augu aizsardzības dienests","Valsts vides dienests","Pārtikas un veterinārais dienests","Lauku atbalsta dienests"],"why":"2. punkts: noteikumu ievērošanas uzraudzību un kontroli veic Valsts augu aizsardzības dienests (VAAD).","source":"MK950"},{"id":"MK950-002","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādā iepakojumā jāuzglabā augu aizsardzības līdzekļi (AAL)?","opts":["Oriģinālā iepakojumā, ievērojot marķējumā noteiktos uzglabāšanas apstākļus","Jebkurā tīrā, aizvākojamā traukā ar uzrakstu","Pārlietus smidzinātāja tvertnē","Pārtikas pudelēs, lai ērtāk dozētu"],"why":"3. punkts: AAL uzglabā oriģinālā iepakojumā, ievērojot marķējumā noteiktos uzglabāšanas apstākļus, kā arī Augu aizsardzības likuma un Aizsargjoslu likuma prasības.","source":"MK950"},{"id":"MK950-003","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kur AAL novieto uzglabāšanas vietā?","opts":["Plauktos vai uz paletēm","Tieši uz grīdas","Jebkur, ja telpa ir aizslēgta","Kopā ar lopbarību"],"why":"4. punkts: AAL uzglabā plauktos vai uz paletēm. Ja telpā persona uzturas, lai darbotos ar AAL, tajā nodrošina gaisa apmaiņu.","source":"MK950"},{"id":"MK950-004","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas jānodrošina AAL uzglabāšanas telpā, kurā cilvēks uzturas, lai kārtotu vai pārvietotu līdzekļus?","opts":["Gaisa apmaiņa","Apkure virs +25 °C","Dienasgaismas apgaismojums","Ūdens krāns pie katra plaukta"],"why":"4. punkts: ja uzglabāšanas vieta ir telpa, kurā persona var uzturēties, lai veiktu darbības ar AAL, tajā nodrošina gaisa apmaiņu.","source":"MK950"},{"id":"MK950-005","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuru vietu ATĻAUTS izmantot AAL uzglabāšanai?","opts":["Pagrabu, kas būvēts virs zemes","Degvielas noliktavu","Dzīvnieku novietni","Būvi, kas var applūst"],"why":"5. punkts aizliedz izmantot degvielas noliktavas, dzīvojamās vai administratīvās telpas, dzīvnieku novietnes, applūstošas būves un pagrabus, izņemot tos, kas būvēti virs zemes.","source":"MK950"},{"id":"MK950-006","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kura no šīm vietām ir AIZLIEGTA AAL uzglabāšanai?","opts":["Administratīvās telpas","Slēgta, vēdināma noliktava","Speciāli iekārtota AAL noliktava ar plauktiem","Virs zemes būvēts pagrabs"],"why":"5. punkts: aizliegts izmantot degvielas noliktavas, dzīvojamās vai administratīvās telpas, dzīvnieku novietnes, applūstošas būves un pazemes pagrabus.","source":"MK950"},{"id":"MK950-007","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kā jāuzglabā pirmās reģistrācijas klases AAL?","opts":["Slēgtā, vēdināmā telpā atsevišķi no pārējiem AAL","Kopā ar otrās klases AAL, ja tie ir oriģinālā iepakojumā","Nojumē zem klajas debess","Dzīvojamās mājas pagrabā"],"why":"6. punkts: pirmās reģistrācijas klases AAL uzglabā slēgtā, vēdināmā telpā atsevišķi no pārējiem AAL.","source":"MK950"},{"id":"MK950-008","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kur līdz apglabāšanai jātur izlietotie AAL iepakojumi?","opts":["Kopā ar AAL","Sadzīves atkritumu konteinerā","Lauka malā","Dzīvnieku novietnē"],"why":"7. punkts: izlietotos AAL iepakojumus līdz apglabāšanai tur kopā ar AAL un apglabā saskaņā ar atkritumu apsaimniekošanas noteikumiem (izņēmums – ja iepakojums vairs nav uzskatāms par bīstamu atkritumu).","source":"MK950"},{"id":"MK950-009","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas saimniecībā, kur uzglabā vai lieto AAL, jābūt pieejams darbā iesaistītajām personām?","opts":["Individuālie aizsardzības līdzekļi, absorbējoši materiāli un inventārs izbirušu vai izlijušu AAL savākšanai","Tikai pirmās palīdzības aptieciņa","Tikai ugunsdzēšamais aparāts","Tikai VAAD tālruņa numurs"],"why":"8. punkts: jābūt pieejamiem IAL (respirators, aizsargbrilles, aizsargapģērbs, cimdi), absorbējošiem materiāliem (sausas zāģu skaidas, kūdra) un glābšanas inventāram (slota, spainis, liekšķere).","source":"MK950"},{"id":"MK950-010","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kurus materiālus MK noteikumi Nr. 950 min kā absorbējošus materiālus izlijuša AAL savākšanai?","opts":["Sausas zāģu skaidas vai kūdru","Ūdeni","Papīra dvieļus","Mitru smilti ar ziepēm"],"why":"8.2. apakšpunkts: absorbējošie materiāli, piemēram, sausas zāģu skaidas vai kūdra.","source":"MK950"},{"id":"MK950-011","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuru inventāru noteikumi min glābšanas pasākumiem, ja AAL izbirst vai izlīst?","opts":["Slotu, spaini, liekšķeri","Ūdens šļūteni","Lāpstu un ķerru","Augstspiediena mazgātāju"],"why":"8.3. apakšpunkts: inventārs glābšanas pasākumiem, piemēram, slota, spainis, liekšķere.","source":"MK950"},{"id":"MK950-012","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādiem mērķiem drīkst lietot AAL?","opts":["Tikai marķējumā minētajam mērķim un pret marķējumā minētajiem kaitīgajiem organismiem","Pret jebkuru kaitīgo organismu, ja deva nav pārsniegta","Jebkurā kultūrā, ja kaimiņš to lieto","Pēc pārdevēja ieteikuma, arī ja marķējumā tas nav minēts"],"why":"9. punkts: AAL atļauts lietot tikai marķējumā minētajam mērķim un pret tajā minētajiem kaitīgajiem organismiem, nepārsniedzot devu un ievērojot marķējuma prasības.","source":"MK950"},{"id":"MK950-013","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuras marķējuma prasības 9. punkts uzliek ievērot lietojot AAL?","opts":["Devu, atšķaidīšanu un maisījumus, kultūrauga attīstības stadiju, apstrāžu skaitu sezonā un nogaidīšanas laiku","Tikai devu","Tikai nogaidīšanas laiku","Tikai uzglabāšanas temperatūru"],"why":"9. punkts: jāievēro deva, prasības par atšķaidīšanu un maisījumu gatavošanu, kultūrauga attīstības stadija, apstrāžu skaits sezonā, nogaidīšanas laiks līdz ražas novākšanai un veselības un vides ierobežojumi.","source":"MK950"},{"id":"MK950-014","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas ir atbildīgs par cilvēku, dzīvnieku veselības un vides aizsardzības prasību ievērošanu, lietojot AAL?","opts":["Ikviens AAL lietotājs, kā arī AAL lietošanas operators","Tikai AAL ražotājs","Tikai VAAD","Tikai zemes īpašnieks"],"why":"10. punkts: par šo prasību ievērošanu ir atbildīgs ikviens AAL lietotājs, kā arī AAL lietošanas operators.","source":"MK950"},{"id":"MK950-015","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādus AAL lietošanai pēc iespējas jāizvēlas saskaņā ar MK noteikumiem Nr. 950?","opts":["Ar mazāku risku videi un veselībai, kas nav bīstami ūdens videi un nesatur prioritārās bīstamās vielas","Lētākos","Ar visīsāko nogaidīšanas laiku neatkarīgi no riska","Ar visaugstāko darbīgās vielas koncentrāciju"],"why":"11. punkts: pēc iespējas izvēlas AAL, kas potenciāli rada mazāku risku videi un veselībai, nav kvalificēti kā bīstami ūdens videi un nesatur prioritārās bīstamās vielas.","source":"MK950"},{"id":"MK950-016","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuru normatīvo aktu prasības jāievēro, lai aizsargātu ūdens vidi un dzeramā ūdens ņemšanas vietas?","opts":["Normatīvo aktu par aizsargjoslām","Normatīvo aktu par ceļu satiksmi","Normatīvo aktu par darba laiku","Normatīvo aktu par nodokļiem"],"why":"12. punkts: lai aizsargātu ūdens vidi un dzeramā ūdens ņemšanas vietas, AAL lieto, ievērojot normatīvajos aktos par aizsargjoslām minētās prasības.","source":"MK950"},{"id":"MK950-017","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuru reģistrācijas klašu AAL lietotājam jākārto reģistrācijas žurnāls?","opts":["Pirmās un otrās reģistrācijas klases","Tikai pirmās reģistrācijas klases","Tikai otrās reģistrācijas klases","Žurnāls nav obligāts"],"why":"13. punkts: pirmās un otrās reģistrācijas klases AAL lietotājs kārto reģistrācijas žurnālu.","source":"MK950"},{"id":"MK950-018","topic":"MK Nr. 950 lietošanas noteikumi","q":"Cik ilgi jāglabā AAL reģistrācijas žurnāls?","opts":["Vismaz trīs gadus","Vienu gadu","Līdz sezonas beigām","Vismaz desmit gadus"],"why":"13. punkts: reģistrācijas žurnālu glabā vismaz trīs gadus.","source":"MK950"},{"id":"MK950-019","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas reģistrācijas žurnālā jānorāda par IEGĀDĀTAJIEM AAL?","opts":["Saņemšanas datums, AAL nosaukums, iepakojuma lielums un daudzums","Tikai pirkuma cena","Pārdevēja vārds un tālrunis","Tikai darbīgā viela"],"why":"13. punkts: par iegādātajiem AAL norāda saņemšanas datumu, AAL nosaukumu, iepakojuma lielumu un daudzumu.","source":"MK950"},{"id":"MK950-020","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas reģistrācijas žurnālā jānorāda par IZLIETOTAJIEM AAL?","opts":["Apstrādātā kultūra vai objekts, teritorija, platība, apstrādes datums, AAL nosaukums un deva","Tikai apstrādes datums","Laika apstākļi un smidzinātāja marka","Tikai izlietotā iepakojuma skaits"],"why":"13. punkts: norāda apstrādāto kultūraugu sugu vai objektu (piemēram, labības noliktava), apstrādāto teritoriju, tās platību, apstrādes datumu, AAL nosaukumu un devu.","source":"MK950"},{"id":"MK950-021","topic":"MK Nr. 950 lietošanas noteikumi","q":"AAL lietoja pakalpojuma sniedzējs – profesionāls AAL lietotājs. Kas jāsaņem apstrādātā objekta īpašniekam?","opts":["Izraksts no reģistrācijas žurnāla par apstrādāto objektu","Tikai rēķins","Mutisks paziņojums","Nekas, jo žurnālu kārto pakalpojuma sniedzējs"],"why":"13.1 punkts: pakalpojuma sniedzējs izsniedz īpašniekam izrakstu no reģistrācijas žurnāla, norādot arī savu vārdu, uzvārdu, adresi un lietotāja apliecības numuru.","source":"MK950"},{"id":"MK950-022","topic":"MK Nr. 950 lietošanas noteikumi","q":"Cik eksemplāros sagatavo izrakstu no reģistrācijas žurnāla, ja AAL lietots kā pakalpojums?","opts":["Divos; uz pakalpojuma sniedzēja eksemplāra paraksta objekta īpašnieks","Vienā – to paņem pakalpojuma sniedzējs","Trīs – viens arī VAAD","Izraksts nav nepieciešams"],"why":"13.1 punkts: izrakstu sagatavo divos eksemplāros; uz eksemplāra, kas paliek pie pakalpojuma sniedzēja, jābūt objekta īpašnieka parakstam.","source":"MK950"},{"id":"MK950-023","topic":"MK Nr. 950 lietošanas noteikumi","q":"Cik ilgi objekta īpašnieks glabā pakalpojuma sniedzēja izsniegto izrakstu no reģistrācijas žurnāla?","opts":["Trīs gadus un uzrāda VAAD pēc pieprasījuma","Vienu gadu","Līdz ražas novākšanai","Piecus gadus un katru gadu iesniedz VAAD"],"why":"13.1 punkts: objekta īpašnieks izrakstu glabā trīs gadus un pēc pieprasījuma uzrāda dienestam.","source":"MK950"},{"id":"MK950-024","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuras personas AIZLIEGTS iesaistīt darbā ar AAL?","opts":["Personas, jaunākas par 18 gadiem, grūtnieces un mātes, kas baro bērnu ar krūti","Personas, vecākas par 60 gadiem","Personas bez autovadītāja apliecības","Sezonas strādniekus"],"why":"14.1. apakšpunkts: aizliegts iesaistīt darbā personas, kas jaunākas par 18 gadiem, grūtnieces un mātes, kas baro bērnu ar krūti.","source":"MK950"},{"id":"MK950-025","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādas AAL lietošanas iekārtas aizliegts izmantot?","opts":["Bojātas, nenoregulētas un normatīvajos aktos noteiktajā kārtībā nepārbaudītas iekārtas","Iekārtas, kas vecākas par 5 gadiem","Iekārtas, kas nav krāsotas","Iekārtas ar mazāku tvertni par 600 l"],"why":"14.2. apakšpunkts: aizliegts izmantot bojātas, nenoregulētas iekārtas, kā arī iekārtas, kas nav pārbaudītas noteiktajā kārtībā (pārbaudes prasība spēkā no 26.11.2016.).","source":"MK950"},{"id":"MK950-026","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kurš no šiem darbiem, lietojot AAL, ir AIZLIEGTS?","opts":["Atstāt bez uzraudzības sagatavotu darba šķidrumu","Sekot smidzinātāja darba kvalitātei","Lietot individuālos aizsardzības līdzekļus","Atšķaidīt darba šķidruma atlikumu un izsmidzināt uz apstrādātā lauka"],"why":"14.3. apakšpunkts: aizliegts atstāt bez uzraudzības sagatavotus darba šķidrumus un neizlietotus AAL.","source":"MK950"},{"id":"MK950-027","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kā MK noteikumi Nr. 950 nosaka rīkoties ar smidzināšanai paredzētā darba šķidruma atlikumu?","opts":["To aizliegts izliet; atšķaida ar lielu ūdens daudzumu un izsmidzina uz apstrādātā lauka","Izlej grāvī","Izlej kanalizācijā","Uzglabā atvērtā tvertnē līdz nākamajai sezonai"],"why":"14.4. apakšpunkts aizliedz izliet darba šķidruma atlikumu; 16. punkts: atlikumu atšķaida ar lielu ūdens daudzumu un izsmidzina uz apstrādātā lauka.","source":"MK950"},{"id":"MK950-028","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas aizliegts personām vietā, kur strādā ar AAL?","opts":["Ēst, dzert un smēķēt, kā arī uzturēties nepiederošām personām","Lietot cimdus","Runāt pa tālruni ar VAAD","Lasīt marķējumu"],"why":"14.5. un 14.6. apakšpunkts: aizliegta nepiederošu personu uzturēšanās darba vietā; aizliegts ēst, dzert un smēķēt.","source":"MK950"},{"id":"MK950-029","topic":"MK Nr. 950 lietošanas noteikumi","q":"Cik reizes darba šķidruma gatavošanas laikā jāizskalo iztukšotais AAL iepakojums?","opts":["Trīs reizes ar tīru ūdeni, skalojamo ūdeni iepildot darba šķidruma tvertnē","Vienu reizi, skalojamo ūdeni izlejot zemē","Divas reizes ar karstu ūdeni","Nav jāskalo"],"why":"15. punkts: iztukšoto iepakojumu trīs reizes izskalo ar tīru ūdeni un skalojamo ūdeni iepilda darba šķidruma tvertnē.","source":"MK950"},{"id":"MK950-030","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuru darbīgo vielu AAL iepakojumu NESKALO trīs reizes, bet apsaimnieko saskaņā ar atkritumu noteikumiem un marķējuma norādēm?","opts":["Magnija un alumīnija fosfīdu","Glifosāta","MCPA","Tebukonazola"],"why":"15. punkts: magnija un alumīnija fosfīdu saturošu AAL iepakojumu apsaimnieko atbilstoši atkritumu apsaimniekošanas prasībām un marķējuma norādēm.","source":"MK950"},{"id":"MK950-031","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kā rīkojas ar smidzinātāja tvertni, beidzot darbu?","opts":["Izskalo ar tīru ūdeni vai marķējumā norādīto mazgāšanas līdzekli un to izsmidzina uz apstrādātā lauka","Izskalo pie ūdenstilpes","Mazgā pagalmā pie akas","Nemazgā līdz nākamajai reizei"],"why":"16. punkts: darbu beidzot, iekārtas tvertni izskalo ar tīru ūdeni vai marķējumā norādīto mazgāšanas līdzekli, ko izsmidzina uz apstrādātā lauka.","source":"MK950"},{"id":"MK950-032","topic":"MK Nr. 950 lietošanas noteikumi","q":"Vai drīkst atkārtoti izmantot izlietotus AAL iepakojumus (piemēram, ūdens vai degvielas glabāšanai)?","opts":["Nē, tas ir aizliegts","Jā, ja tie trīs reizes izskaloti","Jā, bet tikai saimniecības vajadzībām","Jā, ja iepakojums ir plastmasas"],"why":"17. punkts: aizliegts atkārtoti izmantot izlietoto AAL iepakojumus.","source":"MK950"},{"id":"MK950-033","topic":"MK Nr. 950 lietošanas noteikumi","q":"Pie kāda maksimālā vēja ātruma drīkst apsmidzināt sējumus ar parastu smidzinātāju?","opts":["4 m/s","2 m/s","6 m/s","8 m/s"],"why":"18.1. apakšpunkts: augus drīkst apsmidzināt, ja vēja ātrums nepārsniedz 4 m/s.","source":"MK950"},{"id":"MK950-034","topic":"MK Nr. 950 lietošanas noteikumi","q":"Smidzinātājs aprīkots ar rūpnieciski komplektētām palīgierīcēm, kas mazina vēja ietekmi uz smidzinājumu. Kāds ir maksimālais pieļaujamais vēja ātrums?","opts":["8 m/s","4 m/s","10 m/s","12 m/s"],"why":"18.1. apakšpunkts: ar rūpnieciski komplektētām palīgierīcēm, kas mazina vēja ietekmi, augus drīkst apsmidzināt, ja vēja ātrums nepārsniedz 8 m/s.","source":"MK950"},{"id":"MK950-035","topic":"MK Nr. 950 lietošanas noteikumi","q":"Vējš ir 6 m/s, smidzinātājs ir standarta (bez palīgierīcēm vēja ietekmes mazināšanai). Vai drīkst smidzināt?","opts":["Nē – bez palīgierīcēm pieļaujams līdz 4 m/s","Jā – pieļaujams līdz 8 m/s","Jā, ja smidzina vakarā","Jā, ja samazina devu"],"why":"18.1. apakšpunkts: bez palīgierīcēm vēja ātrums nedrīkst pārsniegt 4 m/s; 8 m/s robeža attiecas tikai uz smidzinātājiem ar rūpnieciski komplektētām palīgierīcēm.","source":"MK950"},{"id":"MK950-036","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kam jāseko, strādājot ar smidzinātāju, saskaņā ar MK noteikumiem Nr. 950?","opts":["Smidzinātāja darba kvalitātei un preparāta izlietojumam","Tikai degvielas patēriņam","Tikai braukšanas ātrumam","Tikai laika prognozei"],"why":"18.2. apakšpunkts: strādājot seko smidzinātāja darba kvalitātei, kā arī preparāta izlietojumam.","source":"MK950"},{"id":"MK950-037","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuras marķējuma norādes nozīmē, ka jāievēro īpašas bišu un citu apputeksnētāju aizsardzības prasības?","opts":["„Toksisks bitēm”, R57, standartfrāze Spe8 un citas norādes par apputeksnētāju aizsardzību","Tikai GHS09 piktogramma","Tikai „Uzglabāt bērniem nepieejamā vietā”","Tikai SP1"],"why":"19. punkts: jāievēro marķējuma īpašās prasības, ja tajā ir norāde „Toksisks bitēm” vai R57, standartfrāze Spe8 vai citas norādes par bišu un apputeksnētāju aizsardzību.","source":"MK950"},{"id":"MK950-038","topic":"MK Nr. 950 lietošanas noteikumi","q":"Cik dienas pirms apstrādes ar „Toksisks bitēm” (R57) marķētu AAL jābrīdina biškopji?","opts":["Trīs dienas","Vienu dienu","Divas nedēļas","Brīdināt nav nepieciešams"],"why":"20. punkts: trīs dienas pirms sējumu vai stādījumu apstrādes brīdina bišu saimju tiesiskos valdītājus.","source":"MK950"},{"id":"MK950-039","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kurus biškopjus jābrīdina pirms apstrādes ar bitēm toksisku AAL?","opts":["Tos, kuru reģistrētās bišu dravas (stropi) atrodas 2 km rādiusā no apstrādājamās vietas","Tos, kuru dravas ir 500 m rādiusā","Tos, kuru dravas ir 5 km rādiusā","Visus novada biškopjus"],"why":"20. punkts: brīdina bišu saimju tiesiskos valdītājus, kuru dravas (vai stropi) atrodas divu kilometru rādiusā un kuru bišu saimes ir reģistrētas.","source":"MK950"},{"id":"MK950-040","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kur jākodina sēklas saskaņā ar MK noteikumiem Nr. 950?","opts":["Speciāli iekārtotās telpās, nojumēs, laukumos un kodināšanai piemērotās iekārtās","Jebkurā vietā uz lauka","Dzīvojamās mājas virtuvē","Dzīvnieku novietnē"],"why":"21.1. apakšpunkts: sēklas kodina speciāli iekārtotās telpās, nojumēs, laukumos un kodināšanai piemērotās iekārtās.","source":"MK950"},{"id":"MK950-041","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kā uzglabā kodināto sēklu pārpalikumus?","opts":["Sausā, aizslēgtā noliktavā atsevišķi no pārtikas un lopbarības graudiem, iepakojumā ar norādi „KODINĀTS” un kodnes vai darbīgās vielas nosaukumu","Kopā ar lopbarības graudiem","Atvērtā kaudzē nojumē","Izbirdina laukā"],"why":"21.3. apakšpunkts: uzglabā sausā aizslēgtā noliktavā atsevišķi no pārtikas un lopbarības graudiem, iepakojumā ar norādi „KODINĀTS”, norādot arī kodnes vai darbīgās vielas nosaukumu.","source":"MK950"},{"id":"MK950-042","topic":"MK Nr. 950 lietošanas noteikumi","q":"Ko drīkst darīt ar kodinātām sēklām?","opts":["Tās sēt un pārvadāt marķētos iepakojumos, sējmašīnu uzpildītājos vai tvertnēs","Izbarot putniem","Nomazgāt un pārdot lopbarībai","Izmantot pārtikā pēc nomazgāšanas"],"why":"21.5. apakšpunkts aizliedz kodinātās sēklas lietot pārtikā, izbarot dzīvniekiem un putniem, mazgāt vai attīrīt realizācijai; 21.6. – pārvadāt drīkst tikai marķētos iepakojumos, sējmašīnu uzpildītājos vai tvertnēs.","source":"MK950"},{"id":"MK950-043","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas jāizdara pēc sēklu kodināšanas un sējas pabeigšanas?","opts":["Kodināšanas vietu, iekārtas, sējmašīnas un IAL neitralizē, ievērojot kodnes marķējuma norādes","Neko, jo kodne iztvaiko","Iekārtas noskalo tuvākajā ūdenstilpē","Atlikušās sēklas izbēr ceļmalā"],"why":"21.4. apakšpunkts: kodināšanas vietu, iekārtas, sējmašīnas, sēklu iepildītājus un IAL neitralizē, ievērojot kodnes marķējuma norādes.","source":"MK950"},{"id":"MK950-044","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas drīkst lietot pirmās reģistrācijas klases AAL?","opts":["Tikai personas ar profesionāla AAL lietotāja apliecību darbībām ar pirmās reģistrācijas klases AAL","Ikviens ar otrās klases apliecību","Ikviens pilngadīgs saimniecības darbinieks","Ikviens, kas iegādājies līdzekli"],"why":"21.1 punkts: pirmās reģistrācijas klases AAL atļauts lietot tikai personām, kurām izsniegta profesionāla lietotāja apliecība darbībām ar pirmās reģistrācijas klases AAL.","source":"MK950"},{"id":"MK950-045","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādā attālumā no dzīvojamām, administratīvajām un publiskajām ēkām drīkst atrasties fumigējamais objekts?","opts":["Ne tuvāk par 50 m","Ne tuvāk par 10 m","Ne tuvāk par 30 m","Ne tuvāk par 200 m"],"why":"22.1. apakšpunkts: fumigāciju drīkst veikt hermētiski noslēdzamā objektā ne tuvāk par 50 m no dzīvojamām, administratīvajām un publiskajām ēkām.","source":"MK950"},{"id":"MK950-046","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādā attālumā no plašai sabiedrībai pieejamām teritorijām (parks, sporta laukums) drīkst veikt fumigāciju?","opts":["Ne tuvāk par 30 m","Ne tuvāk par 50 m","Ne tuvāk par 5 m","Ne tuvāk par 100 m"],"why":"22.1. apakšpunkts: ne tuvāk par 30 m no plašai sabiedrībai pieejamām teritorijām (parks, sporta laukums, atpūtas vieta).","source":"MK950"},{"id":"MK950-047","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kad jābrīdina apkārtējie cilvēki par paredzēto fumigāciju?","opts":["Vienu dienu pirms fumigācijas sākšanas","Trīs dienas pirms","Fumigācijas dienā","Pēc degazācijas"],"why":"22.2. apakšpunkts: vienu dienu pirms fumigācijas sākšanas brīdina cilvēkus, kas atrodas objektam piegulošajā teritorijā.","source":"MK950"},{"id":"MK950-048","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādi brīdinājuma uzraksti jāizvieto pie fumigējamā objekta?","opts":["„BĪSTAMI DZĪVĪBAI” un „IEEJA AIZLIEGTA”","„KODINĀTS”","„Toksisks bitēm”","„Svaigi krāsots”"],"why":"22.4. apakšpunkts: objektu norobežo un izvieto labi saredzamus uzrakstus „BĪSTAMI DZĪVĪBAI” un „IEEJA AIZLIEGTA”.","source":"MK950"},{"id":"MK950-049","topic":"MK Nr. 950 lietošanas noteikumi","q":"Cik personu minimāli veic fumigāciju?","opts":["Vismaz divas","Viena","Vismaz četras","Skaits nav noteikts"],"why":"22.5. apakšpunkts: lai garantētu darba drošību, fumigāciju veic vismaz divas personas; tās nodrošina ar gāzmaskām (22.7.).","source":"MK950"},{"id":"MK950-050","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kurā diennakts laikā veic fumigācijas sagatavošanu un fumiganta palaišanu?","opts":["Diennakts gaišajā laikā","Naktī, kad apkārt nav cilvēku","Jebkurā laikā","Tikai rītausmā"],"why":"22.8. apakšpunkts: fumigācijas sagatavošanu un fumiganta palaišanu veic diennakts gaišajā laikā.","source":"MK950"},{"id":"MK950-051","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kā jāveic degazācija pēc fumigācijas?","opts":["Pakāpeniski, neļaujot izplūst atmosfērā lielam fumiganta daudzumam, līdz koncentrācija sasniedz marķējumā paredzēto","Vienlaikus atverot visas durvis un logus","Nav jāveic","Apsmidzinot telpas ar ūdeni"],"why":"22.10. un 22.11. apakšpunkts: degazāciju veic pakāpeniski un līdz fumiganta koncentrācija sasniedz marķējumā paredzētos rādītājus.","source":"MK950"},{"id":"MK950-052","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas jāsastāda pēc fumigācijas un degazācijas?","opts":["Akts par fumigācijas un degazācijas veikšanu, ko paraksta visi dalībnieki","Tikai rēķins","Ziņojums policijai","Nekas nav jāsastāda"],"why":"24. punkts: pēc degazācijas mēra fumiganta koncentrāciju un sastāda aktu par fumigācijas un degazācijas veikšanu; aktu paraksta visas fumigācijā iesaistītās personas.","source":"MK950"},{"id":"MK950-053","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas jādara pēc AAL lietošanas segtās platībās (piemēram, siltumnīcā)?","opts":["Tās noslēdz un pie durvīm pieliek brīdinājuma zīmi ar AAL, laiku, kad atkal drīkst uzturēties, un atbildīgās personas tālruni","Atver durvis, lai izvēdinātu, un sāk darbu","Neko, jo telpa ir slēgta","Paziņo vietējā laikrakstā"],"why":"25. punkts: segtās platības noslēdz un pie durvīm pieliek brīdinājuma zīmi ar informāciju par lietoto AAL, laiku, kad atkal drīkstēs uzturēties, un atbildīgās personas tālruņa numuru.","source":"MK950"},{"id":"MK950-054","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kad drīkst lietot AAL plašai sabiedrībai pieejamās teritorijās (parkā, skolas vai slimnīcas teritorijā)?","opts":["Tikai tad, ja citādi nav iespējams ierobežot kaitīgos organismus un lietošanas instrukcijā šāds lietojums ir atļauts","Vienmēr, ja ievēro devu","Tikai brīvdienās","Nekad – tas ir pilnībā aizliegts"],"why":"26. punkts: atļauts tikai tad, ja citādi nav iespējams ierobežot kaitīgo organismu izplatību un instrukcijā atļauts šāds lietojums; lieto pēc iespējas laikā, kad cilvēki neuzturas.","source":"MK950"},{"id":"MK950-055","topic":"MK Nr. 950 lietošanas noteikumi","q":"Cik dienas iepriekš jāpublisko paziņojums par AAL lietošanu parkā, sporta laukumā vai skolas teritorijā?","opts":["Vismaz divas dienas","Vismaz vienu dienu","Vismaz septiņas dienas","Paziņojums nav vajadzīgs"],"why":"27. punkts: vismaz divas dienas pirms lietošanas atbildīgā persona ievieto paziņojumu vietējā laikrakstā vai savā tīmekļa vietnē vai citādi publisko informāciju.","source":"MK950"},{"id":"MK950-056","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas jānorāda brīdinājuma zīmēs, ar kurām norobežo apstrādātu publisku teritoriju?","opts":["Lietotais AAL, nogaidīšanas periods un kad teritoriju atkal drīkst apmeklēt","Tikai uzraksts „Uzmanību!”","Smidzinātāja operatora mājas adrese","AAL cena"],"why":"28. punkts: teritoriju norobežo ar brīdinājuma zīmēm ar informāciju par lietoto AAL, nogaidīšanas periodu un to, kad teritoriju atkal drīkst apmeklēt.","source":"MK950"},{"id":"MK950-057","topic":"MK Nr. 950 lietošanas noteikumi","q":"Ar kādu nosacījumu drīkst apstrādāt dzelzceļa līnijas, autoceļu daļas un ļoti caurlaidīgas teritorijas?","opts":["Ievērojot aizsargjoslu prasības un nodrošinot, ka AAL nenokļūst virszemes ūdeņos vai noteku sistēmās","Tikai ar VAAD rakstisku atļauju katrai reizei","Bez nosacījumiem","Tikai ziemā"],"why":"29. punkts: atļauts apstrādāt, tikai ievērojot normatīvos aktus par aizsargjoslām un nodrošinot, ka AAL nenokļūst virszemes ūdeņos vai noteku sistēmās.","source":"MK950"},{"id":"MK950-058","topic":"MK Nr. 950 lietošanas noteikumi","q":"Vai drīkst izsmidzināt AAL no gaisa (ar lidaparātu)?","opts":["Tikai ar VAAD atļauju","Jā, bez atļaujas, ja ievēro devu","Jā, ja informē kaimiņus","Nē, nekad"],"why":"30. punkts: AAL atļauts izsmidzināt no gaisa, ja saņemta dienesta atļauja.","source":"MK950"},{"id":"MK950-059","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kurā gadījumā VAAD var izsniegt atļauju AAL izsmidzināšanai no gaisa?","opts":["Zinātniskiem pētījumiem, ārkārtas gadījumā lauksaimniecībā vai mežu apstrādei kaitēkļu masveida savairošanās gadījumā","Lai ietaupītu laiku lielos laukos","Ja traktors ir salūzis","Ja lauks ir mitrs"],"why":"31. punkts: atļauju izsniedz zinātniskām institūcijām pētījumiem, lauksaimnieciskās ražošanas personām ārkārtas gadījumā un mežu apstrādei kokiem kaitīgo organismu masveida savairošanās gadījumā.","source":"MK950"},{"id":"MK950-060","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādā termiņā VAAD sagatavo riska novērtējumu izsmidzināšanai no gaisa, ja AAL ir atļauts lietošanai Latvijā?","opts":["Ne ilgāk kā vienas nedēļas laikā","Ne ilgāk kā divu nedēļu laikā","Viena mēneša laikā","Trīs dienu laikā"],"why":"33. punkts: vienas nedēļas laikā, ja AAL atļauts Latvijā; divu nedēļu laikā, ja nav atļauts.","source":"MK950"},{"id":"MK950-061","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kādā termiņā VAAD sagatavo riska novērtējumu izsmidzināšanai no gaisa, ja AAL NAV atļauts lietošanai Latvijā?","opts":["Ne ilgāk kā divu nedēļu laikā","Ne ilgāk kā vienas nedēļas laikā","Divu mēnešu laikā","Novērtējumu nesagatavo"],"why":"33.1. apakšpunkts: divu nedēļu laikā, ja AAL nav atļauts lietošanai Latvijā.","source":"MK950"},{"id":"MK950-062","topic":"MK Nr. 950 lietošanas noteikumi","q":"Cik ilgā laikā pēc AAL izsmidzināšanas no gaisa jāiesniedz pārskats VAAD?","opts":["Ne vēlāk kā divu dienu laikā","Nedēļas laikā","Mēneša laikā","Līdz gada beigām"],"why":"38. punkts: ne vēlāk kā divu dienu laikā iesniedz pārskatu ar izsmidzināšanas datumu un laiku, AAL nosaukumu, daudzumu, devu un informāciju par teritoriju.","source":"MK950"},{"id":"MK950-063","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kur VAAD publicē lēmumu par atļauju izsmidzināt AAL no gaisa?","opts":["Savā tīmekļa vietnē un oficiālajā izdevumā „Latvijas Vēstnesis”","Tikai vietējā laikrakstā","Nepublicē","Tikai sociālajos tīklos"],"why":"37. punkts: dienests lēmumu publicē savā tīmekļa vietnē un oficiālajā izdevumā „Latvijas Vēstnesis”.","source":"MK950"},{"id":"MK950-064","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas sedz izdevumus par VAAD riska novērtējumu, lemjot par izsmidzināšanu no gaisa?","opts":["Persona, kas lūdz atļauju","VAAD","Pašvaldība","Zemkopības ministrija"],"why":"39. punkts: persona sedz visus izdevumus par dienesta novērtējumu un riska analīzi saskaņā ar dienesta maksas pakalpojumu cenrādi.","source":"MK950"},{"id":"MK950-065","topic":"MK Nr. 950 lietošanas noteikumi","q":"No kā VAAD kontroles laikā var ņemt paraugus darbīgo vielu klātbūtnes konstatēšanai?","opts":["No AAL, augsnes, augiem, augu produktiem, darba šķidrumiem un citiem priekšmetiem, kas saskārušies ar AAL","Tikai no AAL iepakojuma","Tikai no gruntsūdens","Paraugus ņemt nedrīkst"],"why":"40. punkts: paraugus var ņemt no AAL, augsnes, augiem, augu produktiem, sagatavotiem darba šķidrumiem un citiem priekšmetiem, kas varētu būt nonākuši saskarē ar AAL.","source":"MK950"},{"id":"MK950-066","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kas sedz paraugu ņemšanas izdevumus, ja VAAD tos ņem pēc personas lūguma ārpus kontroles?","opts":["Persona, kas lūgusi","VAAD","Valsts budžets","AAL ražotājs"],"why":"41.1 punkts: ja paraugus ņem pēc personas lūguma ārpus dienesta kontroles, izdevumus sedz persona saskaņā ar dienesta maksas pakalpojumu cenrādi.","source":"MK950"},{"id":"MK950-067","topic":"MK Nr. 950 lietošanas noteikumi","q":"Kuras ES direktīvas normas ir pārņemtas MK noteikumos Nr. 950?","opts":["Direktīvas 2009/128/EK par pesticīdu ilgtspējīgu lietošanu","Nitrātu direktīvas 91/676/EEK","Putnu direktīvas 2009/147/EK","Ūdens pamatdirektīvas 2000/60/EK"],"why":"Informatīvā atsauce: noteikumos iekļautas normas no Direktīvas 2009/128/EK, ar ko nosaka Kopienas sistēmu pesticīdu ilgtspējīgas lietošanas nodrošināšanai.","source":"MK950"},{"id":"ATF-parasta_virza-1","topic":"Nezāļu foto atlants","q":"Kura nezāle redzama attē zgadīgās)","Virszemes stīgas"],"why":"Tīruma mīkstpiene (Sonchus arvensis) – divdīgļlapis; Daudzgadīgā – sakņu dzinumu nezāle. Sakņu sistēma: sakņu dzinumi. Vienīgā no sakņu dzinumu nezālēm, kuras saknes nav ļoti dziļi. Sakņu dzinumi: Lokaugļu zvērene, Parastā vīrcele, Vīķi, Mazā skābene, Tīruma mīkstpiene, Tīruma tītenis, Tīruma usne.","source":"ATLAS","image":"atlas/tiruma_mikstpiene_2"},{"id":"ATR-tiruma_titenis","topic":"Sakņu sistēmas ↔ augi","q":"Kāda sakņu sistēma vai vairošanās orgāns raksturīgs nezālei „tīruma tītenis”?","opts":["Sakņu dzinumi","Sīpoli","Bumbuļi sakņu galos","Bārkšsaknes (daudzgadīgās)"],"why":"Tīruma tītenis (Convolvulus arvensis) – divdīgļlapis; Daudzgadīgā – sakņu dzinumu nezāle. Sakņu sistēma: sakņu dzinumi. Raksturīga dziļa mietsakne ar sakņu dzinumiem. Sakņu dzinumi: Lokaugļu zvērene, Parastā vīrcele, Vīķi, Mazā skābene, Tīruma mīkstpiene, Tīruma tītenis, Tīruma usne.","source":"ATLAS","image":"atlas/tiruma_titenis_2"},{"id":"ATR-tiruma_usne","topic":"Sakņu sistēmas ↔ augi","q":"Kāda sakņu sistēma vai vairošanās orgāns raksturīgs nezālei „tīruma usne”?","opts":["Sakņu dzinumi","Sīpoli","Bumbuļi sakņu galos","Sakneņi"],"why":"Tīruma usne (Cirsium arvense) – divdīgļlapis; Daudzgadīgā – sakņu dzinumu nezāle. Sakņu sistēma: sakņu dzinumi. Dziļa, vairākos horizontālos stāvos izvietota sakņu sistēma (līdz 5 m); jaunu augu var dot pat 3 mm sakņu fragments. Sakņu dzinumi: Lokaugļu zvērene, Parastā vīrcele, Vīķi, Mazā skābene, Tīruma mīkstpiene, Tīruma tītenis, Tīruma usne.","source":"ATLAS","image":"atlas/tiruma_usne_2"},{"id":"ATR-loznu_gundega","topic":"Sakņu sistēmas ↔ augi","q":"Kāda sakņu sistēma vai vairošanās orgāns raksturīgs nezālei „ložņu gundega”?","opts":["Virszemes stīgas","Bumbuļi sakņu galos","Sakneņi","Mietsakne (daudzgadīgās)"],"why":"Ložņu gundega (Ranunculus repens) – divdīgļlapis; Daudzgadīgā – stīgojošā nezāle. Sakņu sistēma: stīgas. Vairojas ar virszemes stīgām; veido arī spēcīgas bārkšsaknes. Virszemes stīgas: Ložņu gundega, Maura platkājiņš.","source":"ATLAS","image":"atlas/loznu_gundega_1"},{"id":"ATR-maura_platkajins","topic":"Sakņu sistēmas ↔ augi","q":"Kāda sakņu sistēma vai vairošanās orgāns raksturīgs nezālei „maura platkājiņš”?","opts":["Virszemes stīgas","Sakneņi","Mietsakne (daudzgadīgās)","Sīpoli"],"why":"Maura platkājiņš (Potentilla anserina) – divdīgļlapis; Daudzgadīgā – stīgojošā nezāle. Sakņu sistēma: stīgas. Vairojas ar virszemes stīgām; veido arī spēcīgas bārkšsaknes. Virszemes stīgas: Ložņu gundega, Maura platkājiņš.","source":"ATLAS","image":"atlas/maura_platkajins_1"},{"id":"ATR-purva_sarmene","topic":"Sakņu sistēmas ↔ augi","q":"Kāda sakņu sistēma vai vairošanās orgāns raksturīgs nezālei „purva sārmene”?","opts":["Bumbuļi sakņu galos","Mietsakne (daudzgadīgās)","Virszemes stīgas","Bārkšsaknes (daudzgadīgās)"],"why":"Purva sārmene (Stachys palustris) – divdīgļlapis; Daudzgadīgā – bumbuļu nezāle. Sakņu sistēma: bumbuļi. Bumbuļi sakņu galos: Purva sārmene, Tīruma mētra.","source":"ATLAS","image":"atlas/purva_sarmene_2"},{"id":"ATR-tiruma_metra","topic":"Sakņu sistēmas ↔ augi","q":"Kāda sakņu sistēma vai vairošanās orgāns raksturīgs nezālei „tīruma mētra”?","opts":["Bumbuļi sakņu galos","Bārkšsaknes (daudzgadīgās)","Sīpoli","Sakņu dzinumi"],"why":"Tīruma mētra (Mentha arvensis) – divdīgļlapis; Daudzgadīgā – bumbuļu nezāle. Sakņu sistēma: bumbuļi. Vairojas ar bumbuļiem sakņu galos. Bumbuļi sakņu galos: Purva sārmene, Tīruma mētra.","source":"ATLAS","image":"atlas/tiruma_metra_2"},{"id":"ATR-krumaju_sipols","topic":"Sakņu sistēmas ↔ augi","q":"Kāda sakņu sistēma vai vairošanās orgāns raksturīgs nezālei „krūmāju sīpols”?","opts":["Sīpoli","Virszemes stīgas","Sakneņi","Bumbuļi sakņu galos"],"why":"Krūmāju sīpols (Allium oleraceum) – viendīgļlapis; Daudzgadīgā – sīpolu nezāle. Sakņu sistēma: sīpoli. Sīpoli: Krūmāju sīpols.","source":"ATLAS","image":"atlas/krumaju_sipols_1"},{"id":"ATQ-barksaknes-kodiga_gundega","topic":"Sakņu sistēmas ↔ augi","q":"Kura no šīm daudzgadī "source":"ATLAS"},{"id":"ATD-fig39-1","topic":"Sakņu sistēmas ↔ augi","q":"Attēlā redzamās sakņu sistēmas A, B un C pieder","opts":["A baltajai balandai, B sīkziedu sīkgalvītei, C parastajai gaiļsārei","A parastajai gaiļsārei, B baltajai balandai, C sīkziedu sīkgalvītei","A tīruma usnei, B tīruma tītenim, C tīruma kosai","A sīkziedu sīkgalvītei, B parastajai gaiļsārei, C baltajai balandai"],"why":"D. Lapiņa 39. att.: A – baltā balanda (neliela, viegli izraujama mietsakne), B – sīkziedu sīkgalvīte (stipri zaraina, dziļa mietsakne), C – parastā gaiļsāre (bārkšsaknes, spēcīgi saaug jau cerošanas fāzē).","source":"LAPINS","image":"atlas/root_fig39"},{"id":"ATD-fig39-2","topic":"Sakņu sistēmas ↔ augi","q":"Baltajai balandai pieder sakne","opts":["A attēlā","B attēlā","C attēlā","Neviena no attēlā redzamajām"],"why":"D. Lapiņa 39. att.: A – baltā balanda (neliela, viegli izraujama mietsakne), B – sīkziedu sīkgalvīte (stipri zaraina, dziļa mietsakne), C – parastā gaiļsāre (bārkšsaknes, spēcīgi saaug jau cerošanas fāzē).","source":"LAPINS","image":"atlas/root_fig39"},{"id":"ATD-fig39-3","topic":"Sakņu sistēmas ↔ augi","q":"Sīkziedu sīkgalvītei (galinsogai) pieder sakne","opts":["B attēlā","A attēlā","C attēlā","Neviena no attēlā redzamajām"],"why":"D. Lapiņa 39. att.: A – baltā balanda (neliela, viegli izraujama mietsakne), B – sīkziedu sīkgalvīte (stipri zaraina, dziļa mietsakne), C – parastā gaiļsāre (bārkšsaknes, spēcīgi saaug jau cerošanas fāzē).","source":"LAPINS","image":"atlas/root_fig39"},{"id":"ATD-fig39-4","topic":"Sakņu sistēmas ↔ augi","q":"Kura attēlā redzamā sakņu sistēma raksturīga viendīgļlapjiem?","opts":["C – bārkšsaknes","A – mietsakne","B – zaraina mietsakne","Visas trīs"],"why":"D. Lapiņa 39. att.: A – baltā balanda (neliela, viegli izraujama mietsakne), B – sīkziedu sīkgalvīte (stipri zaraina, dziļa mietsakne), C – parastā gaiļsāre (bārkšsaknes, spēcīgi saaug jau cerošanas fāzē).","source":"LAPINS","image":"atlas/root_fig39"},{"id":"ATD-fig40-1","topic":"Sakņu sistēmas ↔ augi","q":"Attēlā ar cipariem 1, 2, 3 apzīmēti šīs nezāles pazemes stumbri (sakneņi). Tā ir","opts":["ložņu vārpata","tīruma usne","tīruma tītenis","ložņu gundega"],"why":"D. Lapiņa 40. att.: ložņu vārpatas sakneņi aramkārtā. Sakneņi ir pazemes vasas pārveidnes ar pumpuriem.","source":"LAPINS","image":"atlas/root_fig40"},{"id":"ATD-fig40-2","topic":"Sakņu sistēmas ↔ augi","q":"Attēlā redzamajai nezālei pazemē ir","opts":["sakneņi","sakņu dzinumi no dziļām saknēm","bumbuļi sakņu galos","mietsakne"],"why":"D. Lapiņa 40. att.: ložņu vārpatas sakneņi – pazemes stumbri ar mezgliem un pumpuriem; atrodas aramkārtā.","source":"LAPINS","image":"atlas/root_fig40"},{"id":"ATD-fig41-1","topic":"Sakņu sistēmas ↔ augi","q":"Attēlā redzamās sakņu sistēmas pieder","opts":["A tīruma mīkstpienei, B parastajai māllēpei","A parastajai māllēpei, B tīruma mīkstpienei","A ložņu vārpatai, B tīruma usnei","A tīruma mētrai, B ārstniecības pienenei"],"why":"D. Lapiņa 41. att.: A – tīruma mīkstpiene (sakņu dzinumi), B – parastā māllēpe (sakneņi 0,8–1,0 m dziļumā, vairākos stāvos zem aramkārtas).","source":"LAPINS","image":"atlas/root_fig41"},{"id":"ATD-fig41-2","topic":"Sakņu sistēmas ↔ augi","q":"Kura nezāle attēlā B veido sakneņus daudz dziļāk nekā vārpata (0,8–1,0 m)?","opts":["parastā māllēpe","tīruma mīkstpiene","ložņu vārpata","tīruma kosa"],"why":"D. Lapiņa 41. att.: A – tīruma mīkstpiene (sakņu dzinumi), B – parastā māllēpe (sakneņi 0,8–1,0 m dziļumā, vairākos stāvos zem aramkārtas).","source":"LAPINS","image":"atlas/root_fig41"},{"id":"ATD-fig42-1","topic":"Sakņu sistēmas ↔ augi","q":"Kurai nezālei pieder attēlā D redzamā sakņu sistēma?","opts":["tīruma mīkstpienei","tīruma usnei","tīruma kosai","ložņu vārpatai"],"why":"D. Lapiņa 42. att.: A – tīruma usne (dziļa, vairākos horizontālos stāvos), B – tīruma tītenis (dziļa mietsakne), C – tīruma kosa (sakneņi un sporas), D – tīruma mīkstpiene (sakņu dzinumi, seklāk), E – ložņu vārpata (sakneņi aramkārtā).","source":"LA "topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Vīķi (Vicia spp.) – divdīgļlapis; Daudzgadīgā – sakņu dzinumu nezāle. Sakņu sistēma: sakņu dzinumi.","source":"ATLAS","image":"atlas/viki_1"},{"id":"ATC-maza_skabene","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Mazā skābene (Rumex acetosella) – divdīgļlapis; Daudzgadīgā – sakņu dzinumu nezāle. Sakņu sistēma: sakņu dzinumi.","source":"ATLAS","image":"atlas/maza_skabene_2"},{"id":"ATC-tiruma_mikstpiene","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Tīruma mīkstpiene (Sonchus arvensis) – divdīgļlapis; Daudzgadīgā – sakņu dzinumu nezāle. Sakņu sistēma: sakņu dzinumi. Vienīgā no sakņu dzinumu nezālēm, kuras saknes nav ļoti dziļi.","source":"ATLAS","image":"atlas/tiruma_mikstpiene_2"},{"id":"ATC-tiruma_titenis","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Tīruma tītenis (Convolvulus arvensis) – divdīgļlapis; Daudzgadīgā – sakņu dzinumu nezāle. Sakņu sistēma: sakņu dzinumi. Raksturīga dziļa mietsakne ar sakņu dzinumiem.","source":"ATLAS","image":"atlas/tiruma_titenis_2"},{"id":"ATC-tiruma_usne","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Tīruma usne (Cirsium arvense) – divdīgļlapis; Daudzgadīgā – sakņu dzinumu nezāle. Sakņu sistēma: sakņu dzinumi. Dziļa, vairākos horizontālos stāvos izvietota sakņu sistēma (līdz 5 m); jaunu augu var dot pat 3 mm sakņu fragments.","source":"ATLAS","image":"atlas/tiruma_usne_2"},{"id":"ATC-loznu_gundega","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Ložņu gundega (Ranunculus repens) – divdīgļlapis; Daudzgadīgā – stīgojošā nezāle. Sakņu sistēma: stīgas. Vairojas ar virszemes stīgām; veido arī spēcīgas bārkšsaknes.","source":"ATLAS","image":"atlas/loznu_gundega_1"},{"id":"ATC-maura_platkajins","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Maura platkājiņš (Potentilla anserina) – divdīgļlapis; Daudzgadīgā – stīgojošā nezāle. Sakņu sistēma: stīgas. Vairojas ar virszemes stīgām; veido arī spēcīgas bārkšsaknes.","source":"ATLAS","image":"atlas/maura_platkajins_1"},{"id":"ATC-purva_sarmene","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Purva sārmene (Stachys palustris) – divdīgļlapis; Daudzgadīgā – bumbuļu nezāle. Sakņu sistēma: bumbuļi.","source":"ATLAS","image":"atlas/purva_sarmene_2"},{"id":"ATC-tiruma_metra","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs divdīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs viendīgļlapis"],"why":"Tīruma mētra (Mentha arvensis) – divdīgļlapis; Daudzgadīgā – bumbuļu nezāle. Sakņu sistēma: bumbuļi. Vairojas ar bumbuļiem sakņu galos.","source":"ATLAS","image":"atlas/tiruma_metra_2"},{"id":"ATC-krumaju_sipols","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs viendīgļlapis","īsmūža divdīgļlapis","īsmūža viendīgļlapis","daudzgadīgs divdīgļlapis"],"why":"Krūmāju sīpols (Allium oleraceum) – viendīgļlapis; Daudzgadīgā – sīpolu nezāle. Sakņu sistēma: sīpoli.","source":"ATLAS","image":"atlas/krumaju_sipols_1"},{"id":"TT01","topic":"Sakņu sistēmas ↔ augi","q":"Daudzgadīga nezāle, vairojas ar bumbuļiem, kas atrodas sakņu galos, ir","opts":["tīruma mētra","ložņu vārpata","tīruma usne","tīruma mīkstpiene"],"why":"Tīruma mētra pieder pie bumbuļu nezālēm – tā vairojas ar bumbuļiem sakņu galos (D. Lapiņš, 2021, 43. att.). Pie bumbuļu nezālēm pieder arī purva sārmene.","source":"TEST","image":"atlas/test_q01"},{"id":"TT02","topic":"Nezāļu foto atlants","q":"Nezāli sauc","opts":["raibais aklis","sārtā panātre","baltā balanda","neaizmirstulīte"],"why":"Attēlā – aklis: robotas, apmatotas pretējas lapas, aug labības sējumā. Latvijā sastopamas 5 akļu sugas, tostarp raibais aklis (Galeopsis speciosa). Akļi ir īsmūža divdīgļlapju vasaras nezāles ar viegli izraujamu mietsakni.","source":"TEST","image":"atlas/test_q02"},{"id":"TT03","topic":"Slimības un kaitēkļi","q":"Šis kukainis ir pieaugušais īpatnis","opts":["drātstārpam","maijvaboles kāpuram","zirņu svītrainajam smecerniekam","kāpostu baltenim"],"why":"Attēlā – sprakšķis (sprakšķvabole). Tās kāpurs ir drātstārps. Veci zālāji veicina sprakšķu kāpuru (drātstārpu) izplatību.","source":"TEST","image":"atlas/test_q03"},{"id":"TT04","topic":"Nezāļu foto atlants","q":"Īsmūža divdīgļlapju nezāle, sēklas nogatavina 40 dienās pēc sadīgšanas, ir","opts":["sīkziedu sīkgalvīte jeb galinsoga","virza","ganu plikstiņš","tīruma pērkone"],"why":"Sīkziedu sīkgalvīte (galinsoga) ir vēlīnā vasaras nezāle ar sīkiem baltiem mēlziediem un dzeltenu vidu. Jau dīgstu stadijā tai izveidojas stipri zaraina, dziļa sakņu sistēma.","source":"TEST","image":"atlas/test_q04"},{"id":"TT05","topic":"Sakņu sistēmas ↔ augi","q":"Attēlā redzamās dziļās sakņu sistēmas pieder","opts":["A tīruma usnei, B tīruma tītenim un C tīruma kosai","A ložņu vārpatai, B tīruma mīkstpienei un C baltajai balandai","A ķeraiņu madarai, B sīkziedu sīkgalvītei, C tīruma usnei","A tīruma kosai, B tīruma usnei un C ložņu vārpatai"],"why":"D. Lapiņa 42. attēls: A – tīruma usne (dziļa, vairākos horizontālos stāvos izvietota sakņu sistēma), B – tīruma tītenis (dziļa mietsakne), C – tīruma kosa (sakneņi), D – tīruma mīkstpiene, E – ložņu vārpata.","source":"TEST","image":"atlas/test_q05"},{"id":"TT06","topic":"Sakņu sistēmas ↔ augi","q":"Attēlā redzamā sakņu sistēma pieder","opts":["ložņu vārpatai","tīruma usnei","tīruma kosai","ložņu gundegai"],"why":"Ložņu vārpatas sakneņi (pazemes stumbri ar pumpuriem) aramkārtā 5–15 cm dziļumā (D. Lapiņš, 40. att.). No sakneņu galiem un pumpuriem izaug jauni dzinumi.","source":"TEST","image":"atlas/test_q06"},{"id":"TT07","topic":"Nezāļu foto atlants","q":"Šīs nezāles sēklas spēj saglabāties augsnē vairākus gadus, izdīgt no liela dziļuma un ar higroskopisko akotiņu kā urbi ievilkt sevi zemē. Tā ir","opts":["vējauza","ložņu vārpata","gaiļsāre","tīruma aitene"],"why":"Vējauza (Avena fatua) – īsmūža viendīgļlapis, vizuāli līdzīga sējas auzām. Grauds matains, akots tumšs, savērpts. Sēklas saglabā dīgtspēju 3–8 gadus (buklets 2016); dīgšana samazinās par 87%, ja sēklas atrodas 20 cm dziļumā.","source":"TEST","image":"atlas/test_q07"},{"id":"TT08","topic":"Sakņu sistēmas ↔ augi","q":"Attēlā redzamā sakņu sistēma pieder","opts":["A mīkstpienei un B māllēpei","A vārpatai un B usnei","A tīruma mētrai un B pienenei","A māllēpei un B mīkstpienei"],"why":"D. Lapiņa 41. attēls: A – tīruma mīkstpiene (sakņu dzinumi), B – parastā māllēpe (sakneņi daudz dziļāk nekā vārpatai – 0,8–1,0 m, vairākos horizontālos stāvos).","source":"TEST","image":"atlas/test_q08"},{"id":"TT09","topic":"Herbicīdu rezistence","q":"Nezāles, kurām Latvijā ir sastopamas rezistentas formas pret herbicīdiem, ir","opts":["virza un rudzusmilga","vārpata un usne","gaiļsāre un balanda","madara un nātre"],"why":"Parastajai rudzusmilgai rezistence konstatēta arī Latvijā (Vanaga u.c., 2016). Parastā virza ir rezistenta pret B, O un C grupas herbicīdiem (vairāk nekā 20 gadījumi, arī Eiropā). Rezistences novēršanai nedrīkst vairākus gadus pēc kārtas lietot herbicīdus ar vienādu iedarbības mehānismu.","source":"TEST"},{"id":"TT10","topic":"Nezāļu foto atlants","q":"Augs – pusparazīts. Tautas medicīnā izmanto bronhītu, saaukstēšanās, gripas, angīnas, galvas sāpju u.c. ārstēšanai. To sauc","opts":["zvagulis","madara","pērkone","gundega"],"why":"Lielais zvagulis (Rhinanthus) ir pusparazītiskā nezāle – pats fotosintezē, bet daļu ūdens un barības vielu iegūst no saimniekauga saknēm. Pie pusparazītiem pieder arī parastais sārtžibulītis; parazīts – linu vija.","source":"TEST","image":"atlas/test_q10"},{"id":"TT11","topic":"Sakņu sistēmas ↔ augi","q":"Viendīgļlapju nezālei gaiļsārei pieder sakne","opts":["C attēlā","A attēlā","B attēlā","Neviena no attēlā redzamajām"],"why":"D. Lapiņa 39. attēls: A – baltā balanda (neliela, viegli izraujama mietsakne), B – sīkziedu sīkgalvīte (stipri zaraina mietsakne), C – parastā gaiļsāre (plaši sazarota bārkšsakņu sistēma, raksturīga viendīgļlapjiem).","source":"TEST","image":"atlas/test_q11"},{"id":"TT12","topic":"Nezāļu foto atlants","q":"Attēlā redzama daudzgadīga divdīgļlapju nezāle, kuru sauc","opts":["mīkstpiene","usne","skābene","ceļteka"],"why":"Tīruma mīkstpienes dīgsti (Hamouz, 2016): iegarenas, pelēcīgi zaļas lapas ar robotu malu rozetē. Tīruma mīkstpiene ir sakņu dzinumu nezāle; atšķirībā no usnes un tīteņa tās saknes neatrodas ļoti dziļi.","source":"TEST","image":"atlas/test_q12"},{"id":"TT13","topic":"Nezāļu foto atlants","q":"Augs, kas noderīgs pie gandrīz visām slimībām – īpaši tas palīdz samazināt drudzi, iekaisumu, sāpes un uzlabot apetīti. Šī daudzgadīgā nezāle ir","opts":["vībotne","ložņu gundega","ārstniecības kumelīte","strutene"],"why":"Parastā vībotne (Artemisia vulgaris) – daudzgadīga sakneņu nezāle; dīgsti ar plūksnaini dalītām lapām (Hamouz, 2016). Vībotnes var pasargāt kultūraugus no kaitēkļiem; bieži aug smilts augsnēs.","source":"TEST","image":"atlas/test_q13"},{"id":"TT14","topic":"Nezāļu foto atlants","q":"Viena no retajām divgadīgajām nezālēm. Indīga. Satur alkaloīdus. To sauc","opts":["ārstniecības vēršmēle","ārstniecības matuzāle","sīkā gandrene","tīruma gaurs"],"why":"Ārstniecības vēršmēle (Anchusa officinalis) – divgadīga nezāle ar violetiem ziediem un rupji apmatotām lapām. Divgadīgās nezāles pirmajā gadā saknēs uzkrāj barības rezerves, otrajā zied un nogatavina sēklas.","source":"TEST","image":"atlas/test_q14"},{"id":"TT15","topic":"Nezāļu foto atlants","q":"Vēl viena divgadīgā nezāle, to sauc","opts":["baltā spulgotne","baltā balanda","tīruma aitene","pelašķis"],"why":"Baltā spulgotne (Silene latifolia) – divgadīgā nezāle ar baltiem, iegriezti ziedlapainiem ziediem un piepūstu kausu. Pie divgadīgajām pieder arī ārstniecības vēršmēle, parastā sirmene, savvaļas burkāns, austrumu dižpērkone.","source":"TEST","image":"atlas/test_q15"},{"id":"TT16","topic":"Nezāļu bukleti","q":"Attēlos ir tīruma pērkone (pa kreisi) un tīruma zvēre (sinepe). Abas nezāles veicina kaitēkļu un slimību izplatību radniecīgiem kultūraugiem –","opts":["kāpostiem un rapsim","dažādiem graudaugiem","pupām un zirņiem","sīpolaugiem"],"why":"Pērkone un zvēre ir krustziežu dzimtas nezāles – tāpat kā kāposti un rapsis. Krustziežu nezāles var būt saimniekaugi rapša sakņu augoņu izraisītājam; zvēres veicina spradžu izplatību. Rapša herbicīdi pret radniecīgām nezālēm var būt nepietiekami efektīvi.","source":"TEST","image":"atlas/test_q16"},{"id":"TT17","topic":"Nezāļu foto atlants","q":"Izplatīta sūreņu dzimtas nezāle, to sauc","opts":["dārza vējagriķis","tīruma tītenis","maura sūrene","blusu sūrene"],"why":"Dārza vējagriķis (Fallopia convolvulus) – īsmūža divdīgļlapis ar iegarenām dīgļlapām un sirdsveida/bultveida lapām; vīteņaugs, ko var sajaukt ar tīruma tīteni. Sēklas galvenokārt dīgst pavasarī no 1,25–5 līdz 19 cm dziļuma.","source":"TEST","image":"atlas/test_q17"},{"id":"TT18","topic":"Nezāļu foto atlants","q":"Divdīgļlapju īsmūža viengadīgā nezāle. Vairojas ar sēklām. Pilnu attīstības ciklu pabeidz vienā veģetācijas periodā. Ražo līdz 800 riekstiņu. Jaunām sēklām dīdzība sliktāka. Spēj dot dīgstus no 6…7 cm dziļuma. Tā ir","opts":["blusu sūrene","dārza vējagriķis","tīruma tītenis","maura sūrene"],"why":"Blusu sūrene (Persicaria maculosa) – rožaini, blīvi vārpveida ziedkopas, lapām bieži tumšs plankums. Sūrenes ir īsmūža divdīgļlapji, patērē daudz barības vielu, labi aug mitrās un trūdvielām bagātās augsnēs.","source":"TEST","image":"atlas/test_q18"},{"id":"TT19","topic":"Herbicīdu rezistence","q":"Rezistence pret AAL Latvijā konstatēta","opts":["rudzusmilgai, virzai un vējauzai","tīruma kumelītei, rudzusmilgai un gaiļsārei","vējauzai, raibajam aklim un matuzālei","maura skarenei, lāčauzai un vējauzai"],"why":"Pēc kursa materiāliem: rudzusmilgai rezistence konstatēta Latvijā un Lietuvā; virzai – rezistence pret B, O un C grupas herbicīdiem; vējauzai pasaulē 50 gadījumi (9 Eiropā) pret A, B, E, K1, Z, N grupām.","source":"TEST"},{"id":"TT20","topic":"Herbicīdu rezistence","q":"Rezistences veidošanās risks ir mazāks, ja saimnieks izmanto","opts":["agrotehniskos pasākumus un AAL ar dažādiem iedarbības mehānismiem","agrotehniskos pasākumus un AAL ar vienādiem iedarbības mehānismiem","nesertificētu smidzinātāju","labu augsnes apstrādes tehniku"],"why":"Rezistences riska samazināšana: augu maiņa, tvertnes maisījumi ar atšķirīgām darbīgajām vielām un iedarbības mehānismiem (pēc HRAC), mehāniskā ierobežošana, lauka vēstures grāmata. Nedrīkst vairākus gadus pēc kārtas lietot vienādas darbīgās vielas.","source":"TEST"},{"id":"TT21","topic":"Bioloģiskās grupas","q":"Attēlā redzamā nezāle ir","opts":["daudzgadīgs viendīgļlapis","īsmūža viendīgļlapis","īsmūža divdīgļlapis","daudzgadīgs divdīgļlapis"],"why":"Attēlā – ložņu vārpata (Elymus repens) ar sakneņiem: daudzgadīga viendīgļlapju sakneņu nezāle. Vairojas ar sēklām, bet galvenokārt veģetatīvi – ar sakneņiem.","source":"TEST","image":"atlas/test_q21"},{"id":"BK001","topic":"Nezāļu bukleti","q":"Cik ilgi vējauzas sēklas saglabā dīgtspēju augsnē (pēc 2016. g. bukleta)?","opts":["3 līdz 8 gadus","1 līdz 2 gadus","25 līdz 30 gadus","līdz 60 gadiem"],"why":"Vējauzas sēklas augsnē saglabā dīgtspēju 3–8 gadus; dīgšana samazinās par 87%, ja sēklas atrodas 20 cm dziļumā. Gatavās sēklas no skaras izbirst pakāpeniski 3–4 nedēļu laikā.","source":"BOOK","image":"atlas/pp_vejauza"},{"id":"BK002","topic":"Nezāļu bukleti","q":"Kāpēc vējauzu ir sarežģīti ierobežot ar herbicīdiem?","opts":["Sēklas dīgst pakāpeniski līdz pat jūnija vidum","Tā dīgst tikai rudenī","Tā vairojas ar sakneņiem","Tai nav reģistrētu herbicīdu graudaugos"],"why":"Vējauzas sēklas dīgst pakāpeniski līdz pat jūnija vidum, tāpēc vienreizēja apstrāde visus dīgstus neaptver. Specializētie herbicīdi nav iespējami auzu sējumos.","source":"BOOK"},{"id":"BK003","topic":"Nezāļu bukleti","q":"Kurš apgalvojums par vējauzu ir pareizs?","opts":["Sēklas var saglabāt dīgtspēju arī izejot caur dzīvnieku gremošanas traktu","Tā ir daudzgadīga sakneņu nezāle","Tā sastopama tikai Kurzemē","Tās augi nepārsniedz 50 cm"],"why":"Vējauza ir īsmūža viendīgļlapis līdz 200 cm garumā, konstatēta 88% Latvijas novadu. Sēklas izplatās ar piesārņotu sēklas materiālu, vēju, ūdeni, apģērbu un tehniku; dīgtspēju saglabā arī pēc dzīvnieku gremošanas trakta.","source":"BOOK"},{"id":"BK004","topic":"Nezāļu bukleti","q":"Kurai stiebrzāļu nezālei rezistence pret herbicīdiem konstatēta arī Latvijā un Lietuvā?","opts":["parastajai rudzusmilgai","parastajai gaiļsārei","ložņu vārpatai","rudzu lāčauzai"],"why":"Parastā rudzusmilga: Eiropā, tostarp Lietuvā un Latvijā (Vanaga u.c., 2016), konstatēti 15 rezistences gadījumi pret A, B vai C grupas herbicīdiem.","source":"BOOK"},{"id":"BK005","topic":"Nezāļu bukleti","q":"Kad galvenokārt dīgst parastā rudzusmilga?","opts":["Rudenī, augi pārziemo","Tikai vasaras otrajā pusē","Agri pavasarī","Tikai pēc ražas novākšanas vasarā"],"why":"Parastā rudzusmilga – īsmūža viendīgļlapis, galvenokārt dīgst rudenī; sēklu dīgtspēja augsnē 1–2 gadi. Būtiski samazina ziemas kviešu ražu. Ir saimniekaugs labību rūsas (Puccinia) izraisītājiem.","source":"BOOK"},{"id":"BK006","topic":"Nezāļu bukleti","q":"Kuras slimības izraisītājiem parastā rudzusmilga ir saimniekaugs?","opts":["laukaugu rūsām (Puccinia sp.)","kartupeļu lakstu puvei","rapša sakņu augoņiem","gurķu mozaīkvīrusam"],"why":"Parastā rudzusmilga ir saimniekaugs laukaugu rūsas izraisītājiem. Arī usnes palīdz izplatīt labību rūsas.","source":"BOOK","image":"atlas/pp_rusa"},{"id":"BK007","topic":"Nezāļu bukleti","q":"Kas veicina maura skarenes savairošanos?","opts":["Sekla augsnes apstrāde","Dziļa aršana","Biezs, spēcīgs kultūraugs","Rapša iekļaušana augu maiņā"],"why":"Maura skarene galvenokārt dīgst rudenī (līdz novembrim). Sekla augsnes apstrāde un kultūrauga izretinājums sekmē tās savairošanos; biezs, spēcīgs kultūrauga sējums to nomāc.","source":"BOOK"},{"id":"BK008","topic":"Nezāļu bukleti","q":"Cik rudzu lāčauzas augi uz m² jau var samazināt ziemas kviešu ražu?","opts":["5–7 augi","100–200 augi","50–70 augi","Tikai vairāk kā 500 augi"],"why":"Rudzu lāčauza: jau 5–7 augi/m² var samazināt ziemas kviešu ražu. Sēklas izplatās ar piesārņotu sēklas materiālu un tehniku; jāar maksimāli dziļi (vismaz 12,5 cm), lai novērstu sēklu dīgšanu.","source":"BOOK","image":"atlas/pp_lacauza"},{"id":"BK009","topic":"Nezāļu bukleti","q":"Kura stiebrzāļu nezāle dīgst vēlu pavasarī vai vasarā, labi cero un no augsnes var iznest 60–80% slāpekļa?","opts":["parastā gaiļsāre","parastā rudzusmilga","maura skarene","rudzu lāčauza"],"why":"Parastā gaiļsāre – īsmūža viendīgļlapis (vēlīnā vasaras nezāle). Sēklas vislabāk dīgst no 1–2 cm dziļuma; dīgšanu veicina silts un mitrs laiks, daudz slāpekļa. Visvairāk pupu sējumos un kartupeļos, kukurūzā.","source":"BOOK","image":"atlas/pp_gailsare"},{"id":"BK010","topic":"Nezāļu bukleti","q":"Kāpēc sekla augsnes apstrāde var veicināt ložņu vārpatas savairošanos?","opts":["Tiek sasmalcināti sakneņi un aktivizēti to pumpuri","Tiek iestrādātas tās sēklas dziļāk","Tiek iznīcinātas tās saknes","Augsne kļūst skābāka"],"why":"Sekla apstrāde sagriež sakneņus un aktivizē pumpurus, kas izveidojušies sakneņiem un ir miera periodā jūlijā. Viena auga sakneņi var izplatīties 3 m diametrā un izveidot >200 dzinumu.","source":"BOOK"},{"id":"BK011","topic":"Nezāļu bukleti","q":"Kas ir Kvik-Finn tehnoloģija ložņu vārpatas ierobežošanā?","opts":["Kultivatora apstrāde, kas paceļ sakneņus virskārtā, kur tie izžūst","Glifosāta smidzināšana ziedēšanas laikā","Dziļirdināšana bez augsnes apvēršanas","Zālāja ierīkošana uz 5 gadiem"],"why":"Kvik-Finn – augsnes apstrāde ar kultivatoru, kas paceļ sakneņus augsnes virskārtā, kur tie izžūst un aiziet bojā (pētījumi Dānijā un Somijā). Smacēšanas metode: sakneņus sasmalcina 4–10 cm gabalos un, parādoties asniem, lauku dziļi uzar.","source":"BOOK"},{"id":"BK012","topic":"Nezāļu bukleti","q":"Kā ķeraiņu madaru dīgļlapu stadijā atšķir no parastās rudzupuķes?","opts":["Madarai dīgļlapu galos ir izteikts ieliekums, rudzupuķei – noapaļoti gali","Madarai dīgļlapas ir violetas","Rudzupuķei dīgļlapas ir dalītas","Madarai dīgļlapu nav"],"why":"Pēc 2017. g. bukleta: parastās rudzupuķes dīgļlapas ir galā noapaļotas, ķeraiņu madarai – ar izteiktu ieliekumu galos.","source":"BOOK"},{"id":"BK013","topic":"Nezāļu bukleti","q":"Kura ir viena no nezālēm, kas visvairāk samazina ražu – viens augs uz m² var samazināt ziemas kviešu ražu par 0,7–2,9%?","opts":["ķeraiņu madara","tīruma gaurs","saules dievkrēsliņš","tīruma veronika"],"why":"Ķeraiņu madara patērē daudz barības vielu, apgrūtina ražas novākšanu, var veicināt veldri; augļi grūti atdalāmi no kultūraugu sēklām. Sēklas dīgst no 2–5 cm, vieglā augsnē līdz 10 cm dziļuma.","source":"BOOK"},{"id":"BK014","topic":"Nezāļu bukleti","q":"Cik ilgi parastās virzas sēklas var saglabāt dīgtspēju augsnē?","opts":["25–30 gadus","1–2 gadus","3–5 gadus","tikai vienu ziemu"],"why":"Parastā virza: sēklas saglabā dīgtspēju 25–30 gadus, maksimālais dīgšanas dziļums 4–5 cm. Vairojas ar sēklām un veģetatīvi; agrās stadijās ļoti konkurētspējīga ar graudaugiem.","source":"BOOK","image":"atlas/pp_virza"},{"id":"BK015","topic":"Nezāļu bukleti","q":"Pret kurām HRAC grupām galvenokārt rezistenta ir parastā virza?","opts":["B, O un C","tikai A","K1 un N","F1 un K3"],"why":"Pasaulē, arī Eiropā, reģistrēti vairāk nekā 20 virzas rezistences gadījumi, galvenokārt pret B (ALS inhibitori), O (sintētiskie auksīni) un C (fotosintēzes inhibitori) grupu herbicīdiem.","source":"BOOK"},{"id":"BK016","topic":"Nezāļu bukleti","q":"Cik baltās balandas sēklu var saražot viens augs (kursa prezentācijas dati)?","opts":["ap 32 000","ap 300","ap 3 000 000","ap 30"],"why":"Nezālēm raksturīga ļoti augsta sēklu ražotspēja: balanda ~32 000, tīruma mīkstpiene ~12 400, ganu plikstiņš ~10 300, tīruma usne ~7 200 sēklu vienam augam.","source":"BOOK"},{"id":"BK017","topic":"Nezāļu bukleti","q":"Kura nezāle, pēc kursa prezentācijas, spēj dīgt pat pēc ļoti ilga laika – minēti 500 gadi?","opts":["balanda","vējauza","maura skarene","parastā rudzusmilga"],"why":"Ap 40 gadus dīgtspēju spēj saglabāt ceļmallapa, skābene, balanda, akļi, zvēre, ganu plikstiņš; balandas sēklas dīgst pat pēc 500 gadiem (S. Audere, nezāles.pptx).","source":"BOOK"},{"id":"BK018","topic":"Nezāļu bukleti","q":"Kurai sārtās panātres īpašībai pievērsta uzmanība Eiropā?","opts":["Iekļauta starp bīstamākajām nezālēm ziemāju sējumos un ziemas rapsī","Tā ir daudzgadīga sakņu dzinumu nezāle","Tā ir parazītiska nezāle","Tā aug tikai ūdenī"],"why":"Sārtā panātre ir ziemotspējīgs īsmūža divdīgļlapis; vienā sezonā var attīstīties divas paaudzes; var iesakņoties ar papildsaknēm, kas veidojas pie jebkuras stublāja daļas.","source":"BOOK"},{"id":"BK019","topic":"Nezāļu bukleti","q":"Kā zīda magoni atšķir no lauka magones ziedēšanas laikā?","opts":["Pēc matiņiem uz stublāja zem zieda: zīda magonei tie stāv horizontāli","Pēc ziedu krāsas: zīda magone ir dzeltena","Zīda magonei nav lapu","Lauka magone ir daudzgadīga"],"why":"Lauka magonei matiņi pieguļ pie stublāja, zīda magonei stāv horizontāli. Magones ir ziemotspējīgas, sēklas dīgst no 1–2,5 cm un var saglabāt dīgtspēju līdz 50 gadiem.","source":"BOOK"},{"id":"BK020","topic":"Nezāļu bukleti","q":"Kur tīruma kumelītes sēklas zaudē dīgtspēju?","opts":["Skābsienā vai skābbarībā","Augsnē pēc 1 gada","Kūtsmēslos","Pēc pārziemošanas"],"why":"Tīruma kumelīte (ziemotspējīga) dīgtspēju augsnē saglabā 4–6 gadus, bet tā zūd skābsienā vai skābbarībā. 3–7 augi/m² samazina ziemāju ražu par ~5%.","source":"BOOK"},{"id":"BK021","topic":"Nezāļu bukleti","q":"Kāpēc tīruma nauduli un ganu plikstiņu rapsī grūti ierobežot ar herbicīdiem?","opts":["Tie, tāpat kā rapsis, pieder krustziežu dzimtai","Tie ir daudzgadīgi","Tie dīgst tikai rudenī","Tie ir viendīgļlapji"],"why":"Krustziežu dzimtas nezāles (naudulis, ganu plikstiņš, zvēre) ir radniecīgas rapsim, tāpēc rapša herbicīdu efektivitāte pret tām var būt nepietiekama. Tās var būt saimniekaugi rapša sakņu augoņu izraisītājam.","source":"BOOK"},{"id":"BK022","topic":"Nezāļu bukleti","q":"Kas veicina ganu plikstiņa sēklu izplatīšanos ar apaviem un tehniku?","opts":["Sēklas virsma izdala lipīgu sekrētu","Sēklām ir lidpūkas","Sēklām ir āķīši","Sēklas peld ūdenī"],"why":"Ganu plikstiņa sēklas virsma izdala lipīgu sekrētu, tāpēc jāveic higiēnas pasākumi – tehnikas, apavu tīrīšana. Sēklas vislabāk dīgst no 5–10 cm dziļuma; miera periodā dīgtspēju saglabā līdz 35 gadiem.","source":"BOOK"},{"id":"BK023","topic":"Nezāļu bukleti","q":"Kā tīruma zvēri (sinepi) atšķir no tīruma pērkones ziedos?","opts":["Zvērei ziedi koši dzelteni, pērkonei – bāli dzelteni (reizēm balti)","Zvērei ziedi zili","Pērkonei ziedi violeti","Atšķirt nav iespējams"],"why":"Tīruma zvēres dīgļlapas ir tumši zaļas no virspuses, violetas no apakšpuses. Pērkones pirmajai lapai smailāks gals, tā raupjāka un vairāk dalīta. Zvēres sēklas augsnē var saglabāties līdz 60 gadiem.","source":"BOOK"},{"id":"BK024","topic":"Nezāļu bukleti","q":"Kāpēc, ravējot saules dievkrēsliņu, jālieto cimdi?","opts":["Piensula var radīt ādas un acu kairinājumu","Tam ir dzeloņi","Tas izdala lipīgu sekrētu","Tas ir parazītisks"],"why":"Saules dievkrēsliņš ir indīga nezāle cilvēkiem un mājlopiem. Augi jāizrauj ar visu sakni, citādi veidojas jauni dzinumi. Var būt saimniekaugs kartupeļu vīrusam X.","source":"BOOK"},{"id":"BK025","topic":"Nezāļu bukleti","q":"Kādās augsnēs labi aug tīruma gaurs?","opts":["Skābās (pH 4,6–5,0) un vieglās, smilšainās augsnēs","Kaļķainās, smagās māla augsnēs","Tikai mitrās kūdras augsnēs","Sāļās augsnēs"],"why":"Tīruma gaurs – īsmūža divdīgļlapju vasaras nezāle, labi aug skābās un smilšainās augsnēs. Ierobežošanā palīdz kaļķošana. Būtiskus vasaras miežu ražas zudumus rada tikai, ja ir >200 augi/m².","source":"BOOK"},{"id":"BK026","topic":"Nezāļu bukleti","q":"Cik garš sakņu fragments ir pietiekams, lai no tā attīstītos jauns tīruma usnes augs?","opts":["pat 3 mm","vismaz 50 cm","vismaz 1 m","jauni augi no saknēm neattīstās"],"why":"Tīruma usne izplatās galvenokārt ar augsnē palikušiem sakņu fragmentiem (pat 3 mm). Sakņu sistēma zem aramkārtas var sasniegt līdz 5 m dziļumu. Dziļaršana fragmentē saknes un veicina savairošanos.","source":"BOOK","image":"atlas/pp_usne_dzinumi"},{"id":"BK027","topic":"Nezāļu bukleti","q":"Kad herbicīdu lietošana tīruma usnes ierobežošanā ir visefektīvākā?","opts":["Kad visiem augiem izveidojušās lapu rozetes – rudenī pēc ražas novākšanas","Uzreiz pēc sēklu nogatavošanās","Ziemā uz sasalušas augsnes","Pirms sadīgšanas"],"why":"Ieteicamais laiks – rudens pēc ražas novākšanas, kad visiem augiem ir lapu rozetes. Jaunie augi ir uzņēmīgāki pret herbicīdiem nekā nobrieduši.","source":"BOOK"},{"id":"BK028","topic":"Nezāļu bukleti","q":"Kura no mīkstpienēm ir daudzgadīga?","opts":["tīruma mīkstpiene","dārza mīkstpiene","abas ir viengadīgas","abas ir divgadīgas"],"why":"Latvijā sastopamas 4 mīkstpieņu sugas. Tīruma mīkstpiene (Sonchus arvensis) – daudzgadīga sakņu dzinumu nezāle; dārza mīkstpiene (S. oleraceus) – viengadīga divdīgļlapju nezāle.","source":"BOOK"},{"id":"BK029","topic":"Nezāļu bukleti","q":"Ko vajadzētu pārbaudīt pirms herbicīdu lietošanas pret tīruma kosu?","opts":["Vai nav jāsakārto meliorācijas sistēma – mitruma režīms augsnē","Vai augsne nav pārāk sausa","Vai kosa jau ir uzziedējusi","Vai laukā aug rapsis"],"why":"Tīruma kosa īpaši labi aug mitrās, slikti drenētās vietās ar augstu gruntsūdeni un sablīvētu augsni. Herbicīdi nebūs risinājums, ja problēma ir meliorācijas defekti. 2,4-D un MCPA iznīcina dzinumus, bet netiek transportēti dziļāk saknenī.","source":"BOOK","image":"atlas/pp_kosa_sporas"},{"id":"BK030","topic":"Nezāļu bukleti","q":"Kāpēc tīruma kosa var būt kaitīga atgremotājiem mājlopiem?","opts":["Tā satur enzīmu tiamināzi, kas izraisa avitaminozi","Tā satur alkaloīdus, kas izraisa paralīzi","Tā satur piensulu, kas kairina ādu","Tai ir asas sporas"],"why":"Tīruma kosa satur tiamināzi – enzīmu, kas izraisa vitamīna trūkumu (avitaminozi). Kosu uzskata par indikatoru erodētai augsnei.","source":"BOOK"},{"id":"BK031","topic":"Nezāļu bukleti","q":"Kura daudzgadīgā nezāle ar gumiņbaktēriju palīdzību piesaista atmosfēras slāpekli?","opts":["vanagu vīķis","tīruma usne","ložņu vārpata","tīruma kosa"],"why":"Vanagu vīķis – daudzgadīgs divdīgļlapis ar dziļu sakņu sistēmu; vairojas ar sēklām un veģetatīvi. Dažviet to izmanto kā lopbarības augu (proteīns sausnā līdz 30%).","source":"BOOK"},{"id":"BK032","topic":"Nezāļu bukleti","q":"Kura HRAC grupa ir acetolaktāta sintāzes (ALS) inhibitori?","opts":["B","A","O","C"],"why":"Latvijā biežāk lietoto herbicīdu grupas: A – ACC inhibitori, B – ALS inhibitori, O – sintētiskie auksīni, C – fotosintēzes inhibitori. Viena HRAC grupa apvieno vielas ar vienādu iedarbības mehānismu.","source":"BOOK"},{"id":"BK033","topic":"Nezāļu bukleti","q":"Kura pazīme var liecināt par nezāļu rezistenci pret herbicīdu?","opts":["Blakus bojā gājušiem nezāļu augiem ir dzīvi tās pašas sugas augi","Visas nezāles laukā aiziet bojā","Kultūraugs nodzeltē","Nezāles uzzied ātrāk"],"why":"Rezistences pazīmes: efektivitāte pakāpeniski samazinās vairāku gadu laikā; dzīvi tās pašas sugas augi blakus bojā gājušiem; veidojas nezāļu laukumi. Vispirms jāizvērtē smidzināšanas kvalitāte, augsnes un laika apstākļi.","source":"BOOK"},{"id":"BK034","topic":"Nezāļu bukleti","q":"Kura nezāle norāda uz skābu augsni?","opts":["mazā skābene","cigoriņi","māllēpe","tīruma zilausis"],"why":"Skābā augsnē: tīruma atraitnīte, žultszālītes, sveķenes, mazās skābenes. Kaļķainās augsnēs: cigoriņi, tīruma zilauši, māllēpes. Mitrās vietās: tīruma mētra, kosas.","source":"BOOK"},{"id":"BK035","topic":"Nezāļu bukleti","q":"Kuras nezāles norāda uz augsnes sablīvēšanos?","opts":["usnes, lielās ceļtekas, šaurlapu ceļtekas, maura kumelītes","virza, nātres, balandas","magones un rudzupuķes","tīruma gaurs un sveķenes"],"why":"Uz augsnes sablīvēšanos norāda usnes, lielās un šaurlapu ceļtekas, maura kumelītes (D. Piliksere, 2022).","source":"BOOK"},{"id":"BK036","topic":"Nezāļu bukleti","q":"Kuras nezāles pieder pie «neiznīcināmajām» daudzgadīgajām nezālēm ar spēcīgu sakņu sistēmu?","opts":["vārpata, usnes, tīruma mīkstpiene","virza, panātres, tīruma vijolīte","tīruma gaurs, matuzāle, neaizmirstulītes","balandas, rudzupuķes, vējauzas"],"why":"Nezāļu tipi pēc dzīves stratēģijām: «kultūristes» – balandas, rudzupuķes, vējauzas; «agrie putni» – virza, panātres, vijolīte, kumelīte, rudzusmilga; «plebeji» – gaurs, matuzāle, neaizmirstulītes; «neiznīcināmās» – vārpata, usnes, tīruma mīkstpiene; «zālaugu sugas» – pienene, ložņu gundega.","source":"BOOK"},{"id":"BK037","topic":"Nezāļu bukleti","q":"Kurām nezālēm sēklas izplatās ar lidpūkām?","opts":["usnei, mīkstpienei, pienenei","ķeraiņu madarai un savvaļas burkānam","vējauzai un rudzusmilgai","virzai un balandai"],"why":"Lidpūkas – usne, mīkstpiene, pienene. Āķīši – ķeraiņu madara, savvaļas burkāns.","source":"BOOK"},{"id":"BK038","topic":"Nezāļu bukleti","q":"Kas veicina drātstārpu (sprakšķu kāpuru) izplatību?","opts":["Veci zālāji","Zvēres","Usnes","Stiebrzāles"],"why":"Nezāles kā starpsaimnieki: stiebrzāles – labību sakņu puves, usnes – labību rūsas, veci zālāji – sprakšķu kāpuri (drātstārpi), zvēres – spradži.","source":"BOOK","image":"atlas/pp_dratstarps"},{"id":"BK039","topic":"Nezāļu bukleti","q":"Nezāļu-laukauga konkurences kritiskajā (2.) periodā laukaugam jābūt","opts":["bez nezālēm","noēnotam ar nezālēm","neapstrādātam","tikko iesētam"],"why":"Nezāles, kas sadīgst kopā ar laukaugu, jāierobežo pirms 1. perioda beigām. 2. periodā laukaugam jābūt bez nezālēm. 3. periodā sadīgušajām nezālēm ir maza ietekme uz ražu.","source":"BOOK"},{"id":"BK040","topic":"Nezāļu bukleti","q":"Kura nezāle ir parazītiska (bez hlorofila, visas barības vielas iegūst no saimniekauga)?","opts":["linu vija","lielais zvagulis","parastais sārtžibulītis","ložņu gundega"],"why":"Pēc barošanās veida nezāles iedala neparazītiskās, pusparazītiskās (lielais zvagulis, parastais sārtžibulītis) un parazītiskās (vijas, piem., linu vija).","source":"BOOK"},{"id":"BK041","topic":"Nezāļu bukleti","q":"Ar ko tīruma tītenis atšķiras no dārza vējagriķa?","opts":["Tītenis ir daudzgadīgs ar sakņu dzinumiem, vējagriķis – īsmūža ar sēklām","Abi ir daudzgadīgi","Tītenis ir viendīgļlapis","Vējagriķis vairojas ar sakneņiem"],"why":"Tīruma tītenis – daudzgadīga sakņu dzinumu nezāle ar dziļu mietsakni; lieli balti/rožaini piltuvveida ziedi. Dārza vējagriķis – īsmūža divdīgļlapis (sūreņu dzimta), vairojas tikai ar sēklām.","source":"BOOK","image":"atlas/pp_titenis"},{"id":"BK042","topic":"Nezāļu bukleti","q":"Cik daudz potenciālās ražas Latvijā ik gadus nezāļu dēļ neievāc (atkarībā no kultūrauga)?","opts":["10–20%","1–2%","50–60%","80–90%"],"why":"Speciālisti uzskata, ka atkarībā no kultūrauga Latvijā ik gadus neievāc 10–20% potenciālās ražas. Nezāles patērē divreiz un vairāk barības vielu un mitruma nekā laukaugi.","source":"BOOK"},{"id":"BK043","topic":"Nezāļu bukleti","q":"Kāda ir potenciālā augsnes nezāļainība aramkārtā (sēklu krājums)?","opts":["līdz 1 miljardam sēklu uz 1 ha","līdz 1000 sēklām uz 1 ha","līdz 10 sēklām uz 1 m²","sēklas augsnē nesaglabājas"],"why":"Potenciālā nezāļainība aramkārtā var sasniegt 1 miljardu nezāļu sēklu uz ha. Daudzu nezāļu sēklas dīgtspēju saglabā 30–40 gadus (ceļteka, skābene, balandas, akļi, zvēre, plikstiņš, gaurs).","source":"BOOK"},{"id":"BK044","topic":"Nezāļu bukleti","q":"Kurā gadalaikā pārsvarā dīgst lauka vijolīte?","opts":["rudenī","jūlijā","tikai pēc ziemas","nedīgst – vairojas ar sakneņiem"],"why":"Lauka vijolīte – īsmūža divdīgļlapis, pārsvarā dīgst rudenī; sēklas dīgst līdz 4–5 cm dziļumam un saglabā dīgtspēju līdz 5 gadiem. Rapša sējumos jāierobežo savlaicīgi, pirms rapša dīgšanas.","source":"BOOK"},{"id":"BK045","topic":"Nezāļu bukleti","q":"Kurš apgalvojums par veronikām ir pareizs?","opts":["Sēklas spēj dīgt no 1 cm dziļuma; tās ir pašapputes augi","Tās ir daudzgadīgas sakneņu nezāles","Tās aug tikai mitrās vietās","Sēklas augsnē nesaglabājas"],"why":"Veronikas – īsmūža, ziemotspējīgi divdīgļlapji. Sēklas ilgstoši saglabājas augsnē (spēj dīgt pat 30 gadus vecas). Ieviešas izretinātās vietās, var augt arī apēnojumā.","source":"BOOK","image":"atlas/pp_veronika"}],"images":{"1":"assets/photos/weed_1.jpg","2":"assets/photos/weed_2.jpg","3":"assets/photos/weed_3.jpg","4":"assets/photos/weed_4.jpg","5":"assets/photos/weed_5.jpg","6":"assets/photos/weed_6.jpg","7":"assets/photos/weed_7.jpg","8":"assets/photos/weed_8.jpg","9":"assets/photos/weed_9.jpg","10":"assets/photos/weed_10.jpg","11":"assets/photos/weed_11.jpg","12":"assets/photos/weed_12.jpg","13":"assets/photos/weed_13.jpg","14":"assets/photos/weed_14.jpg","15":"assets/photos/weed_15.jpg","16":"assets/photos/weed_16.jpg","17":"assets/photos/weed_17.jpg","18":"assets/photos/weed_18.jpg","19":"assets/photos/weed_19.jpg","20":"assets/photos/weed_20.jpg","21":"assets/photos/weed_21.jpg","22":"assets/photos/weed_22.jpg","23":"assets/photos/weed_23.jpg","24":"assets/photos/weed_24.jpg","25":"assets/photos/weed_25.jp
