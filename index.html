tenis"},{"label":"Ložņu vārpatas sakneņi","image":"atlas/pp_varpata_saknenis"},{"label":"Parastā virza ziedā","image":"atlas/pp_virza"},{"label":"Tīruma usnes sakņu sistēma augsnē","image":"atlas/pp_usne_saknes"},{"label":"Tīruma usnes sakņu dzinumi","image":"atlas/pp_usne_dzinumi"},{"label":"Veronika ziedā","image":"atlas/pp_veronika"},{"label":"Vējauzas skaras","image":"atlas/pp_vejauza"},{"label":"Parastās gaiļsāres skara","image":"atlas/pp_gailsare"},{"label":"Lāčauzas vārpiņas","image":"atlas/pp_lacauza"}]},"mk950":{"url":"https://likumi.lv/ta/id/241853-augu-aizsardzibas-lidzeklu-lietosanas-noteikumi","points":{"1":"1. Noteikumi nosaka:","1.1":"1.1. augu aizsardzības līdzekļu lietošanas un uzglabāšanas prasības;","1.2":"1.2. profesionālo augu aizsardzības līdzekļu lietotāju un augu aizsardzības līdzekļu lietošanas operatoru pienākumus un tiesības;","1.3":"1.3. novērtējuma sagatavošanas kārtību par iespējamo risku augu aizsardzības līdzekļa izsmidzināšanā no gaisa;","1.4":"1.4. atļaujas izsniegšanas kārtību augu aizsardzības līdzekļu izsmidzināšanai no gaisa;","1.5":"1.5. speciālos pasākumus ūdens vides un dzeramā ūdens aizsardzībai.","2":"2. Noteikumu ievērošanas uzraudzību un kontroli veic Valsts augu aizsardzības dienests (turpmāk – dienests).\nII. Augu aizsardzības līdzekļu uzglabāšanas prasības","3":"3. Augu aizsardzības līdzekļus uzglabā oriģinālā iepakojumā, ievērojot marķējumā noteiktos uzglabāšanas apstākļus, kā arī Augu aizsardzības likuma 9.panta trešās daļas un Aizsargjoslu likuma prasības.","4":"4. Augu aizsardzības līdzekļus uzglabā plauktos vai uz paletēm. Ja uzglabāšanas vieta ir telpa, kurā persona var uzturēties, lai veiktu darbības ar augu aizsardzības līdzekļiem (piemēram, kārtotu, pārvietotu), tajā nodrošina gaisa apmaiņu.\n(MK 19.11.2014. noteikumu Nr.706 redakcijā)","5":"5. Par augu aizsardzības līdzekļu uzglabāšanas vietām aizliegts izmantot degvielas noliktavas, dzīvojamās vai administratīvās telpas, dzīvnieku novietnes, būves, kuras var applūst, un pagrabus, izņemot tos, kas ir būvēti virs zemes.","6":"6. Pirmās reģistrācijas klases augu aizsardzības līdzekļus uzglabā slēgtā, vēdināmā telpā atsevišķi no pārējiem augu aizsardzības līdzekļiem.","7":"7. Izlietoto augu aizsardzības līdzekļu iepakojumus līdz to apglabāšanai tur kopā ar augu aizsardzības līdzekļiem un apglabā saskaņā ar normatīvajos aktos par atkritumu apsaimniekošanu noteikto kārtību. Šo prasību var neievērot, ja izlietotā augu aizsardzības līdzekļa iepakojums saskaņā ar normatīvajiem aktiem par atkritumu klasifikatoru un īpašībām, kuras padara atkritumus bīstamus, vairs nav uzskatāms par bīstamu atkritumu.\nIII. Augu aizsardzības līdzekļu lietošanas prasības","8":"8. Saimniecībā, kurā tiek uzglabāti vai lietoti augu aizsardzības līdzekļi, darbā iesaistītajām personām ir pieejami:","8.1":"8.1. individuālie aizsardzības līdzekļi (piemēram, respirators, aizsargbrilles, aizsargapģērbs, cimdi);","8.2":"8.2. absorbējošie materiāli (piemēram, sausas zāģu skaidas vai kūdra);","8.3":"8.3. inventārs, kas nepieciešams glābšanas pasākumiem, ja augu aizsardzības līdzekļi izbirst vai izlīst (piemēram, slota, spainis, liekšķere).","9":"9. Augu aizsardzības līdzekļus atļauts lietot tikai tam mērķim un pret tiem kaitīgajiem organismiem, kas minēti marķējumā, nepārsniedzot norādīto devu, kā arī ievērojot marķējuma prasības par augu aizsardzības līdzekļu atšķaidīšanu un maisījumu gatavošanu pirms lietošanas, kultūrauga attīstības stadiju, apstrāžu skaitu sezonā, nogaidīšanas laiku no pēdējās apstrādes līdz ražas novākšanai un ierobežojumus attiecībā uz cilvēku un dzīvnieku veselības un vides aizsardzību.","10":"10. Par prasību ievērošanu attiecībā uz cilvēku un dzīvnieku veselības un vides aizsardzību ir atbildīgs ikviens augu aizsardzības līdzekļu lietotājs, kā arī augu aizsardzības līdzekļu lietošanas operators.","11":"11. Lietošanai pēc iespējas izvēlas tādus augu aizsardzības līdzekļus, kuri potenciāli var radīt mazāku risku videi un cilvēku un dzīvnieku veselībai, kuri nav kvalificēti kā bīstami ūdens videi un kuros nav prioritāro bīstamo vielu saskaņā ar normatīvajiem aktiem par ūdens apsaimniekošanu. Informāciju par augu aizsardzības līdzekļiem un to iespējamo blakusiedarbību uz cilvēku veselību un vidi dienests ievieto un aktualizē savā tīmekļa vietnē.","12":"12. Lai aizsargātu ūdens vidi un dzeramā ūdens ņemšanas vietas, augu aizsardzības līdzekļus lieto, ievērojot normatīvajos aktos par aizsargjoslām minētās prasības.","13":"13. Pirmās un otrās reģistrācijas klases augu aizsardzības līdzekļu lietotājs kārto reģistrācijas žurnālu. Reģistrācijas žurnālā uzskaita gan iegādātos augu aizsardzības līdzekļus (norāda saņemšanas datumu, augu aizsardzības līdzekļa nosaukumu, iepakojuma lielumu un daudzumu), gan izlietotos augu aizsardzības līdzekļus (norāda informāciju par apstrādāto kultūraugu sugu vai objektu (piemēram, labības noliktava), apstrādāto teritoriju, tās platību, apstrādes datumu, lietotā augu aizsardzības līdzekļa nosaukumu un devu). Reģistrācijas žurnālu glabā vismaz trīs gadus.","13¹":"13.1 Ja augu aizsardzības līdzekļi lietoti, izmantojot profesionāla augu aizsardzības līdzekļu lietotāja sniegtu pakalpojumu, tad pakalpojuma sniedzējs apstrādātā objekta īpašniekam izsniedz izrakstu no reģistrācijas žurnāla par apstrādāto objektu, norādot tajā šo noteikumu 13. punktā un 23.2. apakšpunktā minēto informāciju, kā arī pakalpojumu sniedzēja vārdu, uzvārdu, adresi un lietotāja apliecības numuru. Izrakstu sagatavo divos eksemplāros, un uz eksemplāra, kas paliek pie pakalpojumu sniedzēja, jābūt apstrādātā objekta īpašnieka parakstam. Objekta īpašnieks izrakstu glabā trīs gadus un pēc pieprasījuma uzrāda dienestam.\n(MK 19.11.2014. noteikumu Nr.706 redakcijā)","14":"14. Lietojot augu aizsardzības līdzekļus, aizliegts:","14.1":"14.1. iesaistīt darbā personas, kas jaunākas par 18 gadiem, grūtnieces un mātes, kas baro bērnu ar krūti;","14.2":"14.2. izmantot bojātas, nenoregulētas augu aizsardzības līdzekļu lietošanas iekārtas, kā arī iekārtas, kas nav pārbaudītas normatīvajos aktos par augu aizsardzības līdzekļu lietošanas iekārtām noteiktajā kārtībā;","14.3":"14.3. atstāt bez uzraudzības sagatavotus darba šķidrumus un neizlietotus augu aizsardzības līdzekļus;","14.4":"14.4. izliet smidzināšanai paredzētā darba šķidruma atlikumu;","14.5":"14.5. nepiederošām personām uzturēties vietā, kur strādā ar augu aizsardzības līdzekļiem;","14.6":"14.6. ēst, dzert un smēķēt.\n(14.2.apakšpunktā minētās prasības attiecībā uz iekārtu pārbaudi stājas spēkā 26.11.2016., sk. 44.punktu)","15":"15. Iztukšoto augu aizsardzības līdzekļa iepakojumu darba šķidruma gatavošanas laikā trīs reizes izskalo ar tīru ūdeni un skalojamo ūdeni iepilda darba šķidruma tvertnē. Darbīgo vielu magnija un alumīnija fosfīdu saturošu augu aizsardzības līdzekļu iepakojumu apsaimnieko atbilstoši normatīvo aktu prasībām par atkritumu apsaimniekošanu un saskaņā ar norādēm šo augu aizsardzības līdzekļu marķējumā.\n(MK 19.11.2014. noteikumu Nr.706 redakcijā)","16":"16. Pēc augu aizsardzības līdzekļa lietošanas darba šķidruma atlikumu atšķaida ar lielu ūdens daudzumu un izsmidzina uz apstrādāta lauka. Darbu beidzot, iekārtas tvertni izskalo ar tīru ūdeni vai ar lietotā augu aizsardzības līdzekļa marķējumā norādīto mazgāšanas līdzekli, ko izsmidzina uz apstrādāta lauka.","17":"17. Aizliegts atkārtoti izmantot izlietoto augu aizsardzības līdzekļu iepakojumus.","18":"18. Lietojot augu aizsardzības līdzekļus sējumu un stādījumu apsmidzināšanai, ievēro šādus drošības pasākumus:","18.1":"18.1. augus drīkst apsmidzināt, ja vēja ātrums nepārsniedz četrus metrus sekundē. Ja smidzinātājs ir aprīkots ar rūpnieciski komplektētām palīgierīcēm (palīgiekārtām), kas mazina vēja ietekmi uz smidzinājumu, nodrošinot smidzinājuma nokļūšanu tikai uz paredzētās apstrādājamās virsmas, augus drīkst apsmidzināt tad, ja vēja ātrums nepārsniedz astoņus metrus sekundē;","18.2":"18.2. strādājot seko smidzinātāja darba kvalitātei, kā arī preparāta izlietojumam.","19":"19. Lai aizsargātu bites un citus apputeksnētājus, persona, lietojot augu aizsardzības līdzekļus, ievēro marķējumā noteiktās īpašās drošības prasības, ja tajā ir:","19.1":"19.1. norāde \"Toksisks bitēm\" vai ķīmiskās vielas iedarbības raksturojums R57;","19.2":"19.2. standartfrāze Spe8;","19.3":"19.3. citas norādes par bišu un citu apputeksnētāju aizsardzību.","20":"20. Ja persona lieto augu aizsardzības līdzekli, kura marķējumā ir norāde \"Toksisks bitēm\" vai ķīmiskās vielas iedarbības raksturojums R57, tā trīs dienas pirms sējumu vai stādījumu apstrādes brīdina tos bišu saimju tiesiskos valdītājus, kuru bišu dravas (vai stropi) atrodas divu kilometru rādiusā no apstrādājamās vietas un kuru bišu saimes ir reģistrētas normatīvajos aktos par dzīvnieku, ganāmpulku un novietņu reģistrēšanu un dzīvnieku apzīmēšanu noteiktajā kārtībā.","21":"21. Lietojot augu aizsardzības līdzekļus sēklu kodināšanā, ievēro šādus drošības pasākumus:","21.1":"21.1. sēklas kodina speciāli iekārtotās telpās, nojumēs, laukumos un kodināšanai piemērotās iekārtās;","21.2":"21.2. kodināšanas darbos iesaistītās personas izmanto individuālos aizsardzības līdzekļus;","21.3":"21.3. kodināto sēklu pārpalikumus uzglabā sausā aizslēgtā noliktavā atsevišķi no pārtikas un lopbarības graudiem iepakojumā ar norādi ''KODINĀTS\", norādot arī kodnes vai darbīgās vielas nosaukumu;","21.4":"21.4. pēc sēklu kodināšanas un sējas pabeigšanas kodināšanas vietu, sēklu kodināšanas iekārtas, sējmašīnas, sēklu iepildītājus un citas iekārtas, kurām ir bijusi saskare ar kodinātām sēklām, kā arī individuālos aizsardzības līdzekļus neitralizē, ievērojot norādes attiecīgās kodnes marķējumā;","21.5":"21.5. kodinātās sēklas aizliegts lietot pārtikā, izbarot dzīvniekiem un putniem, kā arī mazgāt vai attīrīt no kodnes, lai tās realizētu pārtikas vai lopbarības vajadzībām;","21.6":"21.6. kodinātās sēklas drīkst pārvadāt tikai šo noteikumu 21.3.apakšpunktā minētajos iepakojumos vai speciālos sējmašīnu uzpildītājos, kā arī sējmašīnu tvertnēs.","21¹":"21.1 Pirmās reģistrācijas klases augu aizsardzības līdzekļus atļauts lietot tikai personām, kurām izsniegta profesionāla augu aizsardzības līdzekļu lietotāja apliecība darbībām ar pirmās reģistrācijas klases augu aizsardzības līdzekļiem.\n(MK 19.11.2014. noteikumu Nr.706 redakcijā)","22":"22. Ja pirmās reģistrācijas klases augu aizsardzības līdzekļus lieto par fumigantiem fumigācijā (objekta apstrādē ar augu aizsardzības līdzekli gāzveida stāvoklī), ievēro šādas darba drošības prasības:","22.1":"22.1. fumigāciju drīkst veikt tikai hermētiski noslēdzamā objektā, ja tas atrodas ne tuvāk par 50 metriem no dzīvojamām, administratīvajām un publiskajām ēkām un ne tuvāk par 30 metriem no plašai sabiedrībai pieejamām teritorijām (piemēram, parka, sporta laukuma, atpūtas vietas);","22.2":"22.2. vienu dienu pirms fumigācijas sākšanas par fumigāciju un tās veikšanas laiku brīdina cilvēkus, kas atrodas objektam piegulošajā teritorijā;","22.3":"22.3. pirms fumigācijas sākšanas veic objekta hermetizāciju. Objekta hermētiskumu nodrošina visa procesa laikā;","22.4":"22.4. objektu norobežo un izvieto labi saredzamus brīdinājuma uzrakstus ''BĪSTAMI DZĪVĪBAI\" un ''IEEJA AIZLIEGTA\";","22.5":"22.5. lai garantētu darba drošību, fumigāciju veic vismaz divas personas;","22.6":"22.6. nodrošina personas klātbūtni objektā no fumigācijas sākuma līdz pilnīgai fumiganta neitralizācijai un telpu izvēdināšanai pēc fumigācijas beigām (turpmāk – degazācija);","22.7":"22.7. fumigācijā iesaistītās personas nodrošina ar gāzmaskām;","22.8":"22.8. fumigācijas sagatavošanu un fumiganta palaišanu veic diennakts gaišajā laikā;","22.9":"22.9. pirms degazācijas sākšanas mēra fumiganta koncentrāciju objektā, lai konstatētu, vai fumigācijas laikā sasniegta nepieciešamā fumiganta koncentrācija;","22.10":"22.10. degazāciju veic pakāpeniski, neļaujot izplūst atmosfērā lielam fumiganta daudzumam;","22.11":"22.11. objekta degazāciju veic, līdz fumiganta koncentrācija sasniedz attiecīgā augu aizsardzības līdzekļa marķējumā paredzētos rādītājus.\n(Grozīts ar MK 19.11.2014. noteikumiem Nr.706)","23":"23. Fumigācijas un degazācijas laikā:","23.1":"23.1. mēra fumiganta koncentrāciju gaisā un nodrošina, lai augu aizsardzības līdzekļu koncentrācija nepārsniedz attiecīgā augu aizsardzības līdzekļa marķējumā norādītās pieļaujamās normas;","23.2":"23.2. reģistrācijas žurnālā papildus šo noteikumu 13. punktā minētajam norāda fumigācijas laiku, izmantotā augu aizsardzības līdzekļa nosaukumu, apstrādāto produkciju, norādot produkcijas nosaukumu un apstrādāto apjomu, temperatūru pēc Celsija, kādā veikta apstrāde, mērījumu izdarīšanas laiku un fumiganta koncentrāciju.\n(Grozīts ar MK 19.11.2014. noteikumiem Nr.706)","24":"24. Pēc degazācijas mēra fumiganta koncentrāciju visās telpās, kurās veikta fumigācija, ja šī koncentrācija norādīta augu aizsardzības līdzekļa marķējumā, un sastāda aktu par fumigācijas un degazācijas veikšanu. Aktu paraksta visas personas, kas piedalījušās fumigācijā.\n(MK 19.11.2014. noteikumu Nr.706 redakcijā)","25":"25. Ja augu aizsardzības līdzekli lieto segtās platībās, tad pēc attiecīgā līdzekļa lietošanas tās noslēdz un pie durvīm pieliek brīdinājuma zīmi ar informāciju par lietoto augu aizsardzības līdzekli, kā arī norāda laiku, kad telpā atkal drīkstēs uzturēties, un par augu aizsardzības līdzekļa lietošanu atbildīgās personas tālruņa numuru.","26":"26. Teritorijās, ko izmanto plaša sabiedrības daļa vai arī mazāk aizsargātas iedzīvotāju grupas saskaņā ar Eiropas Parlamenta un Padomes 2009.gada 21.oktobra (EK) Regulas Nr. 1107/2009 par augu aizsardzības līdzekļu laišanu tirgū, ar ko atceļ Padomes Direktīvas 79/117/EEK un 91/414/EEK, 3.pantu (piemēram, parkā, sporta laukumā, atpūtas vietā, skolu teritorijā, slimnīcu teritorijā), augu aizsardzības līdzekļus atļauts lietot tikai tad, ja citādi nav iespējams ierobežot augiem kaitīgo organismu izplatību un lietošanas instrukcijā ir atļauts šāds konkrētā augu aizsardzības līdzekļa lietojums. Augu aizsardzības līdzekli plašai sabiedrībai pieejamās teritorijās lieto pēc iespējas tādā laikā, kad tajās neuzturas cilvēki.","27":"27. Vismaz divas dienas pirms augu aizsardzības līdzekļu lietošanas šo noteikumu 26.punktā minētajās vietās atbildīgā persona vietējos novada vai pagasta laikrakstos vai savā tīmekļa vietnē ievieto paziņojumu par paredzēto augu aizsardzības līdzekļu lietošanu vai citādi publisko šo informāciju.","28":"28. Šo noteikumu 26.punktā minētajos gadījumos augu aizsardzības līdzekļa lietošanas laikā, kā arī pēc tā lietošanas apstrādāto teritoriju norobežo ar brīdinājuma zīmēm, kurās norādīta informācija par lietoto augu aizsardzības līdzekli, nogaidīšanas periodu un par to, kad atkal drīkst apmeklēt apstrādāto teritoriju.","29":"29. Dzelzceļa līnijas, autoceļu daļas un ļoti caurlaidīgas teritorijas, kā arī necaurlaidīgas teritorijas, kas ir tuvu virszemes vai pazemes ūdeņiem, ir atļauts apstrādāt ar augu aizsardzības līdzekļiem, tikai ievērojot normatīvajos aktos par aizsargjoslām minētās prasības un nodrošinot, ka augu aizsardzības līdzekļi nenokļūst virszemes ūdeņos vai noteku sistēmās.\nIV. Augu aizsardzības līdzekļu izsmidzināšana no gaisa","30":"30. Augu aizsardzības līdzekļus atļauts izsmidzināt no gaisa, ja saņemta dienesta atļauja augu aizsardzības līdzekļu izsmidzināšanai no gaisa (turpmāk – atļauja).","31":"31. Dienests, ievērojot šo noteikumu 34.punktā minētos nosacījumus, atļauju izsniedz šādos gadījumos:","31.1":"31.1. ja tas nepieciešams zinātniskām institūcijām pētījumu veikšanai lauksaimniecības nozarē;","31.2":"31.2. lauksaimnieciskajā ražošanā iesaistītajām personām ārkārtas gadījumā;","31.3":"31.3. mežu apstrādei kokiem kaitīgo organismu masveida savairošanās gadījumā.","32":"32. Lai saņemtu atļauju, ieinteresētā persona dienestā iesniedz:","32.1":"32.1. pieteikumu atļaujas saņemšanai. Pieteikumā pamatota atļaujas nepieciešamība, kā arī norādīta kaitīgā organisma identitāte, kultūrauga apdraudējuma apjoms, nozīmīgums, ekonomiskais apdraudējums, lietošanai paredzētā augu aizsardzības līdzekļa nosaukums, tā deva, apstrādājamā platība, paredzamais izsmidzināšanas laiks, kā arī pamatojums, kādēļ konkrētajā situācijā nav izmantojamas citas kaitīgā organisma apkarošanas metodes;","32.2":"32.2. karti, kurā iezīmēta apsmidzināšanai no gaisa paredzētā teritorija;","32.3":"32.3. informāciju par personu, kura veiks smidzināšanas darbus, kā arī par lietošanas iekārtām.","33":"33. Dienests, pamatojoties uz iesniegto un citu dienesta rīcībā esošo informāciju, sagatavo novērtējumu par augu aizsardzības līdzekļa iespējamo ietekmi uz vidi un cilvēku un dzīvnieku veselību un veic riska analīzi ne ilgāk kā:","33.1":"33.1. divu nedēļu laikā, ja augu aizsardzības līdzeklis nav atļauts lietošanai Latvijā;","33.2":"33.2. vienas nedēļas laikā, ja augu aizsardzības līdzeklis ir atļauts lietošanai Latvijā.","34":"34. Dienests pieņem lēmumu par atļaujas izsniegšanu, ja:","34.1":"34.1. nav citas piemērotas alternatīvas vai arī izsmidzināšanai no gaisa salīdzinājumā ar augu aizsardzības līdzekļu lietošanu uz zemes ir lielākas priekšrocības, lai mazinātu ietekmi uz cilvēku veselību un vidi;","34.2":"34.2. ir veikta riska analīze un gūts apstiprinājums tam, ka pozitīvais efekts no šāda augu aizsardzības līdzekļu lietojuma būs lielāks nekā iespējamais risks videi un cilvēku un dzīvnieku veselībai;","34.3":"34.3. operators, kas veic smidzinājumu no gaisa, ir apmācīts un ieguvis apliecību par tiesībām lietot augu aizsardzības līdzekļus;","34.4":"34.4. lietošanas iekārtas ir pārbaudītas un atbilst normatīvajos aktos par augu aizsardzības līdzekļu lietošanas iekārtām noteiktajām prasībām;","34.5":"34.5. lidaparāts ir reģistrēts normatīvajos aktos par aviāciju noteiktajā kārtībā un aprīkots ar piederumiem, kas atbilst labākai pieejamai tehnoloģijai, lai samazinātu augu aizsardzības līdzekļu nonesi ar vēju;","34.6":"34.6. apstrādājamā teritorija neatrodas dzīvojamo zonu tuvumā.\n(34.4.apakšpunktā minētās prasības attiecībā uz iekārtu pārbaudi stājas spēkā 26.11.2016., sk. 44.punktu)","35":"35. Atļaujā dienests iekļauj šādas ziņas:","35.1":"35.1. izmantošanai atļautā augu aizsardzības līdzekļa nosaukums;","35.2":"35.2. izmantošanai atļautā teritorija, norādot precīzu tās vietu un platību;","35.3":"35.3. augu aizsardzības līdzekļa lietošanas nosacījumi, ietverot riska ierobežošanas pasākumus;","35.4":"35.4. par augu aizsardzības līdzekļa lietošanu atbildīgā persona;","35.5":"35.5. plānotais augu aizsardzības līdzekļa izsmidzināšanas datums, laiks un nogaidīšanas laiks – laika intervāls no apstrādes līdz laikam, kad teritorijā drīkst atkal uzturēties un veikt saimnieciskas darbības (piemēram, ogot, sēņot).","36":"36. Persona, kas saņēmusi atļauju, pirms darbu veikšanas informē attiecīgās apkārtnes iedzīvotājus šo noteikumu 27.punktā minētajā kārtībā, kā arī veic šo noteikumu 28.punktā minētos drošības pasākumus.","37":"37. Ja tiek izsniegta atļauja izsmidzināt augu aizsardzības līdzekļus no gaisa, dienests lēmumu publicē savā tīmekļa vietnē, kā arī oficiālajā izdevumā \"Latvijas Vēstnesis\".\n(MK 19.11.2014. noteikumu Nr.706 redakcijā)","38":"38. Persona ne vēlāk kā divu dienu laikā pēc augu aizsardzības līdzekļa izsmidzināšanas no gaisa iesniedz dienestā pārskatu par smidzinājumu, norādot datumu un laiku, kad notika izsmidzināšana, izlietotā augu aizsardzības līdzekļa nosaukumu, tā daudzumu un devu, kā arī informāciju par apstrādāto teritoriju.","39":"39. Persona sedz visus izdevumus, kuri saistīti ar dienesta sagatavoto novērtējumu par augu aizsardzības līdzekļa iespējamo ietekmi uz vidi un cilvēku un dzīvnieku veselību un riska analīzi un kuri nepieciešami lēmuma pieņemšanai par atļaujas izsniegšanu augu aizsardzības līdzekļu izsmidzināšanai no gaisa, saskaņā ar normatīvajiem aktiem par dienesta sniegto maksas pakalpojumu cenrādi.\nV. Augu aizsardzības līdzekļu lietošanas kontrole","40":"40. Kontrolējot augu aizsardzības līdzekļu lietošanu, dienests augu aizsardzības līdzekļu darbīgo vielu klātbūtnes konstatēšanai var ņemt paraugus no augu aizsardzības līdzekļiem, augsnes, augiem, augu produktiem, sagatavotiem augu aizsardzības līdzekļu darba šķidrumiem un citiem priekšmetiem, kas varētu būt nonākuši saskarē ar augu aizsardzības līdzekļiem. Paraugus analizē laboratorijā, kas akreditēta nacionālajā akreditācijas institūcijā atbilstoši normatīvajiem aktiem par atbilstības novērtēšanas institūciju novērtēšanu, akreditāciju un uzraudzību, vai citā Eiropas Savienības dalībvalsts vai Eiropas Ekonomikas zonas valsts akreditācijas institūcijā akreditētā laboratorijā, vai laboratorijā, kurai pesticīdu noteikšanas jomā ir ieviesta kvalitātes sistēma \"Laba laboratorijas prakse\".\n(MK 13.06.2017. noteikumu Nr. 330 redakcijā)","41":"41. Paraugus ņem reprezentatīvā (pietiekamā) daudzumā izlases kārtībā. Augu aizsardzības līdzekļa paraugu dienests ņem saskaņā ar normatīvajos aktos par augu aizsardzības līdzekļu laišanu tirgū noteikto kārtību.","41¹":"41.1 Ja dienests šo noteikumu 40. punktā minētos paraugus ņem, pamatojoties uz personas lūgumu, ārpus dienesta īstenotās kontroles, ar parauga ņemšanu un novērtējuma sagatavošanu saistītos izdevumus sedz persona saskaņā ar normatīvajiem aktiem par dienesta sniegto maksas pakalpojumu cenrādi.\n(MK 19.11.2014. noteikumu Nr.706 redakcijā; punkts stājas spēkā 01.02.2015., sk 46.punktu)\nVI. Noslēguma jautājumi","42":"42. Atzīt par spēku zaudējušiem Ministru kabineta 2004.gada 29.aprīļa noteikumus Nr.463 \"Augu aizsardzības līdzekļu izplatīšanas, glabāšanas un lietošanas noteikumi\" (Latvijas Vēstnesis, 2004, 69.nr.; 2009, 70., 166.nr.; 2010, 174.nr.).","43":"43. Līdz 2013.gada 31.maijam vai apliecības derīguma termiņa beigām (līdz ilgākajam no minētajiem termiņiem) pirmās un otrās reģistrācijas klases augu aizsardzības līdzekļus atļauts lietot un iegādāties personām, kas saņēmušas apliecību par augu aizsardzības zināšanu minimuma apgūšanu saskaņā ar Ministru kabineta 2004.gada 29.aprīļa noteikumos Nr.463 \"Augu aizsardzības līdzekļu izplatīšanas, glabāšanas un lietošanas noteikumi\" minētajām prasībām.\n(MK 26.02.2013. noteikumu Nr.104 redakcijā)","44":"44. Šo noteikumu 14.2. un 34.4.apakšpunktā minētās prasības attiecībā uz iekārtu pārbaudi stājas spēkā 2016.gada 26.novembrī.","45":"45. Šo noteikumu 34.5.apakšpunkta prasības attiecībā uz lidaparātu aprīkojumu stājas spēkā 2013.gada 1.janvārī.","46":"46. Šo noteikumu 41.1 punkts stājas spēkā 2015. gada 1. februārī.\n(MK 19.11.2014. noteikumu Nr.706 redakcijā)\nInformatīva atsauce uz Eiropas Savienības direktīvu\nNoteikumos iekļautas tiesību normas, kas izriet no Eiropas Parlamenta un Padomes 2009.gada 21.oktobra Direktīvas 2009/128/EK, ar kuru nosaka Kopienas sistēmu pesticīdu ilgtspējīgas lietošanas nodrošināšanai."}}}</script>

function rootSVG(type,labels=true){
 const h=(s)=>s;
 const seed='root'+type.replace(/[^a-z]/g,'');
 const stem=(x,y=81)=>`<path d="M${x} ${y} V34" stroke="#437e45" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${x} 55 Q${x-24} 32 ${x-50} 41 Q${x-31} 60 ${x} 55" fill="#78b76d"/><path d="M${x} 46 Q${x+26} 25 ${x+47} 37 Q${x+28} 54 ${x} 46" fill="#639b57"/>`;
 const earth=`<rect x="0" y="82" width="360" height="148" fill="#eee5cc"/><path d="M0 82H360" stroke="#b2a077" stroke-width="2"/><path d="M0 125H360M0 175H360" stroke="#d9cbaa" stroke-width="1" stroke-dasharray="5 9"/>`;
 let shoots='',roots='';
 if(type==='taproot'){
  shoots=stem(180);roots=`<path d="M180 83 Q192 130 178 175 Q176 192 180 217 Q163 201 168 177 Q163 130 180 83Z" fill="#a87b4f"/><path d="M175 120 Q134 128 113 157M183 142 Q225 152 241 178M176 166 Q143 177 123 195M183 176 Q212 184 220 206" stroke="#a87b4f" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 } else if(type==='fibrous'){
  shoots=stem(180);roots=Array.from({length:23},(_,i)=>{let dx=(i-11)*7, endX=180+dx*2.1, endY=127+Math.round((i*29)%90);return `<path d="M180 84 Q${180+dx*.4} ${108+endY*.15} ${endX} ${endY}" stroke="#a77d51" stroke-width="${i%3===0?2.5:1.7}" fill="none" stroke-linecap="round"/>`}).join('');
 }else if(type==='rhizome'){
  shoots=stem(95)+stem(260);roots=`<path d="M48 157 C115 142 155 172 205 157 S285 150 318 165" stroke="#97754e" stroke-width="13" fill="none" stroke-linecap="round"/>`;
  [95,170,260].forEach(x=>{roots+=`<circle cx="${x}" cy="157" r="7" fill="#be925c"/><path d="M${x} 159 Q${x-14} 192 ${x-25} 219M${x} 160 Q${x+10} 195 ${x+24} 214" stroke="#9a7954" stroke-width="3" fill="none"/>`;});
  roots+=`<path d="M95 153 L95 84M260 151 L260 84" stroke="#528e55" stroke-width="7" fill="none"/>`;
 }else if(type==='sucker'){
  shoots=stem(85)+stem(265);roots=`<path d="M180 86 Q184 137 179 208M41 174 Q125 151 177 171 Q242 151 315 177" stroke="#997049" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M85 166 Q91 124 85 83M265 166 Q257 131 265 83" stroke="#997049" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  [84,175,265].forEach(x=>roots+=`<path d="M${x} 170 Q${x-20} 195 ${x-35} 220" stroke="#9d805d" stroke-width="2" fill="none"/>`);
 }else if(type==='runner'){
  shoots=stem(85)+stem(270);roots=`<path d="M85 77 Q155 69 216 77 T270 77" stroke="#498f51" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M85 83 Q72 117 53 137M85 83 Q99 133 121 153M270 83 Q247 122 230 154M270 83 Q282 116 303 138" stroke="#aa8257" stroke-width="3.5" fill="none"/>`;
 }else if(type==='horsetail'){
  shoots=[95,177,268].map(x=>`<path d="M${x} 82V18" stroke="#407d46" stroke-width="4"/><path d="M${x} 51l-18 -19M${x} 44l19 -18M${x} 64l-21 -8M${x} 57l21 -9" fill="none" stroke="#508e55" stroke-width="2.5"/>`).join('');
  roots=`<path d="M45 125 C95 107 119 142 179 128 S266 117 316 131M35 183 C98 169 137 199 191 183 S264 171 321 197" stroke="#9a734c" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  [95,177,268].forEach(x=>roots+=`<path d="M${x} 126 V83M${x} 128 Q${x-24} 149 ${x-30} 181" fill="none" stroke="#aa8352" stroke-width="4"/>`);
 }
 const graphic=`<svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Botāniska sakņu un dzinumu uzbūves shēma" preserveAspectRatio="xMidYMid meet"><rect width="360" height="230" fill="#f1f8ef"/>${earth}${roots}${shoots}</svg>`;
 return graphic;
}

function atlasRows(){let term=atlasFilter.toLocaleLowerCase('lv-LV'),match=s=>!term||(s.name+' '+s.latin).toLocaleLowerCase('lv-LV').includes(term);

function atlasCard(s){let g=ATLAS.groups[s.group],r=ATLAS.roots[s.root];

return `<div class="atlas-card"><div class="atlas-main">${pic(s.images[0],0,'')}${s.images.length>1?`<span class="atlas-count">${s.images.length} foto</span>`:''}</div>${s.images.length>1?`<div class="atlas-thumbs">${s.images.map((k,i)=>pic(k,i,i===0?'on':'')).join('')}</div>`:''}<b>${esc(s.name)}</b><i>${esc(s.latin)}</i><small>${esc(g.life==='Barošanās veids'?g.name:`${g.life} · ${g.name}`)} · ${esc(s.cls)}</small>${r?`<small class="atlas-root">🌱 ${esc(r.name)}</small>`:''}${s.rootNote?`<small>${esc(s.rootNote)}</small>`:''}</div>`}
let lightbox=null;
function drawZoom(){let el=document.getElementById('zoom');if(!lightbox){el?.remove();return}

let n=lightbox.list.length;
el.innerHTML=`<button class="zoom-x" data-action="zoomClose" aria-label="Aizvērt">✕</button>${n>1?`<button class="zoom-nav prev" data-action="zoomStep" data-step="-1" aria-label="Iepriekšējā bilde">‹</button><button class="zoom-nav next" data-action="zoomStep" data-step="1" aria-label="Nākamā bilde">›</button>`:''}<figure><img src="${lightbox.list[lightbox.i]}" alt="Palielināts attēls"/>${lightbox.caption||n>1?`<figcaption>${lightbox.caption}${n>1?` · ${lightbox.i+1}/${n}`:''}</figcaption>`:''}</figure>`}
function openZoom(e){let s=e.dataset.sp&&ATLAS.species.find(x=>x.id===e.dataset.sp);
if(s){let r=ATLAS.roots[s.root];lightbox={list:s.images.map(k=>DATA.images[k]),i:+e.dataset.i||0,caption:`<b>${esc(s.name)}</b> <i>${esc(s.latin)}</i>${r?` · 🌱 ${esc(r.name)}`:''}`}}
else lightbox={list:[e.dataset.src],i:0,caption:''};
drawZoom()}
function stepZoom(d){if(!lightbox)return;let n=lightbox.list.length;lightbox.i=(lightbox.i+d+n)%n;drawZoom()}
function pickTeacher(){let used=new Set(),take=(f,n)=>shuffled(Q.filter(q=>f(q)&&!used.has(q.id))).slice(0,n).map(q=>(used.add(q.id),q.id));

function renderHome(){let best=history.length?Math.max(...history.filter(x=>x.mode==='exam').map(x=>x.percentage),0):null;let total=studied(),wrong=Object.keys(mistakes).length,exams=history.filter(x=>x.mode==='exam').length;return `${topTitle('Mans mācību centrs','Visa nepieciešamā VAAD 2. reģistrācijas klases AAL teorijas sagatavošanās — vienā vietā.')}

function sessionQuestion(){if(!session)return renderHome();if(!BYID[session.ids[session.idx]]){session=null;save();return renderHome();}let q=BYID[session.ids[session.idx]],ex=session.mode==='exam',pos=session.idx+1,sel=session.answers[q.id],locked=!ex&&sel!==undefined,answered=Object.keys(session.answers).length,order=session.order[q.id];let src=SOURCES[q.source]||{url:'#',type:'Mācību materiāls',title:'Mācību materiāls'};let photo=q.image?`<img class="question-photo" data-action="zoom" data-src="${DATA.images[q.image]}" title="Spied, lai palielinātu" alt="Nezāles atpazīšanas uzdevums — nosaki sugu" src="${DATA.images[q.image]}"/>`:(q.diagram?`<div class="quiz-diagram">${rootSVG(q.diagram,false)}</div>`:'');

return `${topTitle(ex?'Eksāmena simulācija':'Mācību režīms',ex?'Atbildes tiks novērtētas tikai pēc testa pabeigšanas.':'Pēc atbildes saņemsi tūlītēju skaidrojumu.',btn('exitSession','✕ Aizvērt','btn-outline'))}

<div class="toolbar"><input id="bankSearch" class="search" type="search" placeholder="Meklēt jautājumos, atbildēs, tēmās..." value="${esc(bankSearch)}"/><select class="form-select" id="bankFilter">${opts}</select><span class="small-muted" id="bankCount">${qs.length} rezultāti</span></div><div id="bankResults">${bankRows(qs)}</div>`}
function filteredBank(){let term=bankSearch.toLocaleLowerCase('lv-LV');return Q.filter(q=>(bankFilter==='Visas tēmas'||q.topic===bankFilter)&&(!term||[q.q,q.topic,q.opts.join(' '),q.why].join(' ').toLocaleLowerCase('lv-LV').includes(term)))}
function bankRows(qs){return qs.length?`<div class="bank-list">${qs.slice(0,600).map(q=>`<div class="panel bank-item"><span class="num">${q.id.replace(/\D/g,'')}</span>${q.image?`<img class="mini-img" src="${DATA.images[q.image]}" alt="Attēla jautājums"/>`:q.diagram?`<span class="mini-diagram">🌱</span>`:''}<div class="body"><h4>${esc(q.q)}</h4><p>${esc(q.topic)} · ${esc((SOURCES[q.source]||{url:'#',type:'Mācību materiāls'}).type)}</p></div>${btn('openQuestion','Atvērt ↗','btn-outline',`data-id="${q.id}"`)}</div>`).join('')}</div>`:'<div class="empty-state"><span class="emoji">🔍</span><h3>Jautājumi nav atrasti</h3><p>Izmēģini citu meklēšanas frāzi vai tēmu.</p></div>'}
function renderGallery(){let term=photoFilter.toLocaleLowerCase('lv-LV'),imgs=WEEDS.filter(w=>!term||w.name.toLocaleLowerCase('lv-LV').includes(term));return `${topTitle('Nezāļu atpazīšana','38 attēli tieši no taviem mācību materiāliem. Vispirms apskati augus, pēc tam trenējies bez nosaukumiem.',btn('photos','Trenēties ar attēliem →','btn-primary'))}<div class="toolbar"><input id="gallerySearch" type="search" class="search" placeholder="Meklēt nezāli..." value="${esc(photoFilter)}"/><span class="small-muted">${imgs.length} attēli</span></div><div id="galleryList">${galleryRows(imgs)}</div>`}
function galleryRows(imgs){return `<div class="gallery">${imgs.map(w=>`<div class="panel gallery-card"><img src="${DATA.images[String(w.id)]}" loading="lazy" alt="${esc(w.name)}"/><p>${esc(w.name)}<small>${esc(w.detail.split(',').slice(1).join(',').trim())}</small></p></div>`).join('')}</div>`}
function renderMistakes(book=false){let ids=Object.keys(book?bookmarks:mistakes).filter(id=>BYID[id]),qs=ids.map(id=>BYID[id]);return `${topTitle(book?'Saglabātie jautājumi':'Manas kļūdas',book?'Jautājumi, kurus atzīmēji ar zvaigznīti.':'Šeit nonāk nepareizi atbildētie jautājumi. Pareiza atkārtota atbilde tos no šī saraksta noņem.',qs.length?btn(book?'bookmarksQuiz':'mistakesQuiz',`Sākt treniņu (${qs.length}) →`,'btn-primary'):'')}${qs.length?`<div class="bank-list">${qs.map(q=>`<div class="panel bank-item">${q.image?`<img class="mini-img" src="${DATA.images[q.image]}" alt="Attēla jautājums"/>`:q.diagram?`<span class="mini-diagram">🌱</span>`:''}<div class="body"><h4>${esc(q.q)}</h4><p>${esc(q.topic)}</p></div>${btn('openQuestion','Atvērt','btn-outline',`data-id="${q.id}"`)}</div>`).join('')}</div>`:`<div class="empty-state"><span class="emoji">${book?'☆':'✓'}</span><h3>${book?'Nav saglabātu jautājumu':'Šobrīd nav kļūdu!'}</h3><p>${book?'Jautājuma skatā nospied “Saglabāt”, lai tas parādītos šeit.':'Atbildi uz jautājumiem, un nepareizās atbildes automātiski parādīsies šeit.'}</p>${btn('topics','Izvēlēties tēmu →','btn-outline')}</div>`}`}
const extraSources=[['LATVĀŅI.pptx','https://drive.google.com/file/d/1uP6xDLyjFqRjMofAHCWkb4kn66eptc4R/view'],['Nezales_buklets_2_2017.pdf','https://drive.google.com/file/d/10KdAj75P7-ivpLwWolmJuQHbeTKsObl9/view'],['Nezales_buklets_2016.pdf (attēlu materiāls)','https://drive.google.com/file/d/10aPkcIe14lXM0uBC-XmNtmu0IaYI7KNT/view'],['nezāles.pptx','https://drive.google.com/file/d/1SRNaUPE0M67RZvTTP0NXVXZv-iT9Wuw8/view']];
function renderSources(){let cards=Object.entries(SOURCES).filter(([k])=>k!=='PLUS').map(([k,s])=>`<div class="panel source-card"><div><strong style="font-size:13px">${esc(s.title)}</strong><p>${esc(s.type)} · ${Q.filter(q=>q.source===k).length} jautājumi ar šo primāro avotu</p></div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Atvērt ↗</a></div>`).join('');return `${topTitle('Materiāli un avoti','Trenažieris veidots no 12 taviem Drive failiem, papildinot tēmas ar VAAD publisko programmu.')}
<div class="notice"><span>⚖️</span><div><strong>Materiālu un eksāmena pārklājums nav vienāds.</strong> Tavos materiālos visvairāk informācijas ir par nezālēm, AAL veidiem, augseku un latvāņiem. Tēmas par slimībām, kaitēkļiem, drošību, iekārtām un aprēķiniem papildinātas ar vispārīgiem treniņjautājumiem. Oficiālās eksāmena jautājumu bankas nav.</div></div>
<div class="section-head"><h3>Galvenie jautājumu avoti</h3></div>${cards}<div class="section-head"><h3>Pārējie analizētie materiāli</h3></div>${extraSources.map(([name,url])=>`<div class="panel source-card"><div><strong style="font-size:13px">${esc(name)}</strong><p>Papildu mācību materiāls</p></div><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Atvērt ↗</a></div>`).join('')}<div class="section-head"><h3>Noderīgas oficiālās vietnes</h3></div><div class="panel source-card"><div><strong>VAAD — Mācības un apliecības</strong><p>Oficiālie nosacījumi un aktuālā informācija</p></div><a href="https://www.vaad.gov.lv/lv/macibas-un-apliecibas" target="_blank" rel="noopener noreferrer">Atvērt ↗</a></div><div class="panel source-card"><div><strong>VAAD — AAL reģistrs</strong><p>Pārbaudi konkrēto produktu aktuālo lietojumu un marķējumu</p></div><a href="https://registri.vaad.gov.lv/reg/aal_saraksts.aspx" target="_blank" rel="noopener noreferrer">Atvērt ↗</a></div>`}
function render(){const element=document.getElementById('content');let content={home:renderHome,topics:renderTopics,examsetup:renderSetup,session:sessionQuestion,results:renderResult,progress:renderProgress,bank:renderBank,gallery:renderGallery,roots:renderRoots,atlas:renderAtlas,ask:renderAsk,mistakes:()=>renderMistakes(false),bookmarks:()=>renderMistakes(true),sources:renderSources}[view];element.innerHTML=content?content():renderHome();document.getElementById('crumb').textContent=({'home':'Mans mācību centrs','session':'Jautājumu režīms','examsetup':'Eksāmena simulācija','results':'Rezultāts'}[view]||NAV.find(x=>x[0]===view)?.[2]||'Mans mācību centrs');document.getElementById('nav').innerHTML=NAV.map(([id,ico,name])=>`<button data-action="${id}" class="${view===id?'active':''}"><span class="nav-icon">${ico}</span>${name}${id==='mistakes'&&Object.keys(mistakes).length?` <span style="margin-left:auto;background:#e7f0e3;border-radius:6px;padding:3px 6px;font-size:10px">${Object.keys(mistakes).length}</span>`:''}</button>`).join('');document.getElementById('sidebarprogress').style.width=`${pct(studied(),Q.length)}%`;document.getElementById('sideprogresstext').textContent=`Apgūti ${studied()} no ${Q.length} jautājumiem`;if(view==='session'&&session?.mode==='exam')updateClock();}
function go(v){view=v;menuOpen=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'})}
function pickExam(n,withImages){let available=Q.filter(q=>withImages||(!q.image&&!q.diagram)),groups=Object.groupBy?Object.groupBy(available,q=>q.topic):available.reduce((acc,q)=>(acc[q.topic]??=[],acc[q.topic].push(q),acc),{});let ids=[];for(let t of TOPICS.map(x=>x[0])){if(groups[t]?.length){ids.push(shuffled(groups[t])[0].id)}}let extras=shuffled(available.filter(q=>!ids.includes(q.id))).map(q=>q.id);return shuffled([...ids,...extras].slice(0,n))}
function start(ids,mode='study',minutes=0,label=''){if(session&&!confirm('Aizvietot pašreiz iesākto treniņu ar jaunu?'))return;ids=ids.filter(id=>BYID[id]);if(!ids.length){alert('Šobrīd nav jautājumu šim treniņam.');return}let order={};for(let id of ids)order[id]=shuffled([0,1,2,3]);session={ids:ids.slice(),mode,idx:0,answers:{},order,startedAt:Date.now(),durationSec:minutes*60,label};save();go('session')}
function answer(n){if(!session)return;let q=BYID[session.ids[session.idx]];if(session.mode!=='exam'&&session.answers[q.id]!==undefined)return;session.answers[q.id]=n;if(session.mode==='study'){const s=stats[q.id]||{tried:0,correct:0,wrong:0};s.tried++;s.last=Date.now();if(n===0){s.correct++;delete mistakes[q.id]}else{s.wrong++;mistakes[q.id]=true}stats[q.id]=s}save();render()}
function finish(force=false){if(!session)return;let ex=session.mode==='exam',missing=session.ids.filter(id=>session.answers[id]===undefined).length;if(ex&&!force&&!confirm(`Iesniegt eksāmenu? ${missing?`Neatbildēti jautājumi: ${missing}. `:''}Pēc iesniegšanas vairs nevarēsi mainīt atbildes.`))return;let correct=session.ids.reduce((n,id)=>n+(session.answers[id]===0?1:0),0);if(ex){for(let id of session.ids){let a=session.answers[id],s=stats[id]||{tried:0,correct:0,wrong:0};if(a!==undefined){s.tried++;s.last=Date.now();if(a===0){s.correct++;delete mistakes[id]}else{s.wrong++;mistakes[id]=true}}else{mistakes[id]=true}stats[id]=s}}let r={ids:[...session.ids],answers:{...session.answers},correct,count:session.ids.length,percentage:pct(correct,session.ids.length),when:Date.now(),mode:session.mode,label:session.label};lastResult=r;history.push({correct,count:r.count,percentage:r.percentage,when:r.when,mode:r.mode});if(history.length>200)history=history.slice(-200);session=null;save();go('results')}
function exportProgress(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({version:1,stats,mistakes,bookmarks,history,session,lastResult},null,2));a.download='AAL_trenazieris_progress.json';document.body.appendChild(a);a.click();a.remove()}
async function importProgress(f){try{let data=JSON.parse(await f.text());if(!data||typeof data!=='object'||!data.stats)throw Error('Nav pareizais progresa fails');if(!confirm('Aizvietot pašreizējo progresu ar importēto?'))return;stats=data.stats||{};mistakes=data.mistakes||{};bookmarks=data.bookmarks||{};history=data.history||[];session=data.session||null;lastResult=data.lastResult||null;save();go('progress')}catch(err){alert('Importēšanas kļūda: '+err.message)}}
function handleAction(a,e){if(askAction(a,e))return;if(NAV.some(n=>n[0]===a)){go(a);return}if(a==='menu'){menuOpen=!menuOpen;document.getElementById('sidebar').classList.toggle('open',menuOpen);document.getElementById('overlay').classList.toggle('open',menuOpen)}else if(a==='closeMenu'){menuOpen=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open')}else if(a==='topic'){let t=e.dataset.topic;if(session&&session.mode==='study'&&session.label===t){go('session')}else if(topicSessions[t]&&topicSessions[t].ids.every(id=>BYID[id])){if(session&&session.mode==='study'&&session.label)topicSessions[session.label]=session;session=topicSessions[t];save();go('session')}else{start(shuffled(Q.filter(q=>q.topic===t)).map(q=>q.id),'study',0,t)}}else if(a==='zoom'){openZoom(e)}
else if(a==='zoomClose'){lightbox=null;drawZoom()}
else if(a==='zoomStep'){stepZoom(+e.dataset.step)}
else if(a==='atlasMode'){atlasMode=e.dataset.mode;render()}
else if(a==='teacherExam'){start(pickTeacher(),'exam',25,'Skolotājas formāta tests')}
else if(a==='rootsQuiz'){start(shuffled(Q.filter(q=>q.topic==='Sakņu sistēmas')).map(q=>q.id),'study',0,'Sakņu sistēmas')}else if(a==='rootsDiagrams'){start(shuffled(Q.filter(q=>q.diagram)).map(q=>q.id),'study',0,'Sakņu shēmas')}else if(a==='photos'){start(shuffled(Q.filter(q=>!!q.image)).map(q=>q.id),'study',0,'Attēli')}else if(a==='startExam'){settings.count=+document.getElementById('exam-count').value;settings.minutes=+document.getElementById('exam-minutes').value;settings.images=document.getElementById('exam-photos').checked;start(pickExam(settings.count,settings.images),'exam',settings.minutes,'Eksāmens')}else if(a==='answer'){answer(+e.dataset.option)}else if(a==='next'){if(session&&session.idx<session.ids.length-1){session.idx++;save();render();window.scrollTo(0,0)}}else if(a==='prev'){if(session&&session.idx>0){session.idx--;save();render();window.scrollTo(0,0)}}else if(a==='goto'){if(session){session.idx=+e.dataset.index;save();render();window.scrollTo(0,0)}}else if(a==='finish'){finish()}else if(a==='exitSession'){go('home')}else if(a==='resume'){if(session)go('session')}else if(a==='bookmark'){if(!session)return;let id=session.ids[session.idx];if(bookmarks[id])delete bookmarks[id];else bookmarks[id]=true;save();render()}else if(a==='mistakesQuiz'||a==='bookmarksQuiz'){start(shuffled(Object.keys(a==='mistakesQuiz'?mistakes:bookmarks)),'study',0,'Atkārtošana')}else if(a==='openQuestion'){start([e.dataset.id],'study',0,'Atsevišķs jautājums')}else if(a==='export'){exportProgress()}else if(a==='import'){document.getElementById('importInput').click()}else if(a==='reset'){if(confirm('Neatgriezeniski dzēst visu šajā pārlūkā saglabāto trenažiera progresu?')){stats={};mistakes={};bookmarks={};history=[];session=null;lastResult=null;save();go('progress')}}}
document.addEventListener('click',e=>{if(e.target.id==='zoom'){lightbox=null;drawZoom();return}let el=e.target.closest('[data-action]');if(el)handleAction(el.dataset.action,el)});
document.addEventListener('input',e=>{if(e.target.id==='atlasSearch'){atlasFilter=e.target.value;document.getElementById('atlasList').innerHTML=atlasRows()}if(e.target.id==='bankSearch'){bankSearch=e.target.value;let qs=filteredBank();document.getElementById('bankResults').innerHTML=bankRows(qs);document.getElementById('bankCount').textContent=qs.length+' rezultāti'}if(e.target.id==='gallerySearch'){photoFilter=e.target.value;document.getElementById('galleryList').innerHTML=galleryRows(WEEDS.filter(w=>w.name.toLocaleLowerCase('lv-LV').includes(photoFilter.toLocaleLowerCase('lv-LV'))))}});
document.addEventListener('change',e=>{if(e.target.id==='bankFilter'){bankFilter=e.target.value;let qs=filteredBank();document.getElementById('bankResults').innerHTML=bankRows(qs);document.getElementById('bankCount').textContent=qs.length+' rezultāti'}if(e.target.id==='importInput'&&e.target.files?.[0])importProgress(e.target.files[0])});
document.addEventListener('keydown',e=>{if(lightbox){if(e.key==='Escape'){lightbox=null;drawZoom()}else if(e.key==='ArrowRight')stepZoom(1);else if(e.key==='ArrowLeft')stepZoom(-1);return}if(!session||view!=='session'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(['1','2','3','4'].includes(e.key)&&!e.ctrlKey){let q=BYID[session.ids[session.idx]],n=session.order[q.id][+e.key-1];answer(n)}if(e.key==='ArrowRight'&&session.idx<session.ids.length-1){if(session.mode==='exam'||session.answers[session.ids[session.idx]]!==undefined){session.idx++;save();render()}}if(e.key==='ArrowLeft'&&session.idx>0){session.idx--;save();render()}});
function updateClock(){if(!session||session.mode!=='exam'||view!=='session')return;let remain=session.durationSec-Math.floor((Date.now()-session.startedAt)/1000);if(remain<=0){finish(true);return}let m=Math.floor(remain/60),s=remain%60;let el=document.getElementById('clock');if(el)el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('timerBox')?.classList.toggle('danger',remain<=300)}
setInterval(updateClock,1000);
render();
</script>
</body>
</html>
