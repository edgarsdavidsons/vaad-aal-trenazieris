 dominējošas mietsaknes","Viens resns galvenais sakņu stumbrs","Tikai sakņu pumpuri dziļi augsnē","Virszemes stīgas bez saknēm"],"why":"Bārkšsakņu sistēmā ir daudz līdzīgu sakņu; tā raksturīga daudzām viendīgļlapju sugām.","source":"ROOT"},{"id":"R010","topic":"Sakņu sistēmas","q":"Kuram no šiem augiem raksturīga stiebrzālēm tipiska bārkšsakņu sistēma?","opts":["Parastā gaiļsāre","Ārstniecības pienene","Tīruma usne","Parastā māllēpe"],"why":"Gaiļsāre ir stiebrzāle, un tās sakņu sistēma ir bārkšsakņu tipa.","source":"ROOT"},{"id":"R011","topic":"Sakņu sistēmas","q":"Kas ir stīga nezāļu veģetatīvās vairošanās kontekstā?","opts":["Virszemes ložņājošs dzinums, kas mezglos var iesakņoties","Dziļa galvenā sakne","Sēkla ar lidpūkām","Pazemes saknes apvalks"],"why":"Stīga ir virszemes dzinums, kas var iesakņoties mezglos un veidot jaunus augus.","source":"ROOT"},{"id":"R012","topic":"Sakņu sistēmas","q":"Kurš no augiem var izplatīties ar ložņājošiem virszemes dzinumiem?","opts":["Ložņu gundega","Ganu plikstiņš","Vējauza","Parastā rudzupuķe"],"why":"Ložņu gundega var veidot ložņājošus, mezglos sakņojošos dzinumus.","source":"ROOT"},{"id":"R013","topic":"Sakņu sistēmas","q":"Kāpēc sakneņu nezālēm nepietiek tikai ar virszemes daļas nopļaušanu?","opts":["Pazemes sakneņos saglabājas rezerves un pumpuri ataugšanai","Sakneņiem nav dzīvotspējīgu pumpuru","Pļaušana vienmēr iznīcina sakneņus","Nezāles pēc pļaušanas uzreiz izzūd no augsnes"],"why":"Virszemes daļas noņemšana neatņem saknenim visas rezerves un dzīvotspējīgos pumpurus.","source":"ROOT"},{"id":"R014","topic":"Sakņu sistēmas","q":"Kāpēc ar vienreizēju seklu augsnes apstrādi ne vienmēr ierobežo ložņu vārpatu?","opts":["Sakneņu fragmenti var saglabāt dzīvotspēju un atjaunot dzinumus","Vārpata vairojas tikai ar sporām","Sakneņi vienmēr atrodas virs augsnes","Sakneņi neveido pumpurus"],"why":"Mehāniska sadrumstalošana bez turpmākas ierobežošanas dažkārt pat veicina sakneņu izplatīšanos.","source":"ROOT"},{"id":"R015","topic":"Sakņu sistēmas","q":"Kā sakņu sistēmas zināšana palīdz izvēlēties nezāļu ierobežošanas metodi?","opts":["Ļauj saprast, cik viegli augs atjaunojas no pazemes orgāniem","Nosaka tikai auga zieda krāsu","Aizstāj marķējuma lasīšanu","Vienmēr nozīmē herbicīda lietošanu"],"why":"Veģetatīvās atjaunošanās spēja nosaka, vai nepieciešama atkārtota mehāniska vai cita pamatota ierobežošana.","source":"ROOT"},{"id":"R016","topic":"Sakņu sistēmas","q":"Ko nozīmē “veģetatīvā vairošanās”?","opts":["Jauna auga attīstība no auga daļām, nevis sēklas","Vairošanās tikai pēc apputeksnēšanās","Sēklu izplatīšanās ar vēju","Vienīgi sporu veidošana"],"why":"Sakneņi, sakņu dzinumi, stīgas un citi orgāni var radīt jaunus augus bez sēklām.","source":"ROOT"},{"id":"R017","topic":"Sakņu sistēmas","q":"Kas izceļ daudzgadīgas nezāles no vairuma īsmūža nezāļu?","opts":["Spēja vairākus gadus saglabāt dzīvus orgānus un atkārtoti veidot dzinumus","Vienmēr tikai viena ziedēšana","Tās nevar vairoties veģetatīvi","Tām nav sakņu sistēmas"],"why":"Daudzgadīgajām nezālēm pazemes vai citi pārziemojoši orgāni ļauj atjaunoties vairākos gados.","source":"ROOT"},{"id":"R018","topic":"Sakņu sistēmas","q":"Kura augu grupa parasti vairojas galvenokārt ar sēklām un pabeidz ciklu vienā sezonā?","opts":["Vasaras īsmūža nezāles","Dziļsakņu daudzgadīgās nezāles","Sakneņu daudzgadīgās nezāles","Sakņu dzinumu daudzgadīgās nezāles"],"why":"Vasaras īsmūža nezāles, piemēram, baltā balanda, parasti attīstību pabeidz vienā sezonā.","source":"ROOT"},{"id":"R019","topic":"Sakņu sistēmas","q":"Kas raksturo ziemotspējīgas īsmūža nezāles?","opts":["Rudenī sadīgušie augi spēj pārziemot un turpināt attīstību nākamajā sezonā","Visas dzīvo vismaz desmit gadus","Vairojas tikai ar sakneņiem","Neveido sēklas"],"why":"Piemēri PDF klasifikācijā: ganu plikstiņš un rudzupuķe.","source":"ROOT"},{"id":"R020","topic":"Sakņu sistēmas","q":"Kāds ir nozīmīgs profilaktisks pasākums pret daudzgadīgām nezālēm?","opts":["Lauku apsekošana un savlaicīga atjaunošanās perēkļu ierobežošana","Atstāt izplatīties līdz sēklu nogatavošanai","Nelietot augseku","Vienmēr pļaut tikai vienu reizi gadā"],"why":"Savlaicīga atpazīšana, regulāra novērošana un pamatota ierobežošanas stratēģija samazina izplatību.","source":"ROOT"},{"id":"R021","topic":"Sakņu sistēmas","q":"Kāpēc tīruma kosa jāvērtē atšķirīgi no sēklaugu nezālēm?","opts":["Tā ir sporaugs ar pazemes sakneņu sistēmu","Tai nav pazemes orgānu","Tā vairojas vienīgi ar sēklām","Tai nav veģetatīvās vairošanās"],"why":"Tīruma kosa vairojas ar sporām un veģetatīvi ar sakneņiem; tai nav sēklu.","source":"ROOT"},{"id":"R022","topic":"Sakņu sistēmas","q":"Kā sakneņu sistēma palīdz nezālei pārziemot?","opts":["Pazemes orgānos saglabājas pumpuri un rezerves barības vielas","Sakneņi ziemā kļūst par sēklām","Visi pumpuri atrodas tikai uz lapām","Saknenis neveido rezerves"],"why":"Sakneņi ir izturīgi pazemes orgāni ar pumpuriem un rezervēm, no kuriem atjaunojas dzinumi.","source":"ROOT"},{"id":"R023","topic":"Sakņu sistēmas","q":"Ko nozīmē “sakņu sistēma aramkārtā”?","opts":["Liela daļa nozīmīgās sakņu sistēmas atrodas augsnes apstrādājamajā slānī","Saknes aug tikai uz augsnes virsmas","Augs dzīvo tikai vienu dienu","Saknes nevar aizsniegt ūdeni"],"why":"PDF daudzgadīgās divdīgļlapju nezāles daļēji klasificē pēc sakņu izvietojuma augsnes aramkārtā.","source":"ROOT"},{"id":"R024","topic":"Sakņu sistēmas","q":"Kāpēc dziļsakņu nezāles mēdz būt noturīgas pret seklu mehānisku apstrādi?","opts":["Daļa atjaunošanās orgānu atrodas zem apstrādes dziļuma","Visas saknes tiek iznīcinātas 1 cm dziļumā","Tās neveido sānsaknes","Tām nevar būt pazemes pumpuri"],"why":"Sekla apstrāde ne vienmēr sasniedz dziļākās saknes un pumpurus.","source":"ROOT"},{"id":"R025","topic":"Sakņu sistēmas","q":"Kurš pāris ir pareizi sasaistīts ar tipisko veģetatīvās atjaunošanās orgānu?","opts":["Ložņu vārpata — sakneņi","Balanda — sakņu dzinumi","Ganu plikstiņš — stīgas","Vējauza — sakneņi"],"why":"Ložņu vārpata ir viens no klasiskajiem pazemes sakneņu nezāļu piemēriem.","source":"ROOT"},{"id":"R026","topic":"Sakņu sistēmas","q":"Kurš pāris ir pareizi sasaistīts ar sakņu dzinumu grupu?","opts":["Tīruma usne — sakņu dzinumi","Tīruma gaurs — sakneņi","Baltā balanda — stīgas","Ganu plikstiņš — pazemes bumbuļi"],"why":"Usnei jaunie dzinumi var attīstīties no pumpuriem uz saknēm.","source":"ROOT"},{"id":"R027","topic":"Sakņu sistēmas","q":"Ar ko sakņu dzinums atšķiras no sakneņa?","opts":["Sakņu dzinums veidojas no saknes pumpura, saknenis ir pārveidots stumbrs","Abi vienmēr ir sēklas","Sakneņiem nav mezglu","Sakņu dzinumi ir tikai virszemē esoši ziedi"],"why":"Šī atšķirība ir centrāla: saknenis = stumbrs, sakņu dzinums = saknes veidots virszemes dzinums.","source":"ROOT"},{"id":"R028","topic":"Sakņu sistēmas","q":"Kuras no šīm ir daudzgadīgas nezāles ar izteiktu pazemes atjaunošanos?","opts":["Ložņu vārpata un tīruma usne","Baltā balanda un ganu plikstiņš","Tīruma gaurs un vējauza","Rudzupuķe un balanda"],"why":"Gan ložņu vārpata, gan tīruma usne daudzgadīgi atjaunojas no pazemes orgāniem, bet ar dažādiem mehānismiem.","source":"ROOT"},{"id":"R029","topic":"Sakņu sistēmas","q":"Kuram no nosauktajiem augiem ir raksturīga sakņu sistēma, kas ļauj atjaunoties pēc galotnes nogriešanas?","opts":["Ārstniecības pienene","Viengadīgā balanda","Vējauza","Tīruma gaurs"],"why":"Pienene var atjaunoties no saglabātas mietsaknes augšējās daļas un pumpuriem.","source":"ROOT"},{"id":"R030","topic":"Sakņu sistēmas","q":"Kādu ieguvumu dod nezāļu sakņu sistēmu atšķiršana uz lauka?","opts":["Piemērotāku profilakses, augsnes apstrādes un ierobežošanas paņēmienu izvēli","Var pilnībā ignorēt kultūrauga attīstību","Nav vajadzīga nezāļu sugu noteikšana","Vienmēr var palielināt AAL devu"],"why":"Nezāļu sakņu uzbūve un atjaunošanās veids nosaka tās ierobežošanas praktiskos apsvērumus.","source":"ROOT"},{"id":"R031","topic":"Sakņu sistēmas","q":"Atpazīsti shēmu: kāds orgāns ir ilustrēts?","opts":["Mietsakņu sistēma","Pazemes saknenis","Sakņu dzinumu sistēma","Stīga"],"why":"Shēmā redzama viena izteikta vertikāla galvenā sakne ar sānsaknēm, kā ārstniecības pienenei.","source":"ROOT","diagram":"taproot"},{"id":"R032","topic":"Sakņu sistēmas","q":"Atpazīsti shēmu: kāds orgāns ir ilustrēts?","opts":["Bārkšsakņu sistēma","Mietsakne","Virszemes stīga","Sakņu dzinums"],"why":"Shēmā redzamas vairākas līdzīgas smalkas saknes bez vienas dominējošas galvenās saknes.","source":"ROOT","diagram":"fibrous"},{"id":"R033","topic":"Sakņu sistēmas","q":"Atpazīsti shēmu: kas nodrošina veģetatīvu vairošanos?","opts":["Pazemes saknenis","Mietsakne","Sēklu pogaļa","Virszemes stīga"],"why":"Pazemes horizontālais stumbrs ar pumpuriem un virszemes dzinumiem ir saknenis.","source":"ROOT","diagram":"rhizome"},{"id":"R034","topic":"Sakņu sistēmas","q":"Atpazīsti shēmu: kā veidojas jaunie dzinumi?","opts":["No pumpuriem uz dziļām saknēm","No sēklām stīgas galā","No virszemes galotnes mezgliem","No sporu vālītes"],"why":"Šeit no dziļās sakņu sistēmas veidojas virszemes dzinumi — raksturīgi sakņu dzinumu nezālēm.","source":"ROOT","diagram":"sucker"},{"id":"R035","topic":"Sakņu sistēmas","q":"Atpazīsti shēmu: kāds vairošanās orgāns redzams?","opts":["Virszemes stīga","Saknenis zem augsnes","Viena mietsakne","Sakņu dzinumu tīkls"],"why":"Dzinums stiepjas virs augsnes un sakņojas mezglos; tas ir virszemes stīga.","source":"ROOT","diagram":"runner"},{"id":"R036","topic":"Sakņu sistēmas","q":"Atpazīsti shēmu: kam raksturīga šāda pazemes orgānu sistēma?","opts":["Tīruma kosai","Baltajai balandai","Ganu plikstiņam","Vējauzai"],"why":"Tīruma kosa ir sporaugs ar sazarotiem pazemes sakneņiem, no kuriem var atjaunoties dzinumi.","source":"ROOT","diagram":"horsetail"},{"id":"EXT001","topic":"Sakņu sistēmas","q":"Kas ir saknenis?","opts":["Pazemes stumbrs","Sēkla","Saknes gals","Zieds"],"why":"Saknenis ir pārveidots stumbrs ar pumpuriem, no kura iespējama veģetatīva ataugšana.","source":"NE"},{"id":"EXT002","topic":"Sakņu sistēmas","q":"Kura nezāle izplatās ar sakneņiem?","opts":["Ložņu vārpata","Baltā balanda","Ganu plikstiņš","Tīruma naudulis"],"why":"Ložņu vārpata ir daudzgadīga sakneņu nezāle.","source":"NE"},{"id":"EXT003","topic":"Sakņu sistēmas","q":"Kura nezāle veido sakņu dzinumus?","opts":["Tīruma usne","Vējauza","Balanda","Parastā virza"],"why":"Tīruma usnei no saknēm var veidoties jauni dzinumi.","source":"NE"},{"id":"EXT004","topic":"Sakņu sistēmas","q":"Kas raksturīgs ārstniecības pienenei?","opts":["Dziļa mietsakne","Īsi sakneņi","Nav sakņu","Tikai gaisa saknes"],"why":"Pienenei ir izteikta mietsakne, kas uzkrāj rezerves.","source":"NE"},{"id":"EXT005","topic":"Sakņu sistēmas","q":"Kāpēc daudzgadīgas nezāles ataug pēc nopļaušanas?","opts":["Saglabājas pazemes rezerves un pumpuri","Sēklas uzreiz sadīgst","Tām nevajag gaismu","Lapas pārvēršas saknēs"],"why":"Ataugšanai augi izmanto saknēs vai sakneņos uzkrātās rezerves.","source":"NE"},{"id":"EXT006","topic":"Sakņu sistēmas","q":"Kāpēc viena pļaušana bieži nav pietiekama?","opts":["Pazemes orgāni paliek dzīvi","Viss augs uzreiz iet bojā","Pļaušana iznīcina sēklas","Saknes uzreiz izžūst"],"why":"Vairākas ataugšanas ierobežošanas reizes var izsmelt rezerves.","source":"NE"},{"id":"EXT007","topic":"Sakņu sistēmas","q":"Kura pazīme raksturo sakneni?","opts":["Tam ir mezgli un pumpuri","Tā ir tikai uzsūcējsakne","Tam ir vainaglapas","Tas veido tikai sēklas"],"why":"Saknenis ir stumbrs, tāpēc tam raksturīgas stumbra pazīmes.","source":"NE"},{"id":"EXT008","topic":"Sakņu sistēmas","q":"Kas ir veģetatīvā vairošanās?","opts":["Jauna auga veidošanās no auga daļām","Tikai sēklu dīgšana","Tikai apputeksnēšanās","Vienīgi ziedēšana"],"why":"Nezāles var vairoties ar sakneņu vai sakņu fragmentiem.","source":"NE"},{"id":"EXT009","topic":"Sakņu sistēmas","q":"Kura nezāle pieder daudzgadīgajām sakneņu nezālēm?","opts":["Tīruma kosa","Tīruma naudulis","Ganu plikstiņš","Baltā balanda"],"why":"Tīruma kosai ir dziļa, sazarota pazemes sakneņu sistēma.","source":"NE"},{"id":"EXT010","topic":"Sakņu sistēmas","q":"Kas var notikt, sadrumstalojot dzīvotspējīgus sakneņus?","opts":["Fragmenti var dot jaunus dzinumus","Tie vienmēr iet bojā","Tie pārvēršas sēklās","Tie pārstāj uzkrāt rezerves"],"why":"Neatbilstoša augsnes apstrāde var veicināt sakneņu fragmentu izplatīšanos.","source":"NE"},{"id":"EXT011","topic":"Sakņu sistēmas","q":"Kura ir daudzgadīga sakņu dzinumu nezāle?","opts":["Tīruma tītenis","Ganu plikstiņš","Balanda","Vējauza"],"why":"Tīruma tītenis ataug arī no dziļas sakņu sistēmas.","source":"NE"},{"id":"EXT012","topic":"Sakņu sistēmas","q":"Kāpēc dziļsakņu nezāles grūti iznīcināt mehāniski?","opts":["Dziļi palikušie orgāni var ataugt","Tām nav rezerves vielu","Tās nekad nezied","Tām ir tikai sēklas"],"why":"Sakņu fragmenti vai saglabātie orgāni var dot atkārtotu ataugšanu.","source":"NE"},{"id":"EXT013","topic":"Nezāļu klasifikācija","q":"Kura nezāle ir īsmūža divdīgļlapis?","opts":["Baltā balanda","Ložņu vārpata","Tīruma kosa","Tīruma usne"],"why":"Baltā balanda vairojas galvenokārt ar sēklām.","source":"NE"},{"id":"EXT015","topic":"Nezāļu klasifikācija","q":"Ko nozīmē ziemotspējīga īsmūža nezāle?","opts":["Rudenī sadīgusi var pārziemot","Tā dzīvo tikai ziemā","Tā vienmēr ir daudzgadīga","Tā vairojas tikai ar sakneņiem"],"why":"Rudenī sadīgušie augi pārziemo un attīstību beidz nākamajā gadā.","source":"NE"},{"id":"EXT016","topic":"Nezāļu klasifikācija","q":"Kura ir ziemotspējīga īsmūža nezāle?","opts":["Ganu plikstiņš","Ložņu vārpata","Tīruma kosa","Tīruma usne"],"why":"Ganu plikstiņš var sadīgt rudenī un pārziemot.","source":"NE"},{"id":"EXT017","topic":"Nezāļu klasifikācija","q":"Kas galvenokārt raksturīgs īsmūža nezālēm?","opts":["Vairošanās ar sēklām","Tikai sakņu dzinumi","Tikai sakneņi","Vienmēr mietsakne līdz 2 m"],"why":"Īsmūža nezāļu izplatīšanos nosaka sēklu banka.","source":"NE"},{"id":"EXT018","topic":"Nezāļu klasifikācija","q":"Kas raksturīgs divgadīgām nezālēm?","opts":["Attīstības cikls ilgst divus veģetācijas periodus","Dzīvo divas dienas","Tikai ziemā dīgst","Nav ziedu"],"why":"Divgadīgas nezāles parasti veģetatīvi attīstās pirmajā, bet zied otrajā gadā.","source":"NE"},{"id":"EXT019","topic":"Nezāļu klasifikācija","q":"Kā atšķiras viendīgļlapji un divdīgļlapji?","opts":["Dīgļlapu skaits un citas uzbūves pazīmes","Tikai ziedu krāsa","Tikai augstums","Tikai sakņu dziļums"],"why":"Graudzāles parasti ir viendīgļlapji, bet, piemēram, balanda — divdīgļlapis.","source":"NE"},{"id":"EXT020","topic":"Nezāļu klasifikācija","q":"Kura nezāle ir daudzgadīga?","opts":["Parastā vībotne","Tīruma naudulis","Ganu plikstiņš","Vējauza"],"why":"Parastā vībotne ir daudzgadīga nezāle.","source":"NE"},{"id":"EXT021","topic":"Nezāļu klasifikācija","q":"Kas ir nezāļu sēklu banka?","opts":["Augsnē uzkrājušās dzīvotspējīgās sēklas","Sēklu noliktava","Visas auga saknes","Graudu kaltēšanas paņēmiens"],"why":"Sēklu banka var saglabāties gadiem un izraisīt atkārtotu nezāļu sadīgšanu.","source":"NE"},{"id":"EXT022","topic":"Nezāļu klasifikācija","q":"Kāds ir nezāļu klasifikācijas praktiskais mērķis?","opts":["Izvēlēties atbilstošu ierobežošanu","Noteikt tikai ziedu krāsu","Prognozēt tikai nokrišņus","Aprēķināt graudu mitrumu"],"why":"Bioloģija un vairošanās veids nosaka piemērotākās ierobežošanas metodes.","source":"NE"},{"id":"EXT023","topic":"Nezāļu ierobežošana","q":"Kāds ir mērdēšanas pamatprincips?","opts":["Atkārtoti izsmeļ pazemes rezerves","Vienreiz appļauj sēklas","Nezāles papildus mēslo","Aizliedz kultūraugu maiņu"],"why":"Atkārtota ataugšanas iznīcināšana iztērē rezerves vielas.","source":"NE"},{"id":"EXT024","topic":"Nezāļu ierobežošana","q":"Kas ir provokācijas metode?","opts":["Veicināt sadīgšanu un iznīcināt dīgstus","Atstāt sēklas nogatavoties","Palielināt sēklu izsēju","Apturēt augsnes apstrādi uz visiem laikiem"],"why":"Sekla apstrāde var rosināt sēklu dīgšanu; pēc tam dīgstus iznīcina.","source":"NE"},{"id":"EXT025","topic":"Nezāļu ierobežošana","q":"Kad ieteicams appļaut nezāles ceļmalās?","opts":["Pirms sēklu nogatavošanās","Tikai pēc sēklu izbiršanas","Tikai decembrī","Pēc kultūrauga sējas neatkarīgi no attīstības"],"why":"Savlaicīga appļaušana mazina sēklu izplatīšanos.","source":"NE"},{"id":"EXT026","topic":"Nezāļu ierobežošana","q":"Kas ir smacēšanas princips?","opts":["Kavēt nezāļu attīstību un ataugšanu","Palielināt mēslojuma normu","Atstāt augsni neapstrādātu vienmēr","Veicināt ziedēšanu"],"why":"Konkurence, noēnojums vai atkārtota apstrāde var nomākt nezāles.","source":"NE"},{"id":"EXT027","topic":"Nezāļu ierobežošana","q":"Kāpēc svarīga augu maiņa?","opts":["Tā pārtrauc atsevišķu nezāļu izplatībai labvēlīgus apstākļus","Tā aizstāj jebkādu uzraudzību","Tā likvidē visas sēklas vienā gadā","Tā palielina vienas nezāles priekšrocību"],"why":"Dažādi kultūraugi un paņēmieni mazina vienveidīgu nezāļu selekciju.","source":"NE"},{"id":"EXT028","topic":"Nezāļu ierobežošana","q":"Kas ir integrētā nezāļu ierobežošana?","opts":["Vairāku profilaktisku un tiešu metožu apvienošana","Tikai viena herbicīda lietošana","Tikai pļaušana","Nezāļu ignorēšana"],"why":"Iekļauj profilaksi, monitoringu, augu maiņu un atbilstošas metodes.","source":"NE"},{"id":"EXT029","topic":"Nezāļu ierobežošana","q":"Kā mazināt herbicīdu rezistences risku?","opts":["Mainīt iedarbības mehānismus un kombinēt metodes","Vienmēr lietot to pašu darbīgo vielu","Palielināt devu virs marķējuma","Izmantot tikai vienu paņēmienu"],"why":"Vienas iedarbības grupas atkārtota izmantošana veicina rezistences atlasi.","source":"NE"},{"id":"EXT030","topic":"Nezāļu ierobežošana","q":"Ko pirms AAL lietošanas obligāti pārbauda?","opts":["Marķējumu un atļautos lietošanas nosacījumus","Tikai pudeles krāsu","Tikai cenu","Tikai vēja virzienu"],"why":"AAL jālieto atbilstoši marķējuma prasībām.","source":"NE"},{"id":"EXT031","topic":"Nezāļu ierobežošana","q":"Kāpēc svarīgs apstrādes laiks?","opts":["Efektivitāte atkarīga no nezāles attīstības stadijas","Kalendāra diena vienmēr ir vienīgais faktors","Nezālēm nav attīstības stadiju","Visi herbicīdi darbojas vienādi"],"why":"Jaunas nezāles bieži ir uzņēmīgākas; jāievēro konkrētā līdzekļa marķējums.","source":"NE"},{"id":"EXT032","topic":"Nezāļu ierobežošana","q":"Kas ir profilaktisks pasākums pret nezālēm?","opts":["Tīras sēklas izmantošana","Piesārņotas tehnikas pārvietošana","Sēklu izkaisīšana","Nezāļu ziedēšanas veicināšana"],"why":"Tīras sēklas un tehnikas higiēna kavē nezāļu ievazāšanu.","source":"NE"},{"id":"EXT033","topic":"Sakņu sistēmas","q":"Kura nezāle ir īpaši pazīstama ar sakneņu izplatību aramkārtā?","opts":["Ložņu vārpata","Baltā balanda","Ganu plikstiņš","Tīruma zvēre"],"why":"Ložņu vārpatas sakneņi bieži izvietoti apstrādājamajā slānī.","source":"NE"},{"id":"EXT034","topic":"Sakņu sistēmas","q":"Kurai nezālei ir ļoti dziļa pazemes orgānu sistēma?","opts":["Tīruma kosa","Balanda","Vējauza","Parastā virza"],"why":"Tīruma kosas sakneņi var iesniegties dziļāk par parasto aramkārtu.","source":"NE"},{"id":"EXT035","topic":"Sakņu sistēmas","q":"Kāpēc augsnes apstrādes dziļums jāizvēlas pārdomāti?","opts":["Tas ietekmē sakneņu fragmentēšanu un izcelšanu","Tas neietekmē nezāles","Tas ietekmē tikai sēklu krāsu","Sakņu sistēmu nav iespējams skart"],"why":"Nepiemērota fragmentēšana var veicināt ataugšanu.","source":"NE"},{"id":"EXT036","topic":"Sakņu sistēmas","q":"Kāda ir atšķirība starp sakņu dzinumu un sakneni?","opts":["Pirmais veidojas no saknes, otrais ir stumbrs","Abi vienmēr ir ziedi","Abi ir sēklas","Atšķirības nav"],"why":"Sakņu dzinumi veidojas no sakņu pumpuriem, saknenis pats ir pārveidots stumbrs.","source":"NE"},{"id":"EXT037","topic":"Nezāļu klasifikācija","q":"Kas palīdz noteikt nezāles ierobežošanas stratēģiju?","opts":["Vairošanās veids un attīstības cikls","Tikai lapu krāsa","Tikai lauka atrašanās vieta","Tikai sēklas diametrs"],"why":"Viengadīgu un daudzgadīgu nezāļu apkarošanā prioritātes atšķiras.","source":"NE"},{"id":"EXT038","topic":"Nezāļu klasifikācija","q":"Kura nezāle pieder krustziežu dzimtai?","opts":["Ganu plikstiņš","Ložņu vārpata","Vējauza","Tīruma kosa"],"why":"Ganu plikstiņš ir krustziežu dzimtas īsmūža nezāle.","source":"NE"},{"id":"EXT039","topic":"Nezāļu ierobežošana","q":"Kāpēc nedrīkst paļauties tikai uz herbicīdiem?","opts":["Palielinās rezistences risks un samazinās stratēģiju daudzveidība","Herbicīdi nespēj ietekmēt nevienu nezāli","Visi herbicīdi ir vienādi","Augu maiņa nav vajadzīga"],"why":"Integrētā pieejā apvieno profilaktiskās, agrotehniskās un atļautās ķīmiskās metodes.","source":"NE"},{"id":"EXT040","topic":"Nezāļu ierobežošana","q":"Kas ir pareiza rīcība pēc nezāļu ierobežošanas?","opts":["Novērot rezultātu un dokumentēt nepieciešamo informāciju","Nekad nepārbaudīt lauku","Visu turpmāko sezonu ignorēt nezāles","Vienmēr atkārtot to pašu apstrādi"],"why":"Rezultāta novērtējums palīdz nākamajai lēmumu pieņemšanai.","source":"NE"},{"id":"EXT041","topic":"Augu augšana","q":"Kuri pieci faktori ir būtiski augu augšanai?","opts":["Siltums, gaisma, ūdens, gaiss un barības vielas","Tikai siltums un ūdens","Tikai mēslojums un saule","Tikai skābeklis"],"why":"Augšanas faktori cits citu pilnībā neaizstāj.","source":"LAW"},{"id":"EXT042","topic":"Augu augšana","q":"Kāds process pārvērš gaismas enerģiju ķīmiskajā enerģijā?","opts":["Fotosintēze","Transpirācija","Dīgšana","Mineralizācija"],"why":"Fotosintēzē augi izmanto gaismu, ogļskābo gāzi un ūdeni.","source":"LAW"},{"id":"EXT043","topic":"Augu augšana","q":"Kāda gāze fotosintēzē tiek uzņemta?","opts":["Oglekļa dioksīds","Skābeklis","Slāpeklis tieši no gaisa visos augos","Ozons"],"why":"Fotosintēzē augi piesaista CO₂.","source":"LAW"},{"id":"EXT044","topic":"Augu augšana","q":"Kāda gāze izdalās fotosintēzē?","opts":["Skābeklis","Oglekļa monoksīds","Metāns","Ozons"],"why":"Fotosintēzes gaitā izdalās O₂.","source":"LAW"},{"id":"EXT046","topic":"Augu augšana","q":"Kura auga daļa uzņem lielāko daļu ūdens un minerālvielu?","opts":["Sakņu sistēma","Ziedlapiņas","Augļi","Putekšņlapas"],"why":"Saknes nodrošina ūdens un elementu uzņemšanu.","source":"LAW"},{"id":"EXT047","topic":"Augu augšana","q":"Kuri ir galvenie NPK elementi?","opts":["Slāpeklis, fosfors un kālijs","Nātrijs, platīns un kalcijs","Niķelis, fosfors un krīts","Slāpeklis, proteīni un kālijs"],"why":"NPK apzīmē galvenos augu makroelementus.","source":"LAW"},{"id":"EXT048","topic":"Augu augšana","q":"Kurš no šiem ir mikroelementa piemērs?","opts":["Bors","Slāpeklis","Fosfors","Kālijs"],"why":"Bors, cinks, varš un mangāns ir mikroelementi.","source":"LAW"},{"id":"EXT049","topic":"Augu augšana","q":"Kurš no šiem ir makroelements?","opts":["Magnijs","Bors","Cinks","Varš"],"why":"Magnijs augiem nepieciešams lielākā daudzumā nekā mikroelementi.","source":"LAW"},{"id":"EXT050","topic":"Augu augšana","q":"Kas notiek, ja trūkst viena būtiska augšanas faktora?","opts":["Tas var ierobežot augšanu, pat ja pārējie ir pietiekami","Pārējie vienmēr to pilnībā aizstāj","Vienmēr palielinās raža","Augs kļūst nejutīgs pret slimībām"],"why":"Augšanas faktoru neaizstājamība ir viens no zemkopības pamatprincipiem.","source":"LAW"},{"id":"EXT051","topic":"Augu augšana","q":"Kāpēc pārāk biezs sējums var būt nelabvēlīgs?","opts":["Palielinās konkurence par gaismu, ūdeni un barības vielām","Pazūd visas nezāles","Augiem vairs nevajag ūdeni","Augsne automātiski kļūst auglīgāka"],"why":"Optimāla sējumu biezība mazina savstarpējo konkurenci.","source":"LAW"},{"id":"EXT052","topic":"Augu augšana","q":"Kura augsne pavasarī parasti iesilst straujāk?","opts":["Tumšāka, trūdvielām bagātāka augsne līdzīgos apstākļos","Vienmēr mitrākā augsne","Vienmēr gaišākā augsne","Vienmēr sablīvētākā augsne"],"why":"Materiālā uzsvērta tumšu, trūdvielām bagātu augšņu iesilšana.","source":"LAW"},{"id":"EXT056","topic":"Augseka","q":"Kāpēc nevajadzētu ilgstoši bezmaiņā audzēt vienu kultūru?","opts":["Var uzkrāties specifiski kaitīgie organismi un pasliktināties augsnes stāvoklis","Tas vienmēr garantē lielāko ražu","Tas novērš visas nezāles","Tas iznīcina slimību ierosinātājus"],"why":"Kultūraugu maiņa samazina vairākus audzēšanas riskus.","source":"AUG"},{"id":"EXT057","topic":"Augseka","q":"Kāds ir viens augsekas ieguvums?","opts":["Nezāļu un slimību ierobežošana","Visu kaitēkļu tūlītēja izzušana","Nepieciešamības pēc augsnes novērojumiem izzušana","Ražas garantēšana jebkuros laikapstākļos"],"why":"Augseka diversificē agrotehniku un pārtrauc noteiktus kaitīgo organismu ciklus.","source":"AUG"},{"id":"EXT058","topic":"Augseka","q":"Kāpēc pēc dziļsakņu kultūrauga var izvēlēties seklāk sakņojošos augu?","opts":["Atšķirīgi izmanto augsnes slāņus","Tādējādi vienmēr var iztikt bez mēslošanas","Seklās saknes neuzņem barības vielas","Abi kultūraugi kļūst vienas sugas"],"why":"Materiālā iesaka ievērot atšķirīgu sakņu sistēmu izmantojumu.","source":"AUG"},{"id":"EXT059","topic":"Augseka","q":"Ko var dot tauriņziežu iekļaušana augsekā?","opts":["Bioloģiski saistīta slāpekļa pienesumu","Automātisku visu kaitēkļu iznīcināšanu","Fosfora radīšanu no nekā","Pilnīgu sausuma novēršanu"],"why":"Tauriņziežu simbioze ar gumiņbaktērijām palīdz piesaistīt slāpekli.","source":"AUG"},{"id":"EXT060","topic":"Augseka","q":"Kas jāņem vērā, izvēloties secīgus kultūraugus?","opts":["Kopīgās slimības un kaitēkļi","Tikai sēklu iepakojuma krāsa","Tikai stublāju garums","Tikai nosaukuma pirmais burts"],"why":"Vienas dzimtas kultūraugiem var būt kopīgi kaitīgie organismi.","source":"AUG"},{"id":"EXT061","topic":"Augseka","q":"Kā augseka var ietekmēt augsnes eroziju?","opts":["Augu sega un atliekas var mazināt eroziju","Augseka vienmēr pilnībā likvidē eroziju","Tai nav nekādas ietekmes","Tikai herbicīdi nosaka eroziju"],"why":"Augu sega aizsargā augsnes virsmu.","source":"AUG"},{"id":"EXT062","topic":"Augseka","q":"Kāpēc jāplāno laiks starp priekšauga novākšanu un pēcauga sēju?","opts":["Jāpagūst sagatavot augsni un sējumu","Tas nav būtiski","Lai sēklas sadīgtu noliktavā","Lai vienmēr sētu ziemā"],"why":"Sējas laiks ir viens no augsekas plānošanas ierobežojumiem.","source":"AUG"},{"id":"EXT063","topic":"Augseka","q":"Kas var palielināt organisko vielu daudzumu augsnē?","opts":["Daudzgadīgie zālaugi un augu atliekas","Visu atlieku sistemātiska izvešana bez aizstāšanas","Vienīgi augsnes blietēšana","Tikai dziļāka aršana"],"why":"Augu atliekas un sakņu masa papildina organisko vielu apriti.","source":"AUG"},{"id":"EXT064","topic":"Augseka","q":"Kāpēc dažādu kultūraugu iekļaušana palīdz nezāļu ierobežošanai?","opts":["Mainās sējas, apstrādes un konkurences apstākļi","Nezāles nespēj augt nevienā augsekā","Kultūraugi vairs nekonkurē ar nezālēm","Visi herbicīdi kļūst nevajadzīgi"],"why":"Augu maiņa traucē vienām nezālēm pastāvīgi labvēlīgus apstākļus.","source":"AUG"},{"id":"EXT065","topic":"AAL klasifikācija","q":"Kas ir herbicīdi?","opts":["Līdzekļi nezāļu ierobežošanai","Līdzekļi tikai grauzējiem","Augu mēslojuma veids","Līdzekļi tikai sēnēm"],"why":"Herbicīdi paredzēti nevēlamo augu ierobežošanai.","source":"KL"},{"id":"EXT066","topic":"AAL klasifikācija","q":"Kas ir fungicīdi?","opts":["Līdzekļi sēņu izraisītu augu slimību ierobežošanai","Līdzekļi grauzējiem","Līdzekļi tikai nezālēm","Mēslošanas šķīdumi"],"why":"Fungicīdus izmanto sēņu slimību kontrolei atbilstoši reģistrācijai.","source":"KL"},{"id":"EXT067","topic":"AAL klasifikācija","q":"Kas ir insekticīdi?","opts":["Līdzekļi kukaiņu ierobežošanai","Līdzekļi tikai sēnēm","Līdzekļi augsnes kaļķošanai","Līdzekļi tikai nezālēm"],"why":"Insekticīdi paredzēti kaitēkļu kukaiņu kontrolei.","source":"KL"},{"id":"EXT068","topic":"AAL klasifikācija","q":"Kas ir akaricīdi?","opts":["Līdzekļi ērču ierobežošanai","Līdzekļi gliemežiem","Līdzekļi graudzālēm","Līdzekļi tikai pelēm"],"why":"Akaricīdi vērsti pret ērcēm.","source":"KL"},{"id":"EXT069","topic":"AAL klasifikācija","q":"Kas ir limacīdi?","opts":["Līdzekļi kailgliemežu un gliemežu ierobežošanai","Līdzekļi putniem","Līdzekļi sēklas dīgšanas stimulēšanai","Līdzekļi tikai vīrusiem"],"why":"Limacīdi paredzēti gliemju kaitēkļu ierobežošanai.","source":"KL"},{"id":"EXT070","topic":"AAL klasifikācija","q":"Kas ir rodenticīdi?","opts":["Līdzekļi grauzēju ierobežošanai","Līdzekļi miltrasai","Līdzekļi nezālēm","Līdzekļi tikai ērcēm"],"why":"Rodenticīdi paredzēti grauzēju kontrolei.","source":"KL"},{"id":"EXT071","topic":"AAL klasifikācija","q":"Kas ir kodnes?","opts":["Preparāti sēklu vai stādāmā materiāla apstrādei","Tikai augļu mazgāšanai","Tikai augsnes laistīšanai","Tikai ražas žāvēšanai"],"why":"Kodnes izmanto sēklas vai stādāmā materiāla aizsardzībai.","source":"KL"},{"id":"EXT072","topic":"AAL klasifikācija","q":"Kas raksturīgs kontakta iedarbības AAL?","opts":["Darbojas tiešās saskares vietās","Vienmēr izplatās pa visu augu","Nedarbojas uz kaitīgajiem organismiem","Ir tikai mēslojums"],"why":"Kontakta iedarbība ir saistīta ar tiešu preparāta saskari.","source":"KL"},{"id":"EXT073","topic":"AAL klasifikācija","q":"Kas raksturīgs sistēmas iedarbības līdzeklim?","opts":["Viela pārvietojas augā","Viela nekad neiekļūst augā","Tas vienmēr ir nekaitīgs apputeksnētājiem","Tas darbojas tikai uz sēklas virsmas"],"why":"Sistēmiskām darbīgajām vielām raksturīga uzņemšana un pārvietošanās augā.","source":"KL"},{"id":"EXT074","topic":"AAL klasifikācija","q":"Ko nozīmē selektīvs herbicīds?","opts":["Tas noteiktos lietošanas apstākļos iedarbojas uz noteiktām augu grupām","Tas iznīcina pilnīgi visus augus vienmēr","Tas paredzēts tikai kukaiņiem","Tas vienmēr ir bioloģisks"],"why":"Selektivitāti nosaka kultūraugs, nezāle, deva un lietošanas nosacījumi.","source":"KL"},{"id":"EXT075","topic":"AAL klasifikācija","q":"Kas jāievēro, lietojot augsnes herbicīdu?","opts":["Marķējums un piemēroti augsnes un laika apstākļi","Tikai iepakojuma krāsa","Vienmēr ļoti sausa augsne","Vienmēr maksimālais vējš"],"why":"Augsnes mitrums un apstākļi var būtiski ietekmēt iedarbību.","source":"KL"},{"id":"EXT076","topic":"AAL klasifikācija","q":"Kas ir preparatīvā forma?","opts":["Veids, kādā AAL izgatavots lietošanai","Herbicīda pārdošanas cena","Lauka platība","Auga dzimta"],"why":"AAL var būt suspensijas, emulsijas koncentrāti, granulas un citas formas.","source":"KL"},{"id":"EXT078","topic":"AAL klasifikācija","q":"Kur jāpārbauda konkrēta AAL atļautais lietojums?","opts":["VAAD reģistrā un aktuālajā marķējumā","Tikai sociālo tīklu komentāros","Tikai uz lauka robežas","Tikai pēc preparāta krāsas"],"why":"Reģistrācija un marķējums nosaka atļautos lietojumus.","source":"KL"},{"id":"EXT079","topic":"AAL klasifikācija","q":"Kāpēc jāpārbauda AAL attīstības stadijas ierobežojumi?","opts":["Efektivitāte un kultūrauga drošums atkarīgs no stadijas","Jo attīstības stadija nekad nav svarīga","Lai noteiktu iepakojuma izmēru","Lai aizvietotu darba aizsardzību"],"why":"Marķējumā var būt konkrētas kultūrauga un kaitīgā organisma stadijas.","source":"KL"},{"id":"EXT081","topic":"Herbicīdu rezistence","q":"Kas ir HRAC?","opts":["Herbicīdu rezistences rīcības komiteja","Augsnes skābuma mērītājs","Graudu tīrīšanas metode","Sēklu sertifikāts"],"why":"HRAC izmanto herbicīdu iedarbības mehānismu grupēšanai.","source":"KL"},{"id":"EXT082","topic":"Herbicīdu rezistence","q":"Kāpēc nedrīkst paļauties uz viena mehānisma herbicīdiem katru gadu?","opts":["Veidojas selekcijas spiediens uz rezistentiem augiem","Tas vienmēr uzlabo daudzveidību","Tas iznīcina rezistences gēnus","Tas maina kultūrauga sugu"],"why":"Atkārtošana veicina rezistentu biotipu dominēšanu.","source":"KL"},{"id":"EXT083","topic":"Herbicīdu rezistence","q":"Kas palīdz novērst rezistenci?","opts":["Iedarbības mehānismu maiņa un neķīmisko metožu apvienošana","Vienas darbīgās vielas atkārtošana","Devas pārsniegšana","Nezāļu sēklu izplatīšana"],"why":"Daudzveidīgas metodes samazina atlases spiedienu.","source":"KL"},{"id":"EXT084","topic":"Herbicīdu rezistence","q":"Vai neefektīva apstrāde vienmēr nozīmē rezistenci?","opts":["Nē, jāizvērtē arī deva, stadija, laiks un tehnika","Jā, vienmēr","Rezistence nekad neeksistē","To nosaka tikai augsnes krāsa"],"why":"Efektivitāti ietekmē daudzi apstākļi.","source":"KL"},{"id":"EXT085","topic":"Herbicīdu rezistence","q":"Kā augu maiņa palīdz rezistences ierobežošanā?","opts":["Dod iespēju izmantot atšķirīgas ierobežošanas metodes","Garantē pilnīgu nezāļu izzušanu","Vienmēr ļauj lietot vienu herbicīdu","Atceļ nepieciešamību uzraudzīt lauku"],"why":"Augseka palīdz mainīt ierobežošanas stratēģijas.","source":"KL"},{"id":"EXT086","topic":"Herbicīdu rezistence","q":"Kāpēc jāzina lauka apstrāžu vēsture?","opts":["Var novērtēt atkārtoti izmantotās iedarbības grupas","Tikai īpašuma cenas noteikšanai","Tikai izsējas normai","Tai nav nozīmes"],"why":"Apstrāžu vēsture palīdz plānot rezistences profilaksi.","source":"KL"},{"id":"EXT087","topic":"Herbicīdu rezistence","q":"Kas vēl var samazināt herbicīda efektivitāti?","opts":["Nepiemēroti laikapstākļi","Augu nosaukums latīņu valodā","Lauka īpašnieka vecums","Traktora krāsa"],"why":"Temperatūra, nokrišņi un vējš var ietekmēt kvalitāti un iedarbību.","source":"KL"},{"id":"EXT088","topic":"Herbicīdu rezistence","q":"Kāpēc svarīgi izmantot kvalitatīvu smidzināšanas tehniku?","opts":["Jānodrošina vienmērīga un precīza apstrāde","Tas novērš visas nezāles bez AAL","Tas aizstāj marķējumu","Tas pilnībā izslēdz rezistenci"],"why":"Nevienmērīgs pārklājums var veicināt nepietiekamu iedarbību.","source":"KL"},{"id":"EXT089","topic":"Herbicīdu rezistence","q":"Kāpēc svarīgs nezāļu monitorings pēc apstrādes?","opts":["Var savlaicīgi pamanīt aizdomīgus izdzīvojušus augus","Lai vairs nevajadzētu apskatīt lauku","Lai novērstu kultūrauga fotosintēzi","Lai noteiktu tikai lauka garumu"],"why":"Monitorings palīdz izvērtēt rezultātus un cēloņus.","source":"KL"},{"id":"EXT091","topic":"Latvāņi un karantīna","q":"Kāda aizsardzība jāizmanto latvāņu ierobežošanā?","opts":["Neccaurlaidīgs apģērbs, cimdi un sejas un acu aizsardzība","Tikai saulesbrilles","Tikai cepure","Nav vajadzīga aizsardzība"],"why":"Jānovērš šūnsulas saskare ar ādu un gļotādām.","source":"LAT"},{"id":"EXT092","topic":"Latvāņi un karantīna","q":"Kā rīkoties, ja latvāņa šūnsula nokļūst uz ādas?","opts":["Nekavējoties mazgāt un sargāt ādu no saules","Ierīvēt ar eļļu un sauļoties","Nekā nedarīt","Uzklāt vairāk šūnsulas"],"why":"Mācību materiālā norādīta mazgāšana ar ūdeni un ziepēm un aizsardzība no saules.","source":"LAT"},{"id":"EXT093","topic":"Latvāņi un karantīna","q":"Kā novērst latvāņa sēklu izplatīšanos?","opts":["Nepieļaut sēklu nobriešanu un izbiršanu","Nogriezto ziedkopu atstāt ar nobriedušām sēklām","Pārvadāt sēklas pa laukiem","Lietot piesārņotu tehniku bez tīrīšanas"],"why":"Sēklu ražošanas pārtraukšana ir svarīga ierobežošanas daļa.","source":"LAT"},{"id":"EXT094","topic":"Latvāņi un karantīna","q":"Kāpēc latvāņu ierobežošana jāatkārto vairākus gadus?","opts":["Augsnē saglabājas sēklu krājumi","Tāpēc ka tie nevairojas","Jo viena pļaušana iznīcina visas sēklas","Jo augi nekad neataug"],"why":"Sēklu banka un atkārtota sadīgšana prasa ilgtermiņa kontroli.","source":"LAT"},{"id":"EXT095","topic":"Latvāņi un karantīna","q":"Kā darbojas gaismas necaurlaidīga mulča pret latvāni?","opts":["Bloķē gaismu un fotosintēzi","Veicina ziedēšanu","Palielina sēklu dīgšanu bez ierobežošanas","Nekādi neietekmē augu"],"why":"Nosegšana ir viena no mehāniskās ierobežošanas iespējām.","source":"LAT"},{"id":"EXT096","topic":"Latvāņi un karantīna","q":"Kāds ir centrālās rozetes izduršanas mērķis?","opts":["Iznīcināt auga augšanas punktu zem augsnes virsmas","Palielināt sēklu ražu","Nogriez tikai lapu galus","Uzlabot sēklu izplatību"],"why":"Mērķēta izduršana var iznīcināt atsevišķus latvāņus.","source":"LAT"},{"id":"EXT097","topic":"Latvāņi un karantīna","q":"Kas jādara ar darba rīkiem pēc saskares ar latvāņu sulu?","opts":["Rūpīgi jānotīra, nepieļaujot ādas saskari","Nekavējoties jālieto pārtikas gatavošanai","Jāatstāj bez tīrīšanas","Jānoslauka ar kailu roku"],"why":"Piesārņota aprīkojuma droša tīrīšana samazina saskares risku.","source":"LAT"},{"id":"EXT098","topic":"Latvāņi un karantīna","q":"Vai latvāņu pļaušana vienreiz vienmēr iznīcina audzi?","opts":["Nē, parasti vajag atkārtotu un ilgstošu ierobežošanu","Jā, jebkurā gadījumā","Tikai tad, ja līst","Tikai ziemas salā"],"why":"Pļaušana ierobežo ziedēšanu, taču augi var ataugt.","source":"LAT"},{"id":"EXT099","topic":"Latvāņi un karantīna","q":"Kur skatīt Sosnovska latvāņa izplatības informāciju Latvijā?","opts":["VAAD pieejamajos kartes un informācijas resursos","Tikai veikala čekā","Tikai AAL iepakojuma svītrkodā","Tikai tehnikas instrukcijā"],"why":"VAAD materiāli norāda uz kartes informācijas resursiem.","source":"LAT"},{"id":"EXT100","topic":"Nezāļu bioloģija","q":"Kāpēc nezāles samazina kultūraugu ražu?","opts":["Konkurē par ūdeni, barības vielām un gaismu","Vienmēr uzlabo ražu","Tām nav sakņu","Tās nekad neizmanto mitrumu"],"why":"Nezāles ir kultūraugu konkurentes.","source":"NE"},{"id":"EXT103","topic":"Nezāļu bioloģija","q":"Kāpēc nezāles var apgrūtināt ražas novākšanu?","opts":["Palielina zaļo masu un piesārņo ražu","Vienmēr palielina graudu tīrību","Tās nekad nenobriest","Tās automātiski uzlabo kombainu"],"why":"Daudzas nezāles var sarežģīt kulšanu un ražas tīrīšanu.","source":"NE"},{"id":"EXT104","topic":"Nezāļu bioloģija","q":"Kas ir ģeneratīvā vairošanās?","opts":["Vairošanās ar sēklām vai citām dzimumvairošanās struktūrām","Tikai sakneņu veidošanās","Tikai dzinumu sakņošanās","Tikai stublāju augšana"],"why":"Daudzas īsmūža nezāles izplatās ar sēklām.","source":"NE"},{"id":"EXT105","topic":"Nezāļu bioloģija","q":"Kā nezāļu sēklas var izplatīties ar dzīvniekiem?","opts":["Ar pieķeršanās veidojumiem vai ārēju pārnešanu","Tikai pārvēršoties saknēs","Tās nevar tikt pārnestas","Tikai ar smidzinātāju"],"why":"Āķīši un citas struktūras var palīdzēt sēklām pieķerties.","source":"NE"},{"id":"EXT106","topic":"Nezāļu bioloģija","q":"Kāds ir viens nezāļu lidpūku uzdevums?","opts":["Palīdz sēklu izplatīšanai ar vēju","Uzņem slāpekli","Samazina sēklu skaitu līdz nullei","Veido sakneņus"],"why":"Pieneņu un usņu sēklu izplatīšanos veicina vējš.","source":"NE"},{"id":"EXT107","topic":"Nezāļu bioloģija","q":"Kāpēc nezāļu sēklas ne vienmēr sadīgst vienlaikus?","opts":["Tām var būt atšķirīgs miera periods un dīgšanas prasības","Visas sēklas ir nedzīvas","Tās vienmēr dīgst vienā stundā","Dīgšanu ietekmē tikai lauka izmērs"],"why":"Sēklu miera periods palīdz izdzīvot nelabvēlīgos apstākļos.","source":"NE"},{"id":"EXT108","topic":"Nezāļu bioloģija","q":"Kāda ir nezāļu starpsaimnieka loma?","opts":["Var uzturēt slimības vai kaitēkļus, kas skar kultūraugus","Vienmēr pilnībā iznīcina slimības","Aizvieto kultūraugus mēslošanā","Nav saistīta ar kaitēkļiem"],"why":"Daļa nezāļu ir alternatīvi saimniekaugi.","source":"NE"},{"id":"EXT109","topic":"Nezāļu bioloģija","q":"Kas ir potenciālā nezāļainība?","opts":["Dzīvotspējīgo nezāļu sēklu un vairošanās orgānu krājumi augsnē","Tikai redzamie ziedi","Tikai jau nopļautās nezāles","Graudu mitrums"],"why":"Potenciālā nezāļainība var ievērojami pārsniegt redzamo.","source":"NE"},{"id":"EXT110","topic":"Nezāļu bioloģija","q":"Kas ir faktiskā nezāļainība?","opts":["Konkrētajā brīdī laukā esošās nezāles","Tikai sēklas ļoti dziļi augsnē","Tikai augsnes akmeņi","Tikai nākamā gada sējums"],"why":"Faktisko nezāļainību novērtē ar lauka apsekojumu.","source":"NE"},{"id":"EXT111","topic":"Nezāļu bioloģija","q":"Kāpēc nezāļu agrīna noteikšana ir vērtīga?","opts":["Var izvēlēties savlaicīgu un mērķētu ierobežošanu","Nezāles pēc atpazīšanas izzūd pašas","Tas aizstāj visu agrotehniku","Tas novērš jebkādu augsnes eroziju"],"why":"Agrīna identifikācija atbalsta integrētu augu aizsardzību.","source":"NE"},{"id":"EXT112","topic":"AAL drošība","q":"Ko darīt, ja smidzināšanas laikā rodas stiprs vējš?","opts":["Pārtraukt vai neveikt apstrādi neatbilstošos apstākļos","Palielināt devu","Turpināt neatkarīgi no marķējuma","Noņemt aizsarglīdzekļus"],"why":"Vējš palielina aizneses risku.","source":"AA"},{"id":"EXT113","topic":"AAL drošība","q":"Kāpēc jāievēro aizsargjoslas pie ūdeņiem?","opts":["Lai mazinātu AAL nonākšanu ūdens vidē","Lai palielinātu aiznesi","Lai būtu vieglāk palielināt devu","Lai nevajadzētu kalibrēt smidzinātāju"],"why":"Aizsargjoslas ir svarīga vides riska mazināšanas daļa.","source":"AA"},{"id":"EXT114","topic":"AAL drošība","q":"Kas jādara pirms darba ar AAL?","opts":["Jāizlasa aktuālais marķējums un jāizmanto noteiktie aizsarglīdzekļi","Jāizvēlas deva pēc izjūtas","Jāignorē lietošanas nosacījumi","Jāatstāj līdzeklis bez marķējuma"],"why":"Marķējums nosaka drošu un atļautu lietošanu.","source":"AA"},{"id":"EXT115","topic":"AAL drošība","q":"Kā rīkoties aizdomu par AAL saindēšanos gadījumā?","opts":["Pārtraukt iedarbību un nekavējoties meklēt medicīnisku palīdzību","Turpināt darbu","Izraisīt vemšanu jebkurā situācijā","Ignorēt simptomus"],"why":"Jāievēro pirmās palīdzības informācija marķējumā un jāsazinās ar palīdzības dienestu.","source":"AA"},{"id":"EXT116","topic":"AAL drošība","q":"Kāpēc jālieto piemēroti individuālie aizsardzības līdzekļi?","opts":["Lai mazinātu iedarbību uz ādu, acīm un elpceļiem","Tikai, lai pasargātu apģērba krāsu","Lai paaugstinātu devu","Lai nebūtu jākalibrē tehnika"],"why":"Nepieciešamie aizsarglīdzekļi ir atkarīgi no līdzekļa un darba.","source":"AA"},{"id":"EXT117","topic":"AAL drošība","q":"Kāpēc svarīgi kalibrēt smidzinātāju?","opts":["Lai nodrošinātu paredzēto izsmidzinājuma normu un vienmērīgumu","Lai mainītu lauka robežas","Lai aizstātu marķējumu","Lai pilnībā novērstu vēju"],"why":"Kalibrēšana palīdz nepieļaut pārmērīgu vai nepietiekamu devu.","source":"AA"},{"id":"EXT118","topic":"AAL drošība","q":"Ko darīt nejaušas AAL noplūdes gadījumā?","opts":["Norobežot risku un ievērot drošības datu un ārkārtas norādījumus","Noskalot visu nekontrolēti ūdenstecē","Turpināt darbu bez aizsardzības","Atstāt noplūdi bez uzmanības"],"why":"Rīcība jāpielāgo vielai un tās drošības instrukcijai.","source":"AA"},{"id":"EXT119","topic":"AAL drošība","q":"Kāpēc nedrīkst lietot nelegālu vai viltotu AAL?","opts":["Nav uzticamas kontroles par sastāvu, drošumu un atļautu lietojumu","Jo tas vienmēr ir identisks reģistrētam","Jo tam vienmēr ir garāks derīgums","Jo tas nekad nedarbojas"],"why":"Nezināms sastāvs rada riskus cilvēkiem, kultūraugiem un videi.","source":"AA"},{"id":"EXT120","topic":"AAL drošība","q":"Kas jāpārbauda AAL iegādes laikā?","opts":["Reģistrācija, marķējums un legāla izcelsme","Tikai krāsa","Tikai reklāmas sauklis","Tikai pudeles augstums"],"why":"Atļautie līdzekļi jāiegādājas no legāliem avotiem.","source":"AA"},{"id":"EXT121","topic":"AAL drošība","q":"Kāpēc jāizvairās no AAL aizneses?","opts":["Lai neskaru blakus teritorijas, cilvēkus un ūdeņus","Lai samazinātu kultūrauga augstumu","Lai pagarinātu šļūteni","Lai palielinātu vēja ātrumu"],"why":"Aiznese var radīt kaitējumu ārpus apstrādes zonas.","source":"AA"},{"id":"EXT122","topic":"AAL drošība","q":"Kāpēc svarīgs nogaidīšanas laiks līdz ražas novākšanai?","opts":["Tas ir daļa no marķējuma nosacījumiem atliekvielu riska kontrolei","Tas vienmēr ir nulle dienu","Tas attiecas tikai uz traktoru","Tas nav saistīts ar AAL lietošanu"],"why":"Jāievēro konkrētā līdzekļa marķējumā noteiktais nogaidīšanas laiks.","source":"AA"},{"id":"ADV001","topic":"Tehnika un aprēķini","q":"Lauks 8 ha, darba šķidruma norma 200 l/ha. Cik litru šķidruma vajadzēs?","opts":["1600 l","1800 l","800 l","208 l"],"why":"Tilpums = platība × norma = 8 × 200 = 1600 l.","source":"PRACT","image":"ADVIMG_sprayer"},{"id":"ADV002","topic":"Tehnika un aprēķini","q":"Lauks 12 ha, darba šķidruma norma 150 l/ha. Cik litru šķidruma vajadzēs?","opts":["1800 l","2000 l","900 l","162 l"],"why":"Tilpums = platība × norma = 12 × 150 = 1800 l.","source":"PRACT","image":"ADVIMG_sprayer"},{"id":"ADV003","topic":"Tehnika un aprēķini","q":"Lauks 5 ha, darba šķidruma norma 250 l/ha. Cik litru šķidruma vajadzēs?","opts":["1250 l","1450 l","625 l","255 l"
