# Claude API proxy for "Jautā asistentam" (assets/assistant.js). Include inside the site's server {}.
# The API key lives only on the server in /etc/nginx/anthropic-key.conf (mode 600), one line:
#   proxy_set_header x-api-key "sk-ant-...";
# Needs the rate-limit zone from nginx-claude-zone.conf in the http {} context (/etc/nginx/conf.d/).

location = /api/claude/status { default_type text/plain; return 200 "ok"; }

location = /api/claude/messages {
    limit_except POST { deny all; }
    limit_req zone=claude burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;

    proxy_pass https://api.anthropic.com/v1/messages;
    proxy_ssl_server_name on;
    proxy_set_header Host api.anthropic.com;
    include /etc/nginx/anthropic-key.conf;
    # Same-origin request from our page: do not forward browser identity to the API.
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_read_timeout 300s;
}
