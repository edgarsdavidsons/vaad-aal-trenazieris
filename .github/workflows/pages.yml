name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Merge new questions into the main trainer
        run: python3 scripts/merge_questions.py
      - name: Validate merged question bank
        run: |
          python3 - <<'PY'
          import re,json,os
          s=open('index.html',encoding='utf-8').read()
          match=re.search(r'<script type="application/json" id="app-data">(.*?)</script>',s,re.S)
          assert match, 'Missing main data'
          questions=json.loads(match.group(1))['questions']
          assert len(questions)>=300, f'Expected >=300 questions, got {len(questions)}'
          assert len(set(q['id'] for q in questions)) == len(questions), 'Duplicate question IDs'
          data=json.loads(match.group(1))
          assert len(data['weeds']) == 38, 'Weed gallery incomplete'
          for weed in data['weeds']:
            key=str(weed['id'])
            assert data['images'].get(key,'').startswith('data:image/'), f'Broken gallery photo: {key}'
          for question in questions:
            if question.get('image'):
              value=data['images'].get(str(question['image']),'')
              # Atlas photos are committed files in assets/atlas/; everything else is embedded.
              assert value.startswith('data:image/') or (value.startswith('assets/atlas/') and os.path.isfile(value)), f'Broken image question: {question["id"]}'
          print('All 38 gallery photos and every illustrated question validated')
          print(f'Validated {len(questions)} questions')
          PY
      - name: Commit unified index to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build unified VAAD trainer question bank [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
